<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Höststegen – spel & tabeller · Båstad Stegen</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0D2E20; --card:#0D2A1D; --card2:#133124; --border:#1C3A2B; --border2:#2A5A42;
    --clay:#FF8C42; --clay2:#C43E00; --cream:#F5EDE3; --white:#fff;
    --muted:rgba(255,255,255,.66); --muted2:rgba(255,255,255,.5); --lime:#D7F23C; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:'Outfit',-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;font-size:16px}
  .wrap{max-width:640px;margin:0 auto;padding:0 14px 40px}
  .hero{position:relative;width:100%;height:clamp(160px,46vw,240px);overflow:hidden;background:#0a2016}
  .hero .herobg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .hero .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,23,18,.35) 0%,rgba(13,46,32,0) 45%,var(--bg) 100%)}
  .hero .herologo{position:absolute;left:16px;top:12px;height:clamp(120px,32vw,180px);width:auto;z-index:2;filter:drop-shadow(0 3px 12px rgba(0,0,0,.6))}
  .top{background:var(--bg);border-bottom:1px solid var(--border);padding:14px 0 0;margin-top:-1px}
  .top .wrap{padding-bottom:0}
  .rndbadge{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;
    background:rgba(255,140,66,.12);border:1px solid rgba(255,140,66,.35);color:var(--clay);padding:6px 14px;border-radius:100px;display:inline-block;margin-bottom:14px}
  .tabs{display:flex;border-bottom:1px solid var(--border)}
  .tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
    font-family:'Outfit';font-size:14px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
    padding:15px 0;cursor:pointer}
  .tab.active{color:var(--white);border-bottom-color:var(--clay)}
  .loginbar{padding:2px 0 12px}
  .lhint{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .lrow{display:flex;gap:8px;align-items:center}
  .lrow select{flex:1;min-width:0;background:#0a2016;border:1px solid var(--border2);border-radius:8px;color:var(--white);font:inherit;font-size:14px;padding:10px}
  .lrow input{width:74px;flex:0 0 74px;background:#0a2016;border:1px solid var(--border2);border-radius:8px;color:var(--white);font:inherit;font-size:14px;padding:10px;text-align:center}
  .lrow .lbtn{flex:0 0 auto;background:var(--clay);color:#3a1400;border:0;border-radius:8px;font:inherit;font-weight:700;font-size:14px;padding:10px 14px;cursor:pointer;white-space:nowrap}
  .lin{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .lin .lbtn{background:none;border:1px solid var(--border2);color:var(--muted);border-radius:8px;font:inherit;font-size:11px;padding:7px 12px;cursor:pointer}
  .lerr{color:var(--clay);font-size:12px;margin-top:6px}
  .grp{margin:20px 0 0}
  .ghead{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 10px;padding:0 2px}
  .ghead h2{font-family:'Anton',sans-serif;font-size:24px;letter-spacing:2px;color:var(--white);margin:0}
  .glvl{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--clay)}
  .prow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);
    border-left:3px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:7px;cursor:pointer}
  .prow:active{transform:scale(.995)}
  .prow-arrow{font-style:normal;color:var(--muted2);font-size:20px;margin-left:-4px}
  .prow.up{border-left-color:var(--cream)}
  .prow.down{border-left-color:var(--clay)}
  .rnum{font-family:'Anton',sans-serif;font-size:30px;line-height:1;color:rgba(245,237,227,.16);width:30px;text-align:center;flex:0 0 30px}
  .prow.up .rnum{color:rgba(245,237,227,.75)}
  .prow.down .rnum{color:rgba(255,140,66,.6)}
  .pinfo{flex:1;min-width:0}
  .pname{font-weight:700;font-size:16px;color:var(--white)}
  .pmeta{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--muted2);margin-top:3px}
  .form{display:flex;gap:4px;margin-top:7px}
  .vf{width:19px;height:19px;border-radius:5px;font-family:'Space Mono',monospace;font-size:10px;font-weight:700;
    display:flex;align-items:center;justify-content:center}
  .vf.v{background:var(--clay);color:#3a1400}
  .vf.f{background:transparent;border:1px solid var(--border2);color:var(--muted2)}
  .pdiff{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--cream);min-width:34px;text-align:right}
  details.macc{margin:8px 0 0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card)}
  details.macc summary{list-style:none;cursor:pointer;padding:12px 14px;font-family:'Space Mono',monospace;font-size:10px;
    letter-spacing:2px;text-transform:uppercase;color:var(--clay);display:flex;justify-content:space-between;align-items:center}
  details.macc summary::-webkit-details-marker{display:none}
  details.macc summary .cnt{color:var(--muted2)}
  details.macc summary::after{content:'▾';color:var(--muted2)}
  details.macc[open] summary::after{content:'▴'}
  .matches{padding:4px 12px 12px;border-top:1px solid var(--border)}
  .dayhdr{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--cream);
    background:var(--card2);border-radius:7px;padding:6px 10px;margin:12px 0 6px}
  .match{padding:11px 2px;border-top:1px solid var(--border)}
  .match:first-of-type{border-top:0}
  .names{display:flex;justify-content:space-between;gap:10px;font-size:15px;color:var(--white)}
  .names .b{text-align:right}
  .names .win{font-weight:700;color:var(--clay)}
  .score-row{display:flex;align-items:center;gap:9px;margin-top:10px}
  .score-row input{flex:1;min-width:0;height:46px;text-align:center;font:inherit;font-size:20px;font-weight:700;
    background:#0a2016;border:1px solid var(--border2);border-radius:10px;color:var(--white)}
  .score-row .vs{color:var(--muted2);font-weight:700}
  .score-row .sv{height:46px;padding:0 18px;background:var(--clay);color:#3a1400;border:0;border-radius:10px;
    font:inherit;font-weight:800;cursor:pointer;flex:0 0 auto}
  .sets{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .setrow{display:flex;align-items:center;gap:9px}
  .setrow .setlbl{flex:0 0 70px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted2)}
  .setrow input{flex:1;min-width:0;height:46px;text-align:center;font:inherit;font-size:20px;font-weight:700;background:#0a2016;border:1px solid var(--border2);border-radius:10px;color:var(--white)}
  .setrow .vs{color:var(--muted2);font-weight:700}
  .awin{min-height:16px;font-size:13px;font-weight:700;margin-top:9px;text-align:center}
  .sv.wide{display:block;width:100%;height:46px;margin-top:10px;background:var(--clay);color:#3a1400;border:0;border-radius:10px;font:inherit;font-weight:800;font-size:15px;cursor:pointer}
  .result{text-align:center;font-family:'Anton',sans-serif;font-size:26px;letter-spacing:2px;color:var(--white);margin-top:8px}
  .cmt{width:100%;font:inherit;font-size:14px;padding:10px 12px;margin-top:9px;background:#0a2016;border:1px solid var(--border2);border-radius:10px;color:var(--white)}
  .cmt::placeholder{color:var(--muted2)}
  .mcmt{font-size:13px;color:var(--cream);background:var(--card2);border-left:3px solid var(--clay);border-radius:6px;padding:8px 11px;margin-top:9px;font-style:italic}
  .mmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px;
    font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.5px;color:var(--muted2)}
  .mmeta a{color:var(--clay);text-decoration:none}
  .mmeta .later{color:var(--clay)}
  .editlink{background:none;border:0;color:var(--clay);font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;cursor:pointer;padding:4px 0}
  .legend{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--muted2);margin:18px 2px 0;display:flex;gap:16px;flex-wrap:wrap;text-transform:uppercase}
  .legend b{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin-right:5px}
  .state{text-align:center;color:var(--muted2);padding:26px;font-size:14px}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
  .pcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;cursor:pointer}
  .pcard:active{transform:scale(.98)}
  .pav{width:64px;height:64px;border-radius:50%;margin:0 auto 8px;background:var(--card2);border:1.5px solid var(--border2);
    display:flex;align-items:center;justify-content:center;font-family:'Anton',sans-serif;font-size:22px;color:var(--muted);overflow:hidden}
  .pav img{width:100%;height:100%;object-fit:cover}
  .pcard .pn{font-weight:700;font-size:14px;color:#fff}
  .pcard .pg{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--clay);margin-top:3px}
  .pcard .ps{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted2);margin-top:4px}
  .pmodal{display:none;position:fixed;inset:0;background:rgba(6,18,13,.75);z-index:50;padding:18px;overflow:auto}
  .pmodal.open{display:flex}
  .pbox{background:var(--card);border:1px solid var(--border2);border-radius:16px;max-width:420px;width:100%;margin:auto;overflow:hidden}
  .pbox .ph{position:relative;background:var(--card2);padding:24px 22px}
  .pbox .pclose{position:absolute;right:12px;top:8px;background:none;border:0;color:var(--muted);font-size:26px;cursor:pointer;line-height:1}
  .pbox .pav-lg{width:110px;height:110px;border-radius:50%;margin:0 auto 12px;background:#0a2016;border:2px solid var(--clay);
    display:flex;align-items:center;justify-content:center;font-family:'Anton',sans-serif;font-size:40px;color:var(--muted);overflow:hidden}
  .pbox .pav-lg img{width:100%;height:100%;object-fit:cover}
  .pbox h3{font-family:'Anton',sans-serif;font-size:26px;letter-spacing:1px;color:#fff;margin:0;text-align:center}
  .pbox .pgr{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--clay);margin-top:5px;text-align:center}
  .pfacts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
  .pfact{background:var(--card);padding:11px 14px}
  .pfact .k{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--muted2)}
  .pfact .v{font-size:14px;color:#fff;margin-top:2px}
  .pbio{padding:14px 16px;font-size:14px;color:var(--cream);line-height:1.55;font-style:italic;border-top:1px solid var(--border)}
  .pstats{padding:14px 16px;border-top:1px solid var(--border)}
  .pstats:empty{display:none}
  .pst-h{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted2);margin-bottom:10px}
  .pst-row{display:flex;gap:1px;background:var(--border);border-radius:10px;overflow:hidden}
  .pst{flex:1;background:var(--card);padding:11px 6px;text-align:center}
  .pst .pn{font-family:'Anton',sans-serif;font-size:25px;color:var(--clay);line-height:1}
  .pst .pk{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);margin-top:4px}
  .pst-extra{font-size:12.5px;color:var(--cream);margin-top:11px;text-align:center}
  .pmatches{padding:14px 16px;border-top:1px solid var(--border)}
  .pmatches:empty{display:none}
  .pmrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
  .pmrow:last-child{border-bottom:0}
  .pmres{flex:0 0 auto;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Anton',sans-serif;font-size:12px}
  .pmres.v{background:#1f6d3a;color:#c9f5d6} .pmres.f{background:#5a2a20;color:#ffb3a6}
  .pmopp{flex:1;min-width:0;font-size:14px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pmsc{flex:0 0 auto;font-family:'Space Mono',monospace;font-size:13px;color:var(--cream)}
  .pmd{flex:0 0 auto;font-family:'Space Mono',monospace;font-size:10px;color:var(--muted2);min-width:44px;text-align:right}
  .confirmbar{margin:14px 0 0}
  .cnote{background:var(--card2);border:1px solid var(--border2);border-radius:10px;padding:9px 13px;font-size:13px;color:var(--cream);margin-bottom:8px}
  .cbx{background:var(--card);border:1px solid var(--clay);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .ctxt{font-weight:700;font-size:14px;color:#fff}
  .cbtns{display:flex;gap:8px}
  .cyes,.cno{border:1px solid var(--border2);background:#0a2016;color:var(--cream);border-radius:8px;font:inherit;font-size:13px;font-weight:700;padding:9px 13px;cursor:pointer}
  .cyes.on{background:var(--clay);color:#3a1400;border-color:var(--clay)}
  .cno.on{background:#3a1e14;color:#F0997B;border-color:#7a3a22}
  .cchk{color:#9be29b;font-size:12px;font-weight:700} .cx{color:#ff5b4d;font-size:12px;font-weight:700}
  .upc-day{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--clay);margin:20px 0 9px}
  .upc{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--border2);border-radius:13px;padding:13px 14px;margin-bottom:9px}
  .upc.mine{border-color:var(--clay);background:#241811}
  .upc .t{flex:0 0 auto;text-align:center;min-width:66px}
  .upc .t .hh{font-family:'Anton',sans-serif;font-size:27px;color:#fff;line-height:1;letter-spacing:.5px}
  .upc .who{flex:1;min-width:0}
  .upc .who .pl{font-size:16px;font-weight:700;color:#fff;line-height:1.3}
  .upc .who .pl .upl{cursor:pointer;text-decoration:underline;text-decoration-color:rgba(255,255,255,.28);text-underline-offset:3px}
  .upc .who .pl .upl:active{color:var(--clay)}
  .upc .who .gp{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted2);text-transform:uppercase;margin-top:4px;letter-spacing:.5px}
  .upc .who .gp .din{color:var(--clay);font-weight:700}
  .upc .ct{flex:0 0 auto;text-align:center;background:#0a2016;border:1px solid var(--border2);border-radius:11px;padding:6px 11px;min-width:58px}
  .upc.mine .ct{border-color:var(--clay)}
  .upc .ct .ct-l{display:block;font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted2)}
  .upc .ct .ct-n{display:block;font-family:'Anton',sans-serif;font-size:25px;color:var(--clay);line-height:1.05;margin-top:1px}
  .upc .mine-badge{flex:0 0 auto;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#3a1400;background:var(--clay);padding:4px 9px;border-radius:100px}
  .cmini{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--border2);border-radius:10px;padding:9px 13px;font-size:13.5px;font-weight:700}
  .cmini-ok{color:#9be29b} .cmini-no{color:#ff7a6d}
  .clink{background:none;border:0;color:var(--clay);font:inherit;font-size:13px;font-weight:700;text-decoration:underline;cursor:pointer;padding:2px 4px}
  .clocked{font-size:11.5px;font-weight:600;color:var(--muted2);text-align:right}
  .sitefoot{margin:34px 0 10px;padding:22px 4px;border-top:1px solid var(--border);text-align:center}
  .sitefoot .ff-brand{font-family:'Anton',sans-serif;font-size:16px;letter-spacing:1px;color:var(--clay)}
  .sitefoot .ff-admin{font-size:13px;color:var(--muted2);margin-top:8px}
  .sitefoot .ff-links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .sitefoot .ff-links a{color:#fff;text-decoration:none;font-weight:700;font-size:14px;background:var(--card);border:1px solid var(--border2);border-radius:100px;padding:9px 16px}
  .repbtn{display:block;width:100%;margin-top:8px;background:var(--clay);color:#3a1400;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:800;font-size:15px;cursor:pointer}
  .repbtn:active{transform:scale(.99)}
</style>
</head>
<body>
<div class="hero">
  <img class="herobg" src="host-banner.webp" alt="Höstbana med fallande löv" fetchpriority="high">
  <div class="veil"></div>

</div>
<div class="top">
  <div class="wrap">
    <div class="rndbadge" id="rndbadge">Omgång –</div>
    <div class="loginbar" id="loginbar"></div>
    <div class="tabs">
      <button class="tab active" data-div="H" id="tab-H">Herr</button>
      <button class="tab" data-div="D" id="tab-D">Dam</button>
      <button class="tab" data-div="M" id="tab-M">Matcher</button>

    </div>
  </div>
</div>
<div class="wrap">
  <div class="confirmbar" id="confirmbar"></div>
  <div id="body"><div class="state">Laddar…</div></div>
  <div class="legend">
    <span><b style="background:#F5EDE3"></b>Går upp</span>

</div>

  <div class="ff-admin">Frågor eller ändringar? Kontakta Admin — Joaquim Nicander</div>
  <div class="ff-links">
    <a href="tel:0720787845">📱 0720-787845</a>

  </div>
</footer></div>
<div id="profmodal" class="pmodal" onclick="if(event.target===this)closeProfile()"></div>
<div id="cantmodal" class="pmodal" onclick="if(event.target===this)closeCant()"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/bts-data.js"></script>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const escAttr=s=>esc(s).replace(/"/g,'&quot;');
let ROUND=1, INFO=null, ST=[], MATCHES=[], DIV='H', PLAYERS=[], PROFILES=[], ME=null, WEEK=1, ATT={}, NOTE='', CONFIRM_EDIT=false;
function expandConfirm(){ CONFIRM_EDIT=true; renderConfirm(); }
const OPEN=new Set();
function onToggle(key,el){ if(el.open) OPEN.add(key); else OPEN.delete(key); }
try{ ME=JSON.parse(localStorage.getItem('bts_host_me')||'null'); }catch(e){ ME=null; }

async function load(){
  INFO=await BTS.hostPoolInfo(); ROUND=INFO.current_round;
  document.getElementById('rndbadge').textContent='Omgång '+ROUND;
  [ST,MATCHES,PLAYERS]=await Promise.all([BTS.hostPoolStandings(ROUND), BTS.hostPoolMatches(ROUND), BTS.getPlayers()]);
  try{ PROFILES = BTS.hostPoolProfiles ? (await BTS.hostPoolProfiles(ROUND)) : []; }catch(e){ PROFILES=[]; }
  try{ const a=BTS.hostActive?await BTS.hostActive():{week:1,note:''}; WEEK=a.week||1; NOTE=a.note||'';
       const ar=BTS.hostAttendance?await BTS.hostAttendance(ROUND,WEEK):[]; ATT={}; ar.forEach(x=>{ATT[x.player_id]=x.playing;}); }catch(e){ ATT={}; }
  if(ME){ const row=ST.find(r=>r.player_id===ME.id); if(row){ DIV=row.division; OPEN.add(row.division+'-'+row.label); } }
  { const h=(location.hash||'').replace('#','').toLowerCase(); const map={matcher:'M',spelare:'S',herr:'H',dam:'D'}; if(map[h]) DIV=map[h]; }
  renderLogin(); renderConfirm(); render();
}
window.addEventListener('hashchange',()=>{ const h=(location.hash||'').replace('#','').toLowerCase(); const map={matcher:'M',spelare:'S',herr:'H',dam:'D'}; if(map[h]){ DIV=map[h]; render(); } });
function renderLogin(){
  const el=document.getElementById('loginbar'); if(!el) return;
  if(ME){
    el.innerHTML=`<div class="lin"><span>Inloggad: <b style="color:var(--cream);font-weight:700">${esc(ME.name)}</b></span><button class="lbtn" onclick="logout()">Logga ut</button></div>`;
    return;
  }
  const roster=[...new Map(ST.map(r=>[r.player_id,r.name])).entries()].map(([id,name])=>({id,name})).sort((a,b)=>a.name.localeCompare(b.name,'sv'));
  const opts='<option value="">Välj ditt namn…</option>'+roster.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  el.innerHTML=`<div class="lhint">Logga in för att rapportera · PIN = 4 sista i mobilnr</div>

    </div>
    <div class="lerr" id="me-err"></div>`;
}
async function doLogin(){
  const id=parseInt((document.getElementById('me-name')||{}).value||'');
  const pin=((document.getElementById('me-pin')||{}).value||'').trim();
  const err=document.getElementById('me-err');
  if(!id){ if(err) err.textContent='Välj ditt namn.'; return; }
  try{
    const ok=await BTS.hostPinOk(id,pin);
    if(!ok){ if(err) err.textContent='Fel PIN — försök igen.'; return; }
    const row=ST.find(x=>x.player_id===id);
    ME={id, name:row?row.name:'', pin};
    localStorage.setItem('bts_host_me', JSON.stringify(ME));
    if(row){ DIV=row.division; OPEN.add(row.division+'-'+row.label); }
    renderLogin(); render();
    goReport();
  }catch(e){ if(err) err.textContent='Kunde inte logga in.'; }
}
function logout(){ ME=null; localStorage.removeItem('bts_host_me'); renderLogin(); renderConfirm(); render(); }
function renderConfirm(){
  const el=document.getElementById('confirmbar'); if(!el) return;

  const noteHtml = NOTE ? `<div class="cnote">📍 ${esc(NOTE)}</div>` : '';
  if(canConfirm){
    const st=ATT[ME.id]; const yes=st===true, no=st===false; const answered=yes||no;
    const myM=MATCHES.filter(m=>(m.matchday||0)===WEEK && (m.a_id===ME.id||m.b_id===ME.id));
    const locked=myM.some(m=>m.status==='done' || m.defer_note || (m.play_date && String(m.start_time||'').trim()));
    if(answered && !CONFIRM_EDIT){
      el.innerHTML = noteHtml + `<div class="cmini">${yes
          ? '<span class="cmini-ok">✓ Du spelar spelomgång '+WEEK+'</span>'
          : '<span class="cmini-no">✕ Du kan inte spelomgång '+WEEK+'</span>'}
        ${locked ? '<span class="clocked">🔒 Matchen är satt – kontakta Admin för ändring</span>' : '<button class="clink" onclick="expandConfirm()">Ändra</button>'}</div>
        <button class="repbtn" onclick="goReport()">Rapportera dina matcher →</button>`;
    } else if(answered && CONFIRM_EDIT && locked){
      CONFIRM_EDIT=false;
      el.innerHTML = noteHtml + `<div class="cmini"><span class="clocked">🔒 Din match är satt – kontakta Admin om något ändras</span></div>
        <button class="repbtn" onclick="goReport()">Rapportera dina matcher →</button>`;
    } else {
      el.innerHTML = noteHtml + `<div class="cbx">
        <div class="ctxt">Spelomgång ${WEEK} · spelar du kommande söndag?</div>
        <div class="cbtns">
          <button class="cyes ${yes?'on':''}" onclick="confirmPlay(true)">✓ Jag spelar</button>
          <button class="cno ${no?'on':''}" onclick="confirmPlay(false)">Kan inte</button>
        </div></div>
        <button class="repbtn" onclick="goReport()">Rapportera dina matcher →</button>`;
    }
  } else {
    el.innerHTML = noteHtml + `<button class="repbtn" onclick="focusLogin()">Logga in för att rapportera &amp; bekräfta →</button>`;
  }
}
function focusLogin(){ const s=document.getElementById('me-name'); if(s){ s.scrollIntoView({behavior:'smooth',block:'center'}); setTimeout(()=>s.focus(),300); } }
function goReport(){
  if(!ME) return; const row=ST.find(r=>r.player_id===ME.id); if(!row) return;
  DIV=row.division; OPEN.add(row.division+'-'+row.label); render();
  setTimeout(()=>{ const h=[...document.querySelectorAll('.grp .ghead h2')].find(x=>x.textContent.trim()==='Grupp '+row.label);
    if(h) h.scrollIntoView({behavior:'smooth',block:'start'}); },60);
}
async function confirmPlay(playing){
  if(!ME) return;
  try{ await BTS.hostConfirm(ME.id, ME.pin, playing);
    const ar=await BTS.hostAttendance(ROUND,WEEK); ATT={}; ar.forEach(x=>{ATT[x.player_id]=x.playing;});
    CONFIRM_EDIT=false; renderConfirm(); render();
    if(playing===false) openCant();
  }catch(e){ alert('Kunde inte spara: '+(e.message||e)); }
}
function myWeekMatches(){
  if(!ME) return [];
  return MATCHES.filter(m=>(m.matchday||0)===WEEK && (m.a_id===ME.id||m.b_id===ME.id) && m.status!=='done');
}
function openCant(){
  const mm=myWeekMatches();
  const opp=mm.length ? mm.map(m=>m.a_id===ME.id?m.b_name:m.a_name).join(', ') : '';
  const mid=mm.length?mm[0].id:0;
  const rescheduleBox = mm.length ? `
    <div style="border-top:1px solid var(--border);padding:16px">

      <h3 style="text-align:left;margin-top:4px;font-size:24px">Du kan inte spela</h3>
    </div>
    <div style="padding:16px 18px;color:var(--cream);font-size:14.5px;line-height:1.6">
      ${opp ? `Vi meddelar <b>${esc(opp)}</b> och klubben automatiskt via SMS/mejl. Ta kontakt med varandra och kom överens om en ny tid att spela er match.`
            : 'Klubben är meddelad. Du hade ingen inlagd match för den här spelomgången.'}
      <div class="state" id="cant-nmsg" style="color:var(--muted);font-size:13px;margin-top:10px">Skickar avisering…</div>

  </div>`;
  document.getElementById('cantmodal').classList.add('open');
  // skicka aviseringen automatiskt
  BTS.hostCantNotify(ME.id, ME.pin, WEEK).then(r=>{
    const el=document.getElementById('cant-nmsg'); if(el) el.innerHTML='✓ Motståndaren och klubben är meddelade.';
  }).catch(e=>{ const el=document.getElementById('cant-nmsg'); if(el) el.textContent='Kunde inte skicka avisering: '+(e.message||e); });
}
function closeCant(){ const m=document.getElementById('cantmodal'); m.classList.remove('open'); m.innerHTML=''; }
async function sendReschedule(mid){
  const note=(document.getElementById('cant-note').value||'').trim();
  const s=document.getElementById('cant-rmsg');
  if(!note){ s.textContent='Skriv en ny tid först.'; return; }
  s.textContent='Skickar…';
  try{ await BTS.hostReschedule(mid, note, ME.id, ME.pin);
    MATCHES=await BTS.hostPoolMatches(ROUND); render();
    s.innerHTML='✓ Ny tid inlagd och meddelad.';
  }catch(e){ s.textContent='Fel: '+(e.message||e); }
}
function zonesFor(rows){
  const levels=[...new Set(ST.filter(r=>r.division===DIV).map(r=>r.level))];
  const top=Math.min(...levels), bot=Math.max(...levels);
  const lvl=rows[0].level, n=rows.length, z={};
  rows.forEach(r=>{ let v=''; if(lvl===top){ v=r.rank>3?'down':''; } else if(lvl===bot){ v=r.rank<=2?'up':''; }
    else { v=r.rank<=2?'up':(r.rank>n-2?'down':''); } z[r.player_id]=v; });
  return z;
}
function formFor(pid,div,lab){
  return MATCHES.filter(m=>m.division===div&&m.label===lab&&m.status==='done'&&(m.a_id===pid||m.b_id===pid))
    .sort((a,b)=>(a.matchday||0)-(b.matchday||0))
    .map(m=>m.winner_id===pid?'V':'F');
}
function dayDate(dm){
  const ds=[...new Set(dm.map(m=>m.play_date).filter(Boolean))];
  if(ds.length===1){ const d=new Date(ds[0]+'T00:00:00'); return ' · '+d.toLocaleDateString('sv-SE',{weekday:'short',day:'numeric',month:'short'}); }
  return '';
}
function matchCard(m){
  const aw=m.winner_id===m.a_id, bw=m.winner_id===m.b_id;
  const mine = !!(ME && (ME.id===m.a_id || ME.id===m.b_id));
  const names=`<div class="names"><span class="a ${aw?'win':''}">${esc(m.a_name)}</span><span class="b ${bw?'win':''}">${esc(m.b_name)}</span></div>`;
  if(m.status==='done'){
    const res = m.score ? esc(m.score) : (m.games_a+' – '+m.games_b);
    return `<div class="match">${names}
      <div class="result" ${m.score?'style="font-size:20px;letter-spacing:1px"':''}>${res}</div>
      ${m.comment?`<div class="mcmt">💬 ${esc(m.comment)}</div>`:''}
      <div class="mmeta"><span>${whenLabel(m)}</span>${mine?`<button class="editlink" onclick="editM(${m.id})">Ändra resultat</button>`:''}</div></div>`;
  }
  if(!mine){
    return `<div class="match">${names}

      <div class="mmeta"><span>${whenLabel(m)}</span></div></div>`;
  }
  const cmtField = m._noComment
    ? (m.comment?`<div class="mcmt">💬 ${esc(m.comment)}</div>`:'')
    : `<input class="cmt" id="cm${m.id}" maxlength="160" placeholder="(Ev kommentar om matchen)" value="${escAttr(m.comment)}">`;
  const si=(k,ph)=>`<input type="number" min="0" inputmode="numeric" id="${k}${m.id}" placeholder="${ph}" oninput="autoWinM(${m.id})">`;
  return `<div class="match" id="m${m.id}">${names}
    <div class="sets">
      <div class="setrow"><span class="setlbl">Set 1</span>${si('s1a','')}<span class="vs">–</span>${si('s1b','')}</div>
      <div class="setrow"><span class="setlbl">Set 2</span>${si('s2a','')}<span class="vs">–</span>${si('s2b','')}</div>
      <div class="setrow"><span class="setlbl">Super&nbsp;TB</span>${si('stba','')}<span class="vs">–</span>${si('stbb','')}</div>
    </div>
    <div class="awin" id="aw${m.id}"></div>
    ${cmtField}
    <button class="sv wide" onclick="saveM(${m.id})">Spara resultat</button>
    <div class="mmeta"><span>${whenLabel(m)}</span><a href="#" onclick="deferM(event,${m.id})">Spela senare</a></div></div>`;
}
function whenLabel(m){
  if(m.defer_note) return `<span class="later">⏳ Spelas senare: ${esc(m.defer_note)}</span>`;
  if(m.play_date){ const d=new Date(m.play_date+'T00:00:00');
    return '📅 '+d.toLocaleDateString('sv-SE',{weekday:'short',day:'numeric',month:'short'})+(m.start_time?' '+esc(m.start_time):'')+(m.court?' · '+esc(m.court):''); }
  return 'Tid ej satt';
}
function upcName(id,name){ return `<span class="upl" onclick="event.stopPropagation();openProfile(${id})">${esc(name)}</span>`; }
function upcCard(m, mine){
  const dn={H:'Herr',D:'Dam'};
  const cnum = m.court ? (String(m.court).replace(/^\s*bana\s*/i,'').trim() || String(m.court)) : '';
  const court = cnum ? `<div class="ct"><span class="ct-l">Bana</span><span class="ct-n">${esc(cnum)}</span></div>` : '';
  const gp = `${mine?'<span class="din">DIN MATCH · </span>':''}${dn[m.division]||m.division} · Grupp ${esc(m.label)}`;
  return `<div class="upc ${mine?'mine':''}">
    <div class="t"><div class="hh">${esc(m.start_time||'')}</div></div>
    <div class="who"><div class="pl">${upcName(m.a_id,m.a_name)} <span style="color:var(--muted2)">–</span> ${upcName(m.b_id,m.b_name)}</div>
      <div class="gp">${gp}</div></div>
    ${court}</div>`;
}
function renderUpcoming(el){
  const dn={H:'Herr',D:'Dam'};
  const cnum=m=>{ const x=String(m.court||'').match(/\d+/); return x?parseInt(x[0]):9999; };
  const tkey=m=>String(m.start_time||'');
  const sched=MATCHES.filter(m=>m.status!=='done' && m.play_date && String(m.start_time||'').trim())
    .sort((a,b)=> (a.play_date<b.play_date?-1:a.play_date>b.play_date?1:0)
      || (cnum(a)-cnum(b))
      || (tkey(a)<tkey(b)?-1:tkey(a)>tkey(b)?1:0));
  const later=MATCHES.filter(m=>m.status!=='done' && m.defer_note && !(m.play_date && String(m.start_time||'').trim()));
  if(!sched.length && !later.length){ el.innerHTML='<div class="state" style="text-align:center;padding:30px 10px">Inga matcher är schemalagda ännu.<br>Håll utkik — tiderna dyker upp här! 🎾</div>'; return; }
  const mineIds = ME ? new Set(sched.filter(m=>m.a_id===ME.id||m.b_id===ME.id).map(m=>m.id)) : new Set();
  let html='';
  if(ME && mineIds.size){
    html+='<div class="upc-day" style="color:#9be29b">⭐ Dina matcher</div>';
    html+=sched.filter(m=>mineIds.has(m.id)).map(m=>upcCard(m,true)).join('');
  }
  let lastD='';
  sched.filter(m=>!mineIds.has(m.id)).forEach(m=>{
    if(m.play_date!==lastD){ const d=new Date(m.play_date+'T00:00:00');
      html+=`<div class="upc-day">${d.toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long'})}</div>`; lastD=m.play_date; }
    html+=upcCard(m,false);
  });
  if(later.length){
    html+='<div class="upc-day">⏳ Att boka tid</div>';
    html+=later.map(m=>{ const mine=ME&&(m.a_id===ME.id||m.b_id===ME.id);
      return `<div class="upc ${mine?'mine':''}"><div class="who"><div class="pl">${upcName(m.a_id,m.a_name)} <span style="color:var(--muted2)">–</span> ${upcName(m.b_id,m.b_name)}</div>
      <div class="gp">${dn[m.division]||m.division} · Grupp ${esc(m.label)} · ${esc(m.defer_note)}</div></div>${mine?'<span class="mine-badge">Din</span>':''}</div>`; }).join('');
  }
  // Inte klara ännu: den aktuella spelomgångens matcher utan tid och utan notis
  const pending=MATCHES.filter(m=>m.status!=='done' && (m.matchday||0)===WEEK
    && !(m.play_date && String(m.start_time||'').trim()) && !m.defer_note);
  if(pending.length){
    html+='<div class="upc-day" style="color:#e6a23c">⚠️ Inte klara ännu</div>';
    html+='<div class="state" style="margin:-4px 0 9px;font-size:12px;color:var(--muted2)">Dessa saknar tid/bana eller besked. Hör av dig till din motståndare eller klubben så får vi igång dem.</div>';
    html+=pending.map(m=>{ const mine=ME&&(m.a_id===ME.id||m.b_id===ME.id);
      const pa=ATT[m.a_id], pb=ATT[m.b_id];
      let why='Väntar på tid & bana';
      if(pa===false||pb===false) why='Någon kan inte just nu';
      else if(pa==null||pb==null) why='Väntar på bekräftelse';
      return `<div class="upc ${mine?'mine':''}"><div class="who"><div class="pl">${upcName(m.a_id,m.a_name)} <span style="color:var(--muted2)">–</span> ${upcName(m.b_id,m.b_name)}</div>
      <div class="gp">${dn[m.division]||m.division} · Grupp ${esc(m.label)} · ${why}</div></div>${mine?'<span class="mine-badge">Din</span>':''}</div>`; }).join('');
  }
  el.innerHTML=html;
}
function render(){
  renderConfirm();
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.div===DIV));
  const lg=document.querySelector('.legend'); if(lg) lg.style.display = (DIV==='S'||DIV==='M')?'none':'';
  const el=document.getElementById('body');
  if(DIV==='S'){ renderPlayers(el); return; }
  if(DIV==='M'){ renderUpcoming(el); return; }
  const rows=ST.filter(r=>r.division===DIV);
  if(!rows.length){ el.innerHTML='<div class="state">Inga grupper i den här stegen ännu.</div>'; return; }
  const levels=rows.map(r=>r.level), top=Math.min(...levels), bot=Math.max(...levels);
  const labels=[...new Set(rows.map(r=>r.label))];
  const single = labels.length===1;
  el.innerHTML = labels.map(lab=>{
    const grp=rows.filter(r=>r.label===lab).sort((a,b)=>a.rank-b.rank);
    const z=zonesFor(grp);
    const played = grp.some(r=>r.spelade>0);
    const lvlName = single ? 'Alla möter alla' : (grp[0].level===top?'Toppgrupp':grp[0].level===bot?'Bottengrupp':'Nivå '+grp[0].level);
    const prows=grp.map(r=>{
      const zone = (played && !single) ? z[r.player_id] : '';
      const form = formFor(r.player_id,DIV,lab);
      const fhtml = form.length?`<div class="form">${form.map(x=>`<span class="vf ${x==='V'?'v':'f'}">${x}</span>`).join('')}</div>`:'';
      return `<div class="prow ${zone}" onclick="openProfile(${r.player_id})">
        <div class="rnum">${r.rank}</div>
        <div class="pinfo"><div class="pname">${esc(r.name)}${ATT[r.player_id]===true?' <span class="cchk">✓</span>':ATT[r.player_id]===false?' <span class="cx">✕</span>':''}</div>
          <div class="pmeta">${r.spelade} matcher · ${r.vinster} vinster</div>${fhtml}</div>
        <div class="pdiff">${r.diff>0?'+':''}${r.diff}</div>
        <i class="prow-arrow">›</i></div>`;
    }).join('');
    const gm=MATCHES.filter(m=>m.division===DIV && m.label===lab);
    const days=[...new Set(gm.map(m=>m.matchday||0))].sort((a,b)=>a-b);
    const mrows=days.map(d=>{
      const dm=gm.filter(m=>(m.matchday||0)===d);
      return `<div class="dayhdr">Spelomgång ${d||'?'}${dayDate(dm)}</div>`+dm.map(matchCard).join('');
    }).join('');
    const key=DIV+'-'+lab, doneN=gm.filter(m=>m.status==='done').length;
    return `<div class="grp">
      <div class="ghead"><h2>Grupp ${esc(lab)}</h2><span class="glvl">${lvlName}</span></div>
      ${prows}
      <details class="macc" ${OPEN.has(key)?'open':''} ontoggle="onToggle('${key}',this)">
        <summary>Resultat &amp; matcher <span class="cnt">${doneN}/${gm.length} spelade</span></summary>
        <div class="matches">${mrows||'<div class="state">Inga matcher.</div>'}</div>
      </details></div>`;
  }).join('');
}
function renderPlayers(el){

function ageFrom(born){ if(!born) return ''; const d=new Date(born); if(isNaN(d)) return '';

    <div class="pstats" id="pstats"></div>
    <div class="pmatches" id="pmatches"></div>
    ${contactHtml}</div>`;
  document.getElementById('profmodal').classList.add('open');
  fillStats(id);
  fillMatches(id);
  if(ME) fillContact(id);
}
function flipScore(score, isA){
  if(isA || !score) return score||'';
  return String(score).trim().split(/\s+/).map(s=>{ const p=s.split('-'); return p.length===2 ? p[1]+'-'+p[0] : s; }).join(' ');
}
async function fillMatches(id){
  const el=document.getElementById('pmatches'); if(!el) return;
  try{
    const ms=await BTS.hostPlayerMatches(id, 8);
    if(!ms || !ms.length){ el.innerHTML=''; return; }
    let h='<div class="pst-h">Senaste matcher</div>';
    ms.forEach(m=>{
      const sc=flipScore(m.score, m.is_a);
      const d=m.play_date?new Date(m.play_date+'T00:00:00').toLocaleDateString('sv-SE',{day:'numeric',month:'short'}):'';
      h+=`<div class="pmrow">
        <span class="pmres ${m.won?'v':'f'}">${m.won?'V':'F'}</span>
        <span class="pmopp">${esc(m.opp||'')}</span>
        <span class="pmsc">${esc(sc)}</span>
        <span class="pmd">${d}</span></div>`;
    });
    el.innerHTML=h;
  }catch(e){ el.innerHTML=''; }
}
async function fillStats(id){
  const el=document.getElementById('pstats'); if(!el) return;
  try{
    const s=await BTS.hostPlayerStats(id);
    if(!s || !s.matcher){ el.innerHTML=''; return; }
    const pct=s.matcher?Math.round(s.vinster/s.matcher*100):0;
    let h='<div class="pst-h">Statistik · genom åren</div><div class="pst-row">'
      +`<div class="pst"><div class="pn">${s.matcher}</div><div class="pk">Matcher</div></div>`
      +`<div class="pst"><div class="pn">${s.vinster}</div><div class="pk">Vinster</div></div>`
      +`<div class="pst"><div class="pn">${pct}%</div><div class="pk">Vinst</div></div></div>`;
    if(s.topp_motstandare) h+=`<div class="pst-extra">🎾 Flest möten: <b>${esc(s.topp_motstandare)}</b> · ${s.topp_antal} ggr</div>`;
    el.innerHTML=h;
  }catch(e){ el.innerHTML=''; }
}
async function fillContact(id){
  const el=document.getElementById('pcontact'); if(!el) return;
  try{
    const c=await BTS.hostContact(ME.id, ME.pin, id);
    if(!c || (!c.phone && !c.email)){ el.textContent='Inga kontaktuppgifter angivna.'; el.style.color='var(--muted2)'; return; }
    let h='<div style="font-family:\'Space Mono\',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);margin-bottom:6px">Kontakt</div>';
    if(c.phone){ const tel=String(c.phone).replace(/[^\d+]/g,''); h+=`<div>📱 <a href="tel:${escAttr(tel)}" style="color:var(--clay);text-decoration:none;font-weight:700">${esc(c.phone)}</a></div>`; }
    if(c.email){ h+=`<div style="margin-top:5px">✉️ <a href="mailto:${escAttr(c.email)}" style="color:var(--clay);text-decoration:none;font-weight:700">${esc(c.email)}</a></div>`; }
    el.innerHTML=h;
  }catch(e){ el.textContent='Kunde inte hämta kontakt.'; el.style.color='var(--muted2)'; }
}
function closeProfile(){ const m=document.getElementById('profmodal'); m.classList.remove('open'); m.innerHTML=''; }
function hostSets(id){
  const g=k=>{const e=document.getElementById(k+id);return e&&e.value!==''?parseInt(e.value):null;};
  const out=[];
  if(g('s1a')!=null&&g('s1b')!=null) out.push({a:g('s1a'),b:g('s1b')});
  if(g('s2a')!=null&&g('s2b')!=null) out.push({a:g('s2a'),b:g('s2b')});
  if(g('stba')!=null&&g('stbb')!=null) out.push({a:g('stba'),b:g('stbb'),super:true});
  return out;
}
function setsWinner(sets,aId,bId){ let a=0,b=0; sets.forEach(s=>{ if(s.a>s.b)a++; else if(s.b>s.a)b++; }); return a>b?aId:(b>a?bId:null); }
function autoWinM(id){
  const m=MATCHES.find(x=>x.id===id); if(!m)return;
  const sets=hostSets(id), w=setsWinner(sets,m.a_id,m.b_id), el=document.getElementById('aw'+id); if(!el)return;
  if(w){ el.textContent='✓ Vinnare: '+(w===m.a_id?m.a_name:m.b_name); el.style.color='#9be29b'; }
  else { el.textContent=sets.length?'Fyll i så en vinnare blir tydlig':''; el.style.color='var(--muted2)'; }
}
async function saveM(id){
  if(!ME){ alert('Logga in för att rapportera.'); return; }
  const m=MATCHES.find(x=>x.id===id); if(!m)return;
  const sets=hostSets(id), w=setsWinner(sets,m.a_id,m.b_id);
  if(!w){ alert('Fyll i set-resultaten så vinnaren blir tydlig (bäst av 3, tredje = super-tiebreak).'); return; }
  let ga=0, gb=0; sets.forEach(s=>{ if(!s.super){ ga+=s.a; gb+=s.b; } });
  const score=sets.map(s=>s.a+'-'+s.b).join(' ');
  const cmEl=document.getElementById('cm'+id);
  const cm = cmEl ? cmEl.value : (m.comment||'');
  try{ await BTS.hostPoolReport(id,ga,gb,cm,ME.id,ME.pin,score,sets,w);
    [ST,MATCHES]=await Promise.all([BTS.hostPoolStandings(ROUND),BTS.hostPoolMatches(ROUND)]); render(); }
  catch(e){ alert('Kunde inte spara: '+(e.message||e)); }
}
function editM(id){
  const m=MATCHES.find(x=>x.id===id); if(!m)return; m.status='pending'; m._noComment=true; OPEN.add(m.division+'-'+m.label); render();
  const s=Array.isArray(m.sets)?m.sets:[];
  const set=(k,v)=>{ const e=document.getElementById(k+id); if(e&&v!=null) e.value=v; };
  if(s[0]){ set('s1a',s[0].a); set('s1b',s[0].b); }
  if(s[1] && !s[1].super){ set('s2a',s[1].a); set('s2b',s[1].b); }
  const sup=s.find(x=>x&&x.super); if(sup){ set('stba',sup.a); set('stbb',sup.b); }
  autoWinM(id);
}
async function deferM(e,id){
  e.preventDefault();
  if(!ME){ alert('Logga in först.'); return; }
  const note=prompt('När kan ni spela matchen? (t.ex. "sön 21/9 efter 12" — lämna tomt för att ta bort)');
  if(note===null) return;
  try{ await BTS.hostPoolDefer(id, note.trim(), ME.id, ME.pin); [ST,MATCHES]=await Promise.all([BTS.hostPoolStandings(ROUND),BTS.hostPoolMatches(ROUND)]); render(); }
  catch(err){ alert('Kunde inte spara: '+(err.message||err)); }
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{DIV=t.dataset.div;render();});
load();
</script>
