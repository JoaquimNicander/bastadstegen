<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<title>Speed Tennis Masters · Live</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0B241A; --bg2:#0D2E20; --card:#0F2E20; --card2:#0D2A1D; --border:#1E3E2E; --cream:#F5EDE3; --muted:#9A8F86; --muted2:#8a8a80; --clay:#FF8C42; --orange:#E8520A; --sun:#F4B740; --green:#7BC67B; --down:#EF9A9A; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Outfit',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--cream);min-height:100vh;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  a{color:var(--sun)}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;max-width:760px;margin:0 auto}
  .topbar a{color:#fff;text-decoration:none;font-size:14px;border:1px solid rgba(255,255,255,.22);padding:9px 14px;border-radius:9px;background:rgba(255,255,255,.03)}
  /* Event-header (bild) + live-rad */
  .ehead{max-width:760px;margin:0 auto;padding:0 14px}
  .ehead img{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .livebar{max-width:760px;margin:12px auto 2px;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
  .livebar .pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,140,66,.12);border:1px solid rgba(255,140,66,.4);color:var(--clay);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:7px 13px;border-radius:100px;font-weight:700}
  .livebar .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--clay);animation:pulse 1.4s infinite}
  .livebar .date{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  .wrap{max-width:760px;margin:0 auto;padding:14px}
  .tabs{position:sticky;top:0;z-index:20;display:flex;gap:6px;margin:6px -14px 18px;padding:8px 14px;background:linear-gradient(var(--bg),var(--bg) 70%,rgba(11,36,26,0));backdrop-filter:blur(6px)}
  .tab{flex:1;background:var(--card2);border:1px solid var(--border);color:var(--muted);font:inherit;font-size:15px;font-weight:700;padding:13px 6px;min-height:50px;cursor:pointer;border-radius:11px;transition:.15s}
  .tab.on{color:#0D2E20;background:var(--clay);border-color:var(--clay);box-shadow:0 4px 14px rgba(255,140,66,.28)}
  .hidden{display:none}
  .glabel{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--sun);margin:20px 2px 9px;display:flex;align-items:center;gap:9px}
  .glabel::after{content:'';flex:1;height:1px;background:var(--border)}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:16px;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.22)}
  th,td{text-align:right;padding:13px 12px;border-bottom:1px solid var(--border)}
  th:first-child,td:first-child{text-align:left}
  tr:last-child td{border-bottom:none}
  thead th{background:rgba(255,255,255,.02);font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:400}
  td.nm{color:#fff;font-weight:600;display:flex;align-items:center;gap:10px}
  .rk{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:7px;background:#10231a;border:1px solid var(--border);font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);flex:none}
  tr.qual td{background:rgba(123,198,123,.09)}
  tr.qual .rk{background:rgba(123,198,123,.16);border-color:#2f5d3a;color:var(--green);font-weight:700}
  .medal{font-size:14px}
  .mrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px 15px;margin-bottom:9px;box-shadow:0 3px 12px rgba(0,0,0,.18);position:relative;overflow:hidden}
  .mrow.done{border-color:#2a4a38}
  .mrow .side{flex:1;font-size:16px;min-width:0;overflow-wrap:anywhere}
  .mrow .side.b{text-align:right}
  .mrow .side.win{color:var(--sun);font-weight:700}
  .mrow .sc{font-family:'Space Mono',monospace;font-weight:700;font-size:17px;color:var(--cream);min-width:60px;text-align:center;background:#10231a;border:1px solid var(--border);border-radius:8px;padding:5px 6px}
  .mrow .sc.pending{background:none;border:none;color:var(--muted2);font-weight:400;font-size:12px}
  .mrow .vs{font-size:12px;color:var(--muted2)}
  .court{font-family:'Space Mono',monospace;font-size:11px;color:var(--sun);letter-spacing:1px}
  .bracket .col{margin-bottom:16px}
  .champ{background:linear-gradient(135deg,#F4B740 0%,#E8931F 60%,#C9761a 100%);border:none;border-radius:16px;padding:20px 16px;text-align:center;margin-bottom:16px;box-shadow:0 10px 30px rgba(244,183,64,.25)}
  .champ .t{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#5A3A00;font-weight:700}
  .champ .trophy{font-size:34px;line-height:1;margin:2px 0 2px}
  .champ .n{font-family:'Anton',sans-serif;font-size:30px;color:#0D2E20;margin-top:2px;letter-spacing:.5px}
  .muted{color:var(--muted);font-size:13px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
  /* Slutspelsträd */
  .scrollhint{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--muted);margin:-2px 0 8px;text-align:center}
  .tree{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:6px 2px 16px;gap:22px;scroll-snap-type:x proximity}
  .tree .col{flex:0 0 auto;width:210px;display:flex;flex-direction:column;scroll-snap-align:start}
  .tree .rh{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--sun);text-align:center;margin-bottom:12px}
  .colbody{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:18px;min-height:140px}
  .pair{display:flex;flex-direction:column;justify-content:space-around;gap:18px;position:relative;flex:1}
  .tie{position:relative;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 12px;font-size:14px}
  .tie.done{border-color:#2a4a38}
  .tie .tr{display:flex;justify-content:space-between;gap:8px;padding:4px 0;color:var(--cream)}
  .tie .tr span:first-child{white-space:nowrap}
  .tie .tr.win{color:var(--sun);font-weight:700}
  .tie .tr .s{font-family:'Space Mono',monospace;font-weight:700;flex:none}
  .tie.empty{color:var(--muted);text-align:center;font-size:12px}
  .tree .col:not(:first-child) .tie::before{content:'';position:absolute;left:-12px;top:50%;width:12px;height:2px;background:var(--border)}
  .tree .col:not(:last-child) .tie::after{content:'';position:absolute;right:-12px;top:50%;width:12px;height:2px;background:var(--border)}
  .pair::after{content:'';position:absolute;right:-12px;top:25%;bottom:25%;width:2px;background:var(--border)}
  .champcol{width:150px;justify-content:center}
  .wintie{background:linear-gradient(135deg,#F4B740,#E8931F);color:#0D2E20;font-weight:700;border-radius:10px;padding:12px 10px;text-align:center;font-size:14px}
  /* Pågående match */
  .qn{flex:none;width:30px;height:30px;border-radius:8px;background:var(--clay);color:#0D2E20;font-family:'Space Mono',monospace;font-weight:700;display:flex;align-items:center;justify-content:center}
  .btn.ghost{background:transparent;border:1px solid var(--clay);color:var(--clay);box-shadow:none;font-size:15px;padding:12px}
  .livechip{display:inline-flex;align-items:center;gap:9px;background:rgba(123,198,123,.14);border:1px solid var(--green);color:var(--green);font-weight:700;font-size:14px;padding:11px 14px;border-radius:10px}
  .ld{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(123,198,123,.8);animation:pulse 1.3s infinite;flex:none}
  .mrow.live{border:2px solid var(--green);box-shadow:0 0 0 2px rgba(123,198,123,.28),0 0 18px rgba(123,198,123,.25)}
  .bigok{background:linear-gradient(135deg,#7BC67B,#4CAF50);color:#0D2E20;border-radius:14px;padding:18px 18px;margin-bottom:14px;font-family:'Anton',sans-serif;font-size:22px;letter-spacing:.5px;box-shadow:0 10px 28px rgba(123,198,123,.35);animation:popok .35s}
  .bigok span{display:block;font-family:'Outfit',sans-serif;font-weight:600;font-size:14px;letter-spacing:0;margin-top:6px;color:#0D2E20}
  @keyframes popok{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  /* Rapportera */
  select,input{width:100%;background:#10231a;border:1px solid var(--border);color:var(--cream);font:inherit;font-size:16px;padding:14px 13px;border-radius:11px;outline:none;margin-bottom:10px}
  select:focus,input:focus{border-color:var(--clay)}
  select{min-height:52px}
  .scin{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .scin input{text-align:center;font-size:26px;font-weight:700;margin:0;padding:12px 6px}
  .btn{background:var(--orange);color:#fff;border:none;border-radius:11px;font:inherit;font-weight:700;font-size:17px;padding:16px;min-height:54px;cursor:pointer;width:100%;box-shadow:0 6px 16px rgba(232,82,10,.3)}
  .status{font-size:14px;margin-top:8px;min-height:18px;color:var(--muted)}
  @media(max-width:420px){
    .wrap{padding:12px}
    .tab{font-size:14px;padding:12px 4px}
    table{font-size:15px}
    th,td{padding:11px 9px}
    .champ .n{font-size:26px}
  }
</style>
</head>
<body>
<div class="topbar"><a href="index.html">← Startsida</a><a href="#" onclick="refresh();return false">↻ Uppdatera</a></div>
<div class="ehead"><img src="kickoff-header.png" alt="Summer Edition Masters · 23 augusti"></div>
<div class="livebar">
  <span class="pill"><span class="dot"></span>Live</span>
  <span class="date">Sommarstegens avslutning · 23 augusti · uppdateras automatiskt</span>
</div>

<div class="wrap">
  <div class="tabs">
    <button class="tab on" data-t="grupper" onclick="showTab('grupper',this)">Grupper</button>
    <button class="tab" data-t="matcher" onclick="showTab('matcher',this)">Matcher</button>
    <button class="tab" data-t="slutspel" onclick="showTab('slutspel',this)">Slutspel</button>
    <button class="tab" data-t="rapportera" onclick="showTab('rapportera',this)">Rapportera</button>
  </div>
  <div id="v-grupper"></div>
  <div id="v-matcher" class="hidden"></div>
  <div id="v-slutspel" class="hidden"></div>
  <div id="v-rapportera" class="hidden"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/bts-data.js"></script>
<script>
let ST={players:[],matches:[]};
let tab='grupper';
let reporting=false;
const byId=id=>ST.players.find(p=>p.id===id)||{name:'—'};
const nm=id=>byId(id).name;
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

async function refresh(){
  try{ ST=await BTS.scState(); render(); }catch(e){ /* tyst */ }
}
function showTab(t,btn){ tab=t; document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); if(btn)btn.classList.add('on');
  ['grupper','matcher','slutspel','rapportera'].forEach(x=>document.getElementById('v-'+x).classList.toggle('hidden',x!==t)); render(); }

function standings(grp){
  const ps=ST.players.filter(p=>p.grp===grp);
  const rows=ps.map(p=>{
    let w=0,pl=0,diff=0;
    ST.matches.forEach(m=>{ if(m.phase!=='group')return; if(m.a_id!==p.id&&m.b_id!==p.id)return; if(m.status!=='done')return;
      pl++; if(m.winner_id===p.id)w++;
      diff+= (m.a_id===p.id?(m.score_a-m.score_b):(m.score_b-m.score_a)); });
    return {p,w,pl,diff};
  });
  rows.sort((x,y)=> y.w-x.w || y.diff-x.diff || x.p.name.localeCompare(y.p.name,'sv'));
  return rows;
}

function renderGrupper(){
  const grps=[...new Set(ST.players.map(p=>p.grp).filter(Boolean))].sort();
  if(!grps.length){ return '<div class="muted">Grupperna lottas snart — håll utkik!</div>'; }
  return grps.map(g=>{
    const rows=standings(g);
    const medal=i=>i===0?'🥇':i===1?'🥈':'';
    return `<div class="glabel">Grupp ${g}</div>
    <table><thead><tr><th>Spelare</th><th>S</th><th>V</th><th>Diff</th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr class="${i<2?'qual':''}"><td class="nm"><span class="rk">${i+1}</span>${esc(r.p.name)}${medal(i)?` <span class="medal">${medal(i)}</span>`:''}</td><td>${r.pl}</td><td>${r.w}</td><td>${r.diff>0?'+':''}${r.diff}</td></tr>`).join('')}
    </tbody></table>`;
  }).join('') + `<div class="muted" style="margin-top:12px">Topp 2 i varje grupp går vidare till slutspel 🥇🥈 · placeringen avgör seedningen.</div>`;
}

function matchRow(m){
  const aw=m.winner_id===m.a_id, bw=m.winner_id===m.b_id;
  const done=m.status==='done';
  const sc=done?`<div class="sc">${m.score_a}–${m.score_b}</div>`
    :(m.court?`<div class="sc pending"><span class="court">bana ${esc(m.court)}</span></div>`:'<div class="sc pending">vs</div>');
  return `<div class="mrow ${done?'done':''}"><div class="side ${aw?'win':''}">${esc(nm(m.a_id))}</div>${sc}<div class="side b ${bw?'win':''}">${esc(nm(m.b_id))}</div></div>`;
}
function roundName(nMatches){
  return ({1:'Final',2:'Semifinal',4:'Kvartsfinal',8:'Åttondelsfinal',16:'Sextondelsfinal',32:'Trettiotvådelsfinal'})[nMatches]||('Slutspel');
}
function koByRound(tag){
  const kos=ST.matches.filter(m=>m.phase===tag);
  const byR={}; kos.forEach(m=>{ const r=+m.grp; (byR[r]=byR[r]||[]).push(m); });
  const rounds=Object.keys(byR).map(Number).sort((a,b)=>a-b);
  return {byR,rounds};
}
function koMatchRow(m){
  if(!m.a_id && !m.b_id) return `<div class="mrow"><div class="side muted">Väntar…</div></div>`;
  if(!m.a_id || !m.b_id){ const p=m.a_id||m.b_id;
    return `<div class="mrow"><div class="side win">${esc(nm(p))}</div><div class="sc"><span class="vs">frilott</span></div><div class="side b muted">—</div></div>`; }
  return matchRow(m);
}
function tieCard(m){
  if(!m.a_id && !m.b_id) return `<div class="tie empty">Väntar…</div>`;
  if(!m.a_id || !m.b_id){ const p=m.a_id||m.b_id;
    return `<div class="tie"><div class="tr win"><span>${esc(nm(p))}</span></div><div class="tr muted"><span>frilott</span></div></div>`; }
  const aw=m.winner_id===m.a_id, bw=m.winner_id===m.b_id, d=m.status==='done';
  return `<div class="tie ${d?'done':''}">
    <div class="tr ${aw?'win':''}"><span>${esc(nm(m.a_id))}</span><span class="s">${d?m.score_a:''}</span></div>
    <div class="tr ${bw?'win':''}"><span>${esc(nm(m.b_id))}</span><span class="s">${d?m.score_b:''}</span></div></div>`;
}
function renderTree(tag,title){
  const {byR,rounds}=koByRound(tag);
  if(!rounds.length) return '';
  const maxR=rounds[rounds.length-1], finM=byR[maxR][0];
  const cols=rounds.map(r=>{
    const ms=byR[r].slice().sort((a,b)=>(a.slot||0)-(b.slot||0));
    let body='';
    if(r<maxR){ for(let i=0;i<ms.length;i+=2){ body+=`<div class="pair">${tieCard(ms[i])}${ms[i+1]?tieCard(ms[i+1]):''}</div>`; } }
    else { body=tieCard(ms[0]); }
    return `<div class="col"><div class="rh">${roundName(ms.length)}</div><div class="colbody">${body}</div></div>`;
  }).join('');
  const champCol=`<div class="col champcol"><div class="rh">Mästare</div><div class="colbody">
    <div class="wintie">${finM&&finM.status==='done'?('🏆 '+esc(nm(finM.winner_id))):'<span class="muted">väntar</span>'}</div></div></div>`;
  return `<div class="glabel">${title}</div><div class="scrollhint">← dra i sidled →</div><div class="tree">${cols}${champCol}</div>`;
}
function renderSlutspel(){
  const herr=renderTree('ko','🎾 Herrklass');
  const dam=renderTree('kod','👑 Damklass');
  if(!herr && !dam){ return '<div class="muted">Slutspelsträden visas när gruppspelet är klart. Herr: topp 2 i grupp A–D. Dam: alla i grupp E (1:a möter 4:a).</div>'; }
  return herr + (herr&&dam?'<div style="height:22px"></div>':'') + dam;
}

function myMatches(scId){
  return ST.matches.filter(m=>m.status!=='done' && m.a_id && m.b_id && (m.a_id===scId||m.b_id===scId));
}
function renderRapportera(){
  const opts=ST.players.slice().sort((a,b)=>a.name.localeCompare(b.name,'sv')).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  return `<div class="glabel">Rapportera din match</div>
  <select id="rp-me" onchange="renderRpMatches()"><option value="">Välj ditt namn…</option>${opts}</select>
  <div id="rp-matches"></div>`;
}
function renderRpMatches(){
  const box=document.getElementById('rp-matches'); const scId=parseInt(document.getElementById('rp-me').value);
  if(!scId){ box.innerHTML=''; return; }
  const ms=myMatches(scId);
  if(!ms.length){ box.innerHTML='<div class="muted">Inga matcher att rapportera just nu.</div>'; return; }
  box.innerHTML=ms.map(m=>{
    const opp=m.a_id===scId?m.b_id:m.a_id;
    const ph = m.phase==='group' ? ('Grupp '+(m.grp||''))
             : m.phase==='bronze' ? 'Bronsmatch'
             : roundName(ST.matches.filter(x=>x.phase==='ko'&&x.grp===m.grp).length);
    return `<div class="mrow" style="flex-direction:column;align-items:stretch;gap:10px">
      <div style="display:flex;justify-content:space-between"><span style="font-weight:600">Mot ${esc(nm(opp))}</span><span class="court">${ph}</span></div>
      ${m.status==='live'
        ? '<div class="livechip"><span class="ld"></span>Matchen pågår</div>'
        : `<button class="btn ghost" onclick="startMatch('${m.id}',${scId})">▶ Starta match</button>`}
      <div class="scin"><span style="flex:1;font-size:13px;color:var(--muted)">Du</span>
        <input id="rp-a-${m.id}" type="number" min="0" max="30" inputmode="numeric" placeholder="0" style="max-width:70px">
        <span>–</span>
        <input id="rp-b-${m.id}" type="number" min="0" max="30" inputmode="numeric" placeholder="0" style="max-width:70px">
        <span style="flex:1;font-size:13px;color:var(--muted);text-align:right">${esc(nm(opp))}</span></div>
      <button class="btn" onclick="submitReport(${m.id},${scId})">Skicka resultat →</button>
      <div class="status" id="rp-st-${m.id}"></div>
    </div>`;
  }).join('');
}
async function startMatch(matchId,scId){
  try{ await BTS.scStart(parseInt(matchId),scId); await refresh(); renderRpMatches(); }
  catch(e){ alert('Fel: '+(e.message||e)); }
}
async function submitReport(matchId,scId){
  reporting=true;
  const st=document.getElementById('rp-st-'+matchId);
  const my=parseInt(document.getElementById('rp-a-'+matchId).value);
  const op=parseInt(document.getElementById('rp-b-'+matchId).value);
  if(isNaN(my)||isNaN(op)){ st.textContent='Fyll i båda siffrorna.'; reporting=false; return; }
  if(my===op){ st.textContent='Kan inte bli lika — någon vinner.'; reporting=false; return; }
  const m=ST.matches.find(x=>x.id===matchId);
  const a = m.a_id===scId?my:op, b = m.a_id===scId?op:my;   // mappa till matchens a/b
  st.textContent='Skickar…';
  const oppName=nm(m.a_id===scId?m.b_id:m.a_id);
  try{
    await BTS.scReport(matchId,scId,'',a,b);
    await refresh();
    renderRpMatches();                 // bygg om — den klara matchen försvinner
    const box=document.getElementById('rp-matches');
    const ok=document.createElement('div'); ok.className='bigok';
    ok.innerHTML=`✅ Resultat registrerat!<span>${esc(myName())} ${my}–${op} ${esc(oppName)} · matchen är klar och syns på storbilden.</span>`;
    box.prepend(ok);
    ok.scrollIntoView({behavior:'smooth',block:'center'});
  }catch(e){ st.textContent='Fel: '+(e.message||e); }
  reporting=false;
}
function myName(){ const el=document.getElementById('rp-me'); const id=el&&parseInt(el.value); return id?nm(id):'Du'; }

function grpTitle(g){ return g==='E'?'Damklass':'Grupp '+g; }
function playOrder(){
  const ms=ST.matches.filter(m=>m.a_id&&m.b_id).slice()
    .sort((a,b)=>(''+(a.grp||'')).localeCompare(''+(b.grp||''))||a.id-b.id);
  const rounds={}, out=[];
  ms.forEach(m=>{ let r=1; for(;;){ const s=rounds[r]||(rounds[r]=new Set());
    if(!s.has(m.a_id)&&!s.has(m.b_id)){ s.add(m.a_id); s.add(m.b_id); out.push({m,r}); break; } r++; } });
  out.sort((x,y)=>x.r-y.r||(''+(x.m.grp||'')).localeCompare(''+(y.m.grp||''))||x.m.id-y.m.id);
  return out.map(o=>o.m);
}
function koLbl(m){ const n=ST.matches.filter(x=>x.phase===m.phase&&x.grp===m.grp).length; return (m.phase==='kod'?'Dam ':'')+roundName(n); }
function renderMatcher(){
  const pending=playOrder().filter(m=>m.status!=='done');
  const live=pending.filter(m=>m.status==='live');
  const upcoming=pending.filter(m=>m.status!=='live');
  const done=ST.matches.filter(m=>m.a_id&&m.b_id&&m.status==='done').slice().sort((a,b)=>b.id-a.id).slice(0,12);
  const lbl=m=>m.phase==='group'?grpTitle(m.grp):koLbl(m);
  const liveRow=m=>`<div class="mrow live"><span class="ld"></span>
    <div class="side win">${esc(nm(m.a_id))}</div><div class="sc pending">pågår</div><div class="side b win">${esc(nm(m.b_id))}</div>
    <span class="court">${lbl(m)}</span></div>`;
  const q=upcoming.map((m,i)=>`<div class="mrow"><div class="qn">${i+1}</div>
    <div class="side">${esc(nm(m.a_id))}</div><div class="sc pending">vs</div><div class="side b">${esc(nm(m.b_id))}</div></div>
    <div style="margin:-4px 0 10px 42px"><span class="court">${lbl(m)}</span></div>`).join('');
  return `${live.length?`<div class="glabel">🟢 Pågår nu (${live.length})</div>${live.map(liveRow).join('')}`:''}
    <div class="glabel"${live.length?' style="margin-top:18px"':''}>Spelordning · näst på tur (${upcoming.length} kvar)</div>
    ${q||'<div class="muted">Inga matcher kvar att spela.</div>'}
    <div class="glabel" style="margin-top:20px">Senaste resultat</div>
    ${done.length?done.map(matchRow).join(''):'<div class="muted">Inga rapporterade än.</div>'}`;
}
function render(){
  document.getElementById('v-grupper').innerHTML=renderGrupper();
  document.getElementById('v-matcher').innerHTML=renderMatcher();
  document.getElementById('v-slutspel').innerHTML=renderSlutspel();
  if(tab==='rapportera'){
    // behåll formuläret om man redan valt namn
    if(!document.getElementById('rp-me')){ document.getElementById('v-rapportera').innerHTML=renderRapportera(); }
  }
}

refresh();
setInterval(()=>{ if(!reporting) refresh(); }, 15000);
// bygg rapportera-vyn första gången man öppnar den
document.querySelector('.tab[data-t=rapportera]').addEventListener('click',()=>{ document.getElementById('v-rapportera').innerHTML=renderRapportera(); });
</script>
</body>
