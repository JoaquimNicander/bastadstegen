<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speed Tennis Masters · Storbild</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0D2E20; --card:#0F2E20; --card2:#0D2A1D; --border:#1E3E2E; --cream:#F5EDE3;
         --muted:#9A8F86; --muted2:#8a8a80; --clay:#FF8C42; --orange:#E8520A; --sun:#F4B740; --green:#7BC67B; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Outfit',-apple-system,'Segoe UI',sans-serif;color:var(--cream);overflow:hidden;height:100vh;display:flex;flex-direction:column;
    background:
      radial-gradient(1000px 520px at 88% -8%, rgba(244,183,64,.16), transparent 60%),
      radial-gradient(900px 500px at 6% 108%, rgba(255,140,66,.08), transparent 60%),
      var(--bg);}
  /* svaga court-linjer i bakgrunden */
  body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.06;
    background:
      linear-gradient(var(--cream),var(--cream)) 0 22% / 100% 2px no-repeat,
      linear-gradient(var(--cream),var(--cream)) 0 82% / 100% 2px no-repeat,
      linear-gradient(90deg,var(--cream),var(--cream)) 50% 0 / 2px 100% no-repeat,
      linear-gradient(90deg,var(--cream),var(--cream)) 16% 22% / 2px 60% no-repeat,
      linear-gradient(90deg,var(--cream),var(--cream)) 84% 22% / 2px 60% no-repeat;}

  /* Toppbar med solstrålar */
  .bar{position:relative;overflow:hidden;display:flex;align-items:center;gap:22px;padding:16px 96px 16px 34px;
    background:linear-gradient(120deg,#FF8C42 0%,#E8520A 46%,#7A2400 82%);border-bottom:3px solid #5A1800}
  .bar .rays{position:absolute;inset:-40%;background:repeating-conic-gradient(from -8deg at 96% -10%, rgba(255,213,120,.55) 0deg 8deg, transparent 8deg 16deg);opacity:.45;pointer-events:none}
  .bar .bsun{position:absolute;right:-22px;top:-22px;width:96px;height:96px;border-radius:50%;
    background:radial-gradient(circle at 38% 32%,#FFFBE6,#FFE27A 55%,#FAC83C);box-shadow:0 0 46px 16px rgba(255,221,120,.5);pointer-events:none}
  .bar>*{position:relative;z-index:2}
  .bar .logo{font-family:'Anton',sans-serif;font-size:30px;letter-spacing:1.5px;line-height:.9;color:#0D2E20;text-shadow:0 2px 0 rgba(255,255,255,.18)}
  .bar .logo small{display:block;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:3px;color:#5A1800;font-weight:700;margin-top:4px}
  .bar .spacer{flex:1}
  .bar .viewname{font-family:'Space Mono',monospace;font-size:14px;letter-spacing:3px;text-transform:uppercase;color:#5A1800;font-weight:700;background:rgba(255,255,255,.22);padding:8px 15px;border-radius:100px}
  .bar .live{display:inline-flex;align-items:center;gap:9px;background:#0D2E20;color:var(--sun);
    font-family:'Space Mono',monospace;font-weight:700;font-size:14px;letter-spacing:2px;text-transform:uppercase;padding:8px 16px;border-radius:100px}
  .bar .live .dot{width:10px;height:10px;border-radius:50%;background:var(--sun);animation:pulse 1.3s infinite}
  .bar .date{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:1.5px;color:#5A1800;font-weight:700}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}

  /* Innehåll + mjuk övergång */
  .stage{flex:1;position:relative;overflow:hidden}
  .view{position:absolute;inset:0;padding:22px 30px;opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s;overflow:auto;pointer-events:none}
  .view.on{opacity:1;transform:none;pointer-events:auto}

  /* Grupper */
  .ggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:14px;align-items:start}
  @media(max-width:1100px){ .ggrid{grid-template-columns:repeat(3,1fr)} }
  .gcard{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.3)}
  .gcard h3{position:relative;font-family:'Anton',sans-serif;font-size:19px;letter-spacing:1px;padding:11px 16px 11px 18px;color:#fff;
    background:linear-gradient(90deg,rgba(255,140,66,.28),rgba(255,140,66,.02));border-bottom:1px solid var(--border)}
  .gcard h3::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--clay)}
  .gcard.dam h3{background:linear-gradient(90deg,rgba(244,183,64,.28),rgba(244,183,64,.02))}
  .gcard.dam h3::before{background:var(--sun)}
  table{width:100%;border-collapse:collapse;font-size:15.5px}
  th,td{padding:8px 8px;text-align:right}
  th:first-child,td:first-child{text-align:left;padding-left:14px}
  td:last-child,th:last-child{padding-right:14px}
  thead th{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:400}
  th:not(:first-child),td:not(:first-child){width:36px}
  tbody tr{border-top:1px solid var(--border)}
  td.nm{color:#fff;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
  td.nm .pn{white-space:nowrap}
  .rk{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:7px;background:#10231a;border:1px solid var(--border);font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);flex:none}
  tr.adv td{background:rgba(123,198,123,.12)}
  tr.adv .rk{background:rgba(123,198,123,.2);border-color:#2f5d3a;color:var(--green);font-weight:700}
  .cap{margin-top:16px;font-family:'Space Mono',monospace;font-size:13px;letter-spacing:1px;color:var(--muted)}
  .cap b{color:var(--green)}

  /* Matcher */
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
  .mcol h2{font-family:'Space Mono',monospace;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--sun);margin-bottom:12px}
  .mrow{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:12px;padding:12px 18px;margin-bottom:9px;font-size:19px}
  .mrow .side{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mrow .side.b{text-align:right}
  .mrow .side.win{color:var(--sun);font-weight:700}
  .mrow .sc{font-family:'Space Mono',monospace;font-weight:700;font-size:20px;background:#10231a;border:1px solid var(--border);border-radius:9px;padding:6px 12px;min-width:74px;text-align:center}
  .mrow .sc.vs{background:none;border:none;color:var(--muted);font-weight:400;font-size:14px}
  .mrow .gtag{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:1px;min-width:64px;text-align:right}
  .mrow .qn{flex:none;width:34px;height:34px;border-radius:9px;background:var(--clay);color:#0D2E20;font-family:'Space Mono',monospace;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
  .mrow.live{border:2px solid var(--green);box-shadow:0 0 0 3px rgba(123,198,123,.3),0 0 26px rgba(123,198,123,.3)}
  .mrow.live .sc.vs{color:var(--green);font-weight:700}
  .mrow .ld{flex:none;width:15px;height:15px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(123,198,123,.8);animation:pulse 1.3s infinite}
  .empty{color:var(--muted);font-size:18px;padding:14px}
  /* QR-kod (fast, nere till höger, rund mjuk design) */
  .qr{position:fixed;right:26px;bottom:60px;z-index:60;display:flex;align-items:center;gap:16px;
    background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:26px;
    padding:14px 22px 14px 14px;box-shadow:0 16px 40px rgba(0,0,0,.5);max-width:calc(100vw - 52px)}
  .qrbox{flex:none;width:130px;height:130px;background:#F6EFE2;border-radius:22px;padding:10px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px rgba(255,140,66,.25)}
  .qrbox img,.qrbox canvas{width:110px!important;height:110px!important;display:block;border-radius:6px}
  .qrtxt{font-family:'Space Mono',monospace;font-size:14px;letter-spacing:.5px;color:var(--cream);line-height:1.55;width:200px}
  .qrtxt .big{font-family:'Anton',sans-serif;font-size:18px;letter-spacing:.5px;color:var(--sun);display:block;margin-bottom:3px}
  .qrtxt b{color:var(--cream);display:block;font-size:12.5px;word-break:break-all;margin-top:3px}

  /* Slutspel */
  .champ{display:flex;align-items:center;gap:22px;background:linear-gradient(135deg,#F4B740,#E8931F 60%,#C9761a);border-radius:18px;padding:16px 28px;margin-bottom:20px;box-shadow:0 12px 34px rgba(244,183,64,.3)}
  .champ .tr{font-size:50px;line-height:1}
  .champ .t{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#5A3A00;font-weight:700}
  .champ .n{font-family:'Anton',sans-serif;font-size:42px;color:#0D2E20;line-height:1}
  .bracket{display:flex;gap:24px;align-items:stretch}
  .bcol{flex:1;min-width:0}
  .bcol .rt{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--sun);margin-bottom:12px}
  .bm{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:11px;padding:11px 15px;margin-bottom:11px;font-size:17px}
  .bm .r{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
  .bm .r.win{color:var(--sun);font-weight:700}
  .bm .r .s{font-family:'Space Mono',monospace}
  .bm.frilott{opacity:.65;font-style:italic}

  /* Rotationsindikator */
  .foot{display:flex;align-items:center;gap:14px;padding:0 34px 14px}
  .prog{flex:1;height:6px;background:var(--border);border-radius:4px;overflow:hidden}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun),var(--clay));border-radius:4px}
  .dots{display:flex;gap:8px}
  .dots b{width:9px;height:9px;border-radius:50%;background:var(--border);display:block;transition:.3s}
  .dots b.on{background:var(--clay);box-shadow:0 0 10px rgba(255,140,66,.7)}
  .count{font-family:'Space Mono',monospace;font-size:13px;color:var(--muted);letter-spacing:1px}
</style>
</head>
<body>
<div class="bar">
  <div class="rays"></div><div class="bsun"></div>
  <div class="logo">SPEED TENNIS MASTERS<small>Båstad Stegen · Säsongsavslutning</small></div>
  <div class="spacer"></div>
  <div class="viewname" id="viewname">Gruppspel</div>
  <div class="live"><span class="dot"></span>Live</div>
  <div class="date">Söndag 23 aug</div>
</div>

<div class="stage">
  <div class="view" id="v-grupper"></div>
  <div class="view" id="v-matcher"></div>
  <div class="view" id="v-slutspel"></div>
</div>

<div class="foot">
  <div class="count" id="count">Uppdateras live</div>
  <div class="prog"><i id="prog"></i></div>
  <div class="dots" id="dots"></div>
</div>

<div class="qr">
  <div class="qrbox" id="qrbox"></div>
  <div class="qrtxt"><span class="big">📱 Rapportera</span>Skanna &amp; välj ditt namn<br><b>bastadstegen.se/speedcup</b></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/bts-data.js"></script>
<script>
let ST={players:[],matches:[]};
const byId=id=>ST.players.find(p=>p.id===id)||{name:'—'};
const nm=id=>byId(id).name;
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const ROT=20000, DATA=15000;

async function refresh(){ try{ ST=await BTS.scState(); render(); }catch(e){} }

function standings(grp){
  const ps=ST.players.filter(p=>p.grp===grp);
  const rows=ps.map(p=>{ let w=0,pl=0,diff=0;
    ST.matches.forEach(m=>{ if(m.phase!=='group'||m.status!=='done')return; if(m.a_id!==p.id&&m.b_id!==p.id)return;
      pl++; if(m.winner_id===p.id)w++; diff+=(m.a_id===p.id?(m.score_a-m.score_b):(m.score_b-m.score_a)); });
    return {p,w,pl,diff}; });
  rows.sort((x,y)=>y.w-x.w||y.diff-x.diff||x.p.name.localeCompare(y.p.name,'sv'));
  return rows;
}
const DAM='E';   // damklassens grupp
function grpTitle(g){ return g===DAM?'Damklass':'Grupp '+g; }
function renderGrupper(){
  const grps=[...new Set(ST.players.map(p=>p.grp).filter(Boolean))].sort();
  if(!grps.length) return '<div class="empty">Grupperna lottas snart…</div>';
  const grid='<div class="ggrid">'+grps.map(g=>{
    const dam=(g===DAM), rows=standings(g);
    return `<div class="gcard ${dam?'dam':''}"><h3>${grpTitle(g)}</h3>
      <table><thead><tr><th>Spelare</th><th>S</th><th>V</th><th>±</th></tr></thead><tbody>
      ${rows.map((r,i)=>{ const adv=(!dam&&i<2); const medal=dam?'':(i===0?'🥇':i===1?'🥈':'');
        return `<tr class="${adv?'adv':''}"><td class="nm"><span class="rk">${i+1}</span><span class="pn">${esc(r.p.name)}</span>${medal?` ${medal}`:''}</td>
          <td>${r.pl}</td><td>${r.w}</td><td>${r.diff>0?'+':''}${r.diff}</td></tr>`; }).join('')}
      </tbody></table></div>`;
  }).join('')+'</div>';
  return grid+`<div class="cap"><b>1 &amp; 2 i varje grupp</b> går vidare till utslagningen · placeringen avgör seedningen</div>`;
}

function mmatch(m,showG){
  const aw=m.winner_id===m.a_id, bw=m.winner_id===m.b_id;
  const g=showG?`<span class="gtag">${m.phase==='group'?grpTitle(m.grp):koName(m)}</span>`:'';
  const sc=m.status==='done'?`<div class="sc">${m.score_a}–${m.score_b}</div>`
    :(m.court?`<div class="sc vs">bana ${esc(m.court)}</div>`:'<div class="sc vs">vs</div>');
  return `<div class="mrow"><div class="side ${aw?'win':''}">${esc(nm(m.a_id))}</div>${sc}<div class="side b ${bw?'win':''}">${esc(nm(m.b_id))}</div>${g}</div>`;
}
function isDamMatch(m){ return (m.phase==='group'&&m.grp==='E')||m.phase==='kod'; }
function fairOrder(list){
  const rounds={}, out=[];
  list.slice().sort((a,b)=>(''+(a.grp||'')).localeCompare(''+(b.grp||''))||a.id-b.id)
    .forEach(m=>{ let r=1; for(;;){ const s=rounds[r]||(rounds[r]=new Set());
      if(!s.has(m.a_id)&&!s.has(m.b_id)){ s.add(m.a_id); s.add(m.b_id); out.push({m,r}); break; } r++; } });
  out.sort((x,y)=>x.r-y.r||(''+(x.m.grp||'')).localeCompare(''+(y.m.grp||''))||x.m.id-y.m.id);
  return out.map(o=>o.m);
}
// Spelordning: väv 2 herr + 1 dam, upprepa (jämnt utfördelat)
function playOrder(){
  const all=ST.matches.filter(m=>m.a_id&&m.b_id);
  const herr=fairOrder(all.filter(m=>!isDamMatch(m)));
  const dam=fairOrder(all.filter(m=>isDamMatch(m)));
  const merged=[]; let i=0,j=0;
  while(i<herr.length||j<dam.length){
    if(i<herr.length) merged.push(herr[i++]);
    if(i<herr.length) merged.push(herr[i++]);
    if(j<dam.length) merged.push(dam[j++]);
  }
  return merged;
}
function renderMatcher(){
  const order=playOrder();
  const pending=order.filter(m=>m.status!=='done');
  const live=pending.filter(m=>m.status==='live');
  const upcoming=pending.filter(m=>m.status!=='live');
  const done=ST.matches.filter(m=>m.a_id&&m.b_id&&m.status==='done').slice().sort((a,b)=>b.id-a.id).slice(0,10);
  const lbl=m=>m.phase==='group'?grpTitle(m.grp):koName(m);
  const liveRow=m=>`<div class="mrow live"><span class="ld"></span>
    <div class="side win">${esc(nm(m.a_id))}</div><div class="sc vs">pågår</div><div class="side b win">${esc(nm(m.b_id))}</div>
    <span class="gtag">${lbl(m)}</span></div>`;
  const q=upcoming.slice(0,12).map((m,i)=>`
    <div class="mrow"><div class="qn">${i+1}</div>
      <div class="side">${esc(nm(m.a_id))}</div><div class="sc vs">vs</div>
      <div class="side b">${esc(nm(m.b_id))}</div>
      <span class="gtag">${lbl(m)}</span></div>`).join('');
  return `<div class="mgrid">
    <div class="mcol">
      ${live.length?`<h2>🟢 Pågår nu (${live.length})</h2>${live.map(liveRow).join('')}<h2 style="margin-top:18px">🎾 Näst på tur (${upcoming.length} kvar)</h2>`
                   :`<h2>🎾 Spelordning · näst på tur (${upcoming.length} kvar)</h2>`}
      ${q||'<div class="empty">Inga matcher kvar att spela.</div>'}</div>
    <div class="mcol"><h2>✅ Senaste resultat</h2>
      ${done.length?done.map(m=>mmatch(m,true)).join(''):'<div class="empty">Inga rapporterade än.</div>'}</div>
  </div>`;
}

function koName(m){ const n=ST.matches.filter(x=>x.phase===m.phase&&x.grp===m.grp).length;
  return (m.phase==='kod'?'Dam ':'')+({1:'Final',2:'Semi',4:'Kvart',8:'Åttondel',16:'Sextondel'})[n]||'Slutspel'; }
function roundLabel(n){ return ({1:'Final',2:'Semifinal',4:'Kvartsfinal',8:'Åttondelsfinal',16:'Sextondelsfinal'})[n]||'Slutspel'; }
function bmatch(m){
  if(!m.a_id&&!m.b_id) return `<div class="bm frilott"><div class="r"><span>Väntar…</span></div></div>`;
  if(!m.a_id||!m.b_id){ const p=m.a_id||m.b_id; return `<div class="bm frilott"><div class="r win"><span>${esc(nm(p))}</span><span class="s">frilott</span></div></div>`; }
  const aw=m.winner_id===m.a_id, bw=m.winner_id===m.b_id, d=m.status==='done';
  return `<div class="bm">
    <div class="r ${aw?'win':''}"><span>${esc(nm(m.a_id))}</span><span class="s">${d?m.score_a:''}</span></div>
    <div class="r ${bw?'win':''}"><span>${esc(nm(m.b_id))}</span><span class="s">${d?m.score_b:''}</span></div></div>`;
}
function hasKo(){ return ST.matches.some(m=>m.phase==='ko'||m.phase==='kod'); }
function renderTreeTV(tag,title){
  const ko=ST.matches.filter(m=>m.phase===tag);
  if(!ko.length) return '';
  const byR={}; ko.forEach(m=>{(byR[+m.grp]=byR[+m.grp]||[]).push(m);});
  const rounds=Object.keys(byR).map(Number).sort((a,b)=>a-b);
  const maxR=rounds[rounds.length-1], fin=byR[maxR][0];
  const champ=(fin&&fin.status==='done')
    ? `<div class="champ"><div class="tr">🏆</div><div><div class="t">${title} · Mästare</div><div class="n">${esc(nm(fin.winner_id))}</div></div></div>` : '';
  const cols=rounds.slice().reverse().map(r=>{
    const ms=byR[r].slice().sort((a,b)=>(a.slot||0)-(b.slot||0));
    return `<div class="bcol"><div class="rt">${roundLabel(ms.length)}</div>${ms.map(bmatch).join('')}</div>`;
  }).join('');
  return `<div class="rt" style="font-size:16px;color:var(--cream);margin:6px 0 10px">${title}</div>${champ}<div class="bracket">${cols}</div>`;
}
function renderSlutspel(){
  const herr=renderTreeTV('ko','Herrklass');
  const dam=renderTreeTV('kod','Damklass');
  if(!herr && !dam) return '<div class="empty">Slutspelet visas när gruppspelet är klart.</div>';
  return herr + (herr&&dam?'<div style="height:22px"></div>':'') + dam;
}

const NAMES={grupper:'Gruppspel',matcher:'Matcher',slutspel:'Slutspel'};
function activeViews(){ const v=['grupper','matcher']; if(hasKo()) v.push('slutspel'); return v; }
let idx=0;
function render(){
  document.getElementById('v-grupper').innerHTML=renderGrupper();
  document.getElementById('v-matcher').innerHTML=renderMatcher();
  document.getElementById('v-slutspel').innerHTML=renderSlutspel();
  showView();
}
function showView(){
  const views=activeViews();
  if(idx>=views.length) idx=0;
  const cur=views[idx];
  ['grupper','matcher','slutspel'].forEach(v=>document.getElementById('v-'+v).classList.toggle('on',v===cur));
  document.getElementById('viewname').textContent=NAMES[cur];
  document.getElementById('dots').innerHTML=views.map((v,i)=>`<b class="${i===idx?'on':''}"></b>`).join('');
  document.getElementById('count').textContent=(ST.players.length||0)+' spelare · uppdateras live';
}
function rotate(){ idx=(idx+1)%activeViews().length; showView(); }

// QR-kod till rapporteringen
try{ new QRCode(document.getElementById('qrbox'), {text:'https://bastadstegen.se/speedcup.html',
  width:132, height:132, colorDark:'#0D2E20', colorLight:'#F6EFE2', correctLevel:QRCode.CorrectLevel.M}); }catch(e){}

let t0=Date.now();
function tick(){ document.getElementById('prog').style.width=(Math.min(1,(Date.now()-t0)/ROT)*100)+'%'; requestAnimationFrame(tick); }

setInterval(()=>{ rotate(); t0=Date.now(); }, ROT);
