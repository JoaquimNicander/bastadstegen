<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Betalstatus · Sommarstegen 2026</title>
<style>
  :root{ --green:#0D2E20; --cream:#FAF6EF; --ink:#12241b; --muted:#5d6b62; --orange:#E8520A; --line:#e7dfd2; }
  *{box-sizing:border-box}
  body{margin:0;background:#eef0ea;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:var(--ink);padding:20px 14px}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 16px}
  input[type=password]{width:100%;font:inherit;font-size:15px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;outline:none}
  .btn{background:var(--green);color:#fff;border:0;border-radius:9px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer;margin-top:10px}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
  .kpi{flex:1 1 150px;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi .n{font-size:24px;font-weight:800} .kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-top:2px}
  table{border-collapse:collapse;width:100%;font-size:14px;background:#fff;border-radius:12px;overflow:hidden}
  th,td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left}
  th{background:var(--green);color:#fff;font-size:12px;letter-spacing:.5px}
  tr.done{background:#f2faf4}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px}
  .tag.yes{background:#e7f6ec;color:#1c7a3f} .tag.no{background:#f1efe9;color:#8a8577}
  .when{color:var(--muted);font-size:11px}
  .rgt{text-align:right} .status{color:var(--muted);font-size:13px;margin-top:8px}
  .hide{display:none}
  a.small{color:var(--orange);font-size:12px;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Betalstatus — Sommarstegen 2026</h1>
  <p class="sub">Vem har tryckt "Jag har betalat" och vem har inte. Bekräfta inbetalningar när de landat på kontot.</p>

  <div class="card" id="login">
    <label for="pw" style="font-weight:700;font-size:14px">Adminlösenord</label>
    <input id="pw" type="password" placeholder="lösenord" onkeydown="if(event.key==='Enter')login()">
    <button class="btn" onclick="login()">Visa lista →</button>
    <div class="status" id="loginStatus"></div>
  </div>

  <div id="app" class="hide">
    <div class="kpis">
      <div class="kpi"><div class="n" id="k-marked">–</div><div class="l">Markerat betalat</div></div>
      <div class="kpi"><div class="n" id="k-confirmed">–</div><div class="l">Bekräftade</div></div>
      <div class="kpi"><div class="n" id="k-open">–</div><div class="l">Ej markerat</div></div>
      <div class="kpi"><div class="n" id="k-sum">–</div><div class="l">Summa utestående</div></div>
    </div>
    <table>
      <thead><tr><th>Namn</th><th class="rgt">Belopp</th><th>Markerat</th><th>Bekräftad</th><th>Kontakt</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="status" id="status"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/bts-data.js"></script>
<script>
let PW='', ROWS=[];
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const kr=n=>Number(n||0).toLocaleString('sv-SE');
function fmtDate(s){ if(!s) return ''; const d=new Date(s); return d.toLocaleDateString('sv-SE')+' '+d.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'}); }

async function login(){
  const pw=(document.getElementById('pw').value||'').trim();
  const s=document.getElementById('loginStatus');
  if(!pw){ s.textContent='Ange lösenord.'; return; }
  s.textContent='Kontrollerar…';
  try{
    ROWS=await BTS.underlagAdmin(pw); PW=pw;
    document.getElementById('login').classList.add('hide');
    document.getElementById('app').classList.remove('hide');
    render();
  }catch(e){ s.textContent = /lösenord/i.test(e.message||'')?'Fel lösenord.':('Fel: '+(e.message||e)); }
}

function render(){
  const marked=ROWS.filter(r=>r.marked_paid).length;
  const confirmed=ROWS.filter(r=>r.paid).length;
  const open=ROWS.filter(r=>!r.marked_paid).length;
  const utest=ROWS.filter(r=>!r.paid).reduce((a,r)=>a+Number(r.belopp||0),0);
  document.getElementById('k-marked').textContent=marked;
  document.getElementById('k-confirmed').textContent=confirmed;
  document.getElementById('k-open').textContent=open;
  document.getElementById('k-sum').textContent=kr(utest)+' kr';
  document.getElementById('rows').innerHTML = ROWS.map(r=>{
    const mk = r.marked_paid ? `<span class="tag yes">✓ Ja</span> <span class="when">${esc(fmtDate(r.marked_paid_at))}</span>` : `<span class="tag no">– Nej</span>`;
    const cb = `<label style="cursor:pointer"><input type="checkbox" ${r.paid?'checked':''} onchange="setPaid('${r.token}',this.checked)"> bekräftad</label>`;
    const contact = esc(r.email||'') + (r.email&&r.phone?' · ':'') + esc(r.phone||'');
    return `<tr class="${r.marked_paid?'done':''}"><td>${esc(r.name)}</td><td class="rgt"><b>${kr(r.belopp)} kr</b></td><td>${mk}</td><td>${cb}</td><td style="font-size:12px;color:#5d6b62">${contact}</td></tr>`;
  }).join('');
}

async function setPaid(token, paid){
  const s=document.getElementById('status'); s.textContent='Sparar…';
  try{
    await BTS.underlagSetPaid(PW, token, paid);
    const row=ROWS.find(r=>r.token===token); if(row) row.paid=paid;
    render(); s.textContent='Sparat ✓';
    setTimeout(()=>{ if(s.textContent==='Sparat ✓') s.textContent=''; }, 1500);
  }catch(e){ s.textContent='Kunde inte spara: '+(e.message||e); }
}
</script>
</body>
</html>
