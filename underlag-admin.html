<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kontor · Betalstatus · Sommarstegen 2026</title>
<style>
  :root{ --green:#0D2E20; --cream:#FAF6EF; --ink:#12241b; --muted:#5d6b62; --orange:#E8520A; --line:#e7dfd2; --ok:#1c7a3f; --okbg:#e7f6ec; --okln:#bfe6cc; }
  *{box-sizing:border-box}
  body{margin:0;background:#eef0ea;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:var(--ink);padding:20px 14px}
  .wrap{max-width:860px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
  .kpi{flex:1 1 150px;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi .n{font-size:22px;font-weight:800} .kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-top:2px}
  .kpi.ok .n{color:var(--ok)} .kpi.out .n{color:#b9440a}
  table{border-collapse:collapse;width:100%;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left}
  th{background:var(--green);color:#fff;font-size:12px;letter-spacing:.5px}
  td.r,th.r{text-align:right}
  tr.done td{background:#f2faf4}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px}
  .tag.yes{background:var(--okbg);color:var(--ok)} .tag.no{background:#f1efe9;color:#8a8577}
  .when{color:var(--muted);font-size:11px}
  .status{color:var(--muted);font-size:13px;margin-top:8px}
  .state{text-align:center;color:var(--muted);padding:40px}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 14px;flex-wrap:wrap}
  .print{background:var(--green);color:#fff;border:0;border-radius:9px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
  @media print{ .print{display:none} body{background:#fff} th{ -webkit-print-color-adjust:exact;print-color-adjust:exact } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Betalstatus — Sommarstegen 2026 <span style="font-size:13px;color:#8a8577">· kontor</span></h1>
  <p class="sub">Vem har tryckt "Jag har betalat" och vem inte. Bocka av inbetalningar när de landat på kontot.</p>
  <div id="app"><div class="state">Laddar…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/bts-data.js"></script>
<script>
let KEY='', ROWS=[];
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const kr=n=>Number(n||0).toLocaleString('sv-SE');
function fmtDate(s){ if(!s) return ''; const d=new Date(s); return d.toLocaleDateString('sv-SE')+' '+d.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'}); }

(async function(){
  KEY=new URLSearchParams(location.search).get('k')||'';
  const app=document.getElementById('app');
  if(!KEY){ app.innerHTML='<div class="state">Länken saknar kod. Använd den fullständiga länken du fått.</div>'; return; }
  try{
    ROWS=await BTS.underlagOffice(KEY);
    render();
  }catch(e){
    app.innerHTML='<div class="state">'+(/ogiltig/i.test(e.message||'')?'Ogiltig länk.':'Kunde inte ladda: '+esc(e.message||e))+'</div>';
  }
})();

function render(){
  const marked=ROWS.filter(r=>r.marked_paid).length;
  const confirmed=ROWS.filter(r=>r.paid).length;
  const sum=ROWS.reduce((a,r)=>a+Number(r.belopp||0),0);
  const utest=ROWS.filter(r=>!r.paid).reduce((a,r)=>a+Number(r.belopp||0),0);
  const rows=ROWS.map(r=>{
    const mk = r.marked_paid ? `<span class="tag yes">✓ Ja</span> <span class="when">${esc(fmtDate(r.marked_paid_at))}</span>` : `<span class="tag no">– Nej</span>`;
    const cb = `<label style="cursor:pointer"><input type="checkbox" ${r.paid?'checked':''} onchange="setPaid('${r.token}',this.checked)"> bekräftad</label>`;
    const contact = esc(r.email||'') + (r.email&&r.phone?' · ':'') + esc(r.phone||'');
    return `<tr class="${r.marked_paid?'done':''}"><td>${esc(r.name)}</td><td class="r">${kr(r.belopp)} kr</td><td>${mk}</td><td>${cb}</td><td style="font-size:12px;color:#5d6b62">${contact}</td></tr>`;
  }).join('');
  document.getElementById('app').innerHTML=`
    <div class="toolbar">
      <div class="status">${ROWS.length} deltagare</div>
      <button class="print" onclick="window.print()">Skriv ut / spara PDF</button>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="n">${marked}</div><div class="l">Markerat betalat</div></div>
      <div class="kpi ok"><div class="n">${confirmed}</div><div class="l">Bekräftade</div></div>
      <div class="kpi out"><div class="n">${kr(utest)} kr</div><div class="l">Summa utestående</div></div>
      <div class="kpi"><div class="n">${kr(sum)} kr</div><div class="l">Totalt</div></div>
    </div>
    <table>
      <thead><tr><th>Namn</th><th class="r">Belopp</th><th>Markerat</th><th>Bekräftad</th><th>Kontakt</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="status" id="status"></div>`;
}

async function setPaid(token, paid){
  const s=document.getElementById('status'); if(s) s.textContent='Sparar…';
  try{
    await BTS.underlagOfficeSetPaid(KEY, token, paid);
    const row=ROWS.find(r=>r.token===token); if(row) row.paid=paid;
    render(); const s2=document.getElementById('status'); if(s2){ s2.textContent='Sparat ✓'; setTimeout(()=>{ if(s2.textContent==='Sparat ✓') s2.textContent=''; },1500); }
  }catch(e){ const s2=document.getElementById('status'); if(s2) s2.textContent='Kunde inte spara: '+(e.message||e); }
}
</script>
</body>
</html>
