<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTS Shop – Merch</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand.css">
<style>
  :root{
    --bg:#0D2E20; --card:#0D2A1D; --card2:#0D2A1D; --border2:#1C3A2B; --border:#133124;
    --cream:#F5EDE3; --white:#fff; --muted:#9A8F86; --clay:#FF8C42; --sun:#F4B740; --down:#EF5350;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Outfit',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--cream);min-height:100vh}
  .topbar{display:flex;justify-content:flex-end;padding:12px 18px}
  .topbar a{color:#fff;text-decoration:none;font-size:13px;border:1px solid rgba(255,255,255,.28);padding:7px 13px;border-radius:8px;background:rgba(0,0,0,.18)}
  .hero{position:relative;overflow:hidden;text-align:center;padding:30px 20px 30px;background:linear-gradient(165deg,#FF8C42 0%,#FF8C42 42%,#7A2400 70%,var(--bg) 100%)}
  .hero h1{font-family:'Anton',sans-serif;font-size:44px;letter-spacing:3px;margin:0;color:#fff}
  .hero .tag{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#5A1800;margin-top:8px}
  .wrap{max-width:680px;margin:0 auto;padding:20px}
  .panel{background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:18px;margin-bottom:16px}
  .label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  input,select{width:100%;padding:11px;border-radius:8px;border:1px solid var(--border2);background:var(--card2);color:var(--white);font-size:15px;margin-bottom:8px}
  .btn{background:var(--clay);color:#061712;border:none;font-weight:700;padding:12px 16px;border-radius:8px;cursor:pointer;font-size:14px;width:100%;margin-top:6px}
  .btn.alt{background:var(--card2);color:var(--cream);border:1px solid var(--border2)}
  .btn.sm{width:auto;margin:0;padding:8px 12px;font-size:13px}
  .muted{color:var(--muted);font-size:13px;line-height:1.6}
  .err{color:var(--down);font-size:13px;margin-top:6px}
  .hidden{display:none}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}
  .prod{background:var(--card);border:1px solid var(--border2);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .prod .art{position:relative;height:210px;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#FFC559,#F0791A 70%,#D9450A);overflow:hidden}
  .prod .art svg{width:96px;height:96px;filter:drop-shadow(0 4px 8px rgba(90,24,0,.3))}
  .prod .art img{width:100%;height:100%;object-fit:cover;display:block}
  .prod .body{padding:14px 16px;display:flex;flex-direction:column;flex:1}
  .prod .body .btn{margin-top:auto}
  .prod .nm{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:.5px;color:var(--cream)}
  .prod .price{color:var(--sun);font-family:'Space Mono',monospace;font-weight:700;font-size:14px;margin:2px 0 8px}
  .prod .desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:var(--card2)}
  .row .nm2{flex:1;font-weight:500}
  .pill{font-size:10px;font-family:'Space Mono',monospace;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:100px;border:1px solid var(--border2);color:var(--muted)}
  .pill.done{color:#7CCB6B;border-color:#2f5a2a}
  .admin-toggle{font-size:11px;color:var(--muted);text-align:center;margin-top:26px;cursor:pointer}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0D2A1D;border:1px solid var(--clay);color:var(--cream);padding:12px 20px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
  #toast.show{opacity:1}
</style>
</head>
<body>
<div class="topbar"><a href="index.html">← Startsidan</a></div>
<div class="hero">
  <div style="display:flex;align-items:center;justify-content:center;gap:16px">
    <img src="bts-crest.png" alt="Båstad TS" style="height:58px;width:auto;display:block">
    <h1 style="margin:0">BTS SHOP</h1>
  </div>
  <div class="tag">🎾 Summer Edition · Merch</div>
</div>

<div class="wrap">
  <div id="app"><div class="muted">Laddar…</div></div>

  <div class="admin-toggle" onclick="document.getElementById('admin-panel').classList.toggle('hidden')">⚙︎ Admin – beställningar</div>
  <div id="admin-panel" class="panel hidden">
    <div id="admin-login">
      <div class="label">Admin – logga in</div>
      <input type="password" id="admin-pw" placeholder="Adminlösenord" onkeydown="if(event.key==='Enter')adminLogin()">
      <button class="btn alt" onclick="adminLogin()">Logga in</button>
      <div id="admin-err" class="err"></div>
    </div>
    <div id="admin-body" class="hidden">
      <div class="row" style="justify-content:space-between;background:none;border:none;padding:0">
        <div class="label" style="margin:0">✓ Alla beställningar</div>
        <button class="btn sm alt" onclick="loadAdminOrders()">Uppdatera</button>
      </div>
      <div id="admin-orders" style="margin-top:10px"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/bts-data.js"></script>
<script>
// Priser (kr) – ändra fritt
const PRIS = { keps: 200, tshirt: 200 };
const NAMN = { keps: 'Keps', tshirt: 'T-shirt' };
const CAP_SVG = '<svg viewBox="0 0 100 100" fill="none"><path d="M14 62 Q50 34 86 62 Q70 54 50 54 Q30 54 14 62Z" fill="#0D2E20"/><path d="M50 30 Q84 34 88 60 L74 62 Q72 44 50 42 Q28 44 26 62 L14 60 Q18 34 50 30Z" fill="#F5EDE3"/><ellipse cx="50" cy="30" rx="7" ry="5" fill="#0D2E20"/></svg>';
const TEE_SVG = '<svg viewBox="0 0 100 100" fill="none"><path d="M35 22 L20 30 L12 46 L24 54 L28 48 L28 80 L72 80 L72 48 L76 54 L88 46 L80 30 L65 22 Q50 34 35 22Z" fill="#F5EDE3"/><path d="M35 22 Q50 34 65 22 Q58 30 50 30 Q42 30 35 22Z" fill="#0D2E20"/></svg>';

let players=[], me=null, adminPw=null;

async function load(){
  if(!window.BTS||!BTS.ready()){ document.getElementById('app').innerHTML='<div class="muted">Databasen ej konfigurerad.</div>'; return; }
  try{ players = await BTS.getPlayers(); }catch(e){ console.warn(e); }
  render();
}

function render(){
  const el=document.getElementById('app');
  if(!me){
    const opts=players.filter(p=>p.active!==false).slice().sort((a,b)=>a.name.localeCompare(b.name,'sv')).map(p=>`<option>${p.name}</option>`).join('');
    el.innerHTML=`<div class="panel"><div class="label">🎾 Logga in för att beställa</div>
      <div class="muted" style="margin-bottom:12px">Logga in med ditt namn och PIN (4 sista i mobilnr) för att beställa merch.</div>
      <select id="login-name"><option value="">Välj ditt namn…</option>${opts}</select>
      <input type="password" id="login-pin" inputmode="numeric" maxlength="4" placeholder="PIN (4 siffror)">
      <button class="btn" onclick="doLogin()">Logga in</button>
      <div id="login-err" class="err"></div></div>`;
    return;
  }
  el.innerHTML=`
    <div class="muted" style="margin:-2px 0 14px;text-align:right">Inloggad som <strong style="color:var(--cream)">${me.name}</strong> · <a href="#" onclick="logout();return false" style="color:var(--clay)">logga ut</a></div>
    <div class="grid">
      <div class="prod">
        <div class="art"><img src="shop-keps.png" alt="Keps" onerror="this.outerHTML=CAP_SVG"></div>
        <div class="body">
          <div class="nm">Keps</div>
          <div class="price">${PRIS.keps} kr · one size</div>
          <div class="desc">Grå bomullskeps med broderad Båstad Stegen-logga och gul tennisboll. Justerbar bak – passar alla.</div>
          <label class="label" style="margin-bottom:5px">Antal</label>
          <select id="keps-qty">${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select>
          <button class="btn" onclick="placeOrder('keps')">Beställ keps →</button>
        </div>
      </div>
      <div class="prod">
        <div class="art"><img src="shop-tshirt.png" alt="T-shirt" onerror="this.outerHTML=TEE_SVG"></div>
        <div class="body">
          <div class="nm">T-shirt</div>
          <div class="price">${PRIS.tshirt} kr</div>
          <div class="desc">Orange t-shirt i skön bomull med Båstad Stegen-tryck på bröstet. Lika snygg i matchen som på stan.</div>
          <label class="label" style="margin-bottom:5px">Storlek</label>
          <select id="tshirt-size"><option value="">Välj storlek…</option><option>M</option><option>L</option><option>XL</option></select>
          <label class="label" style="margin-bottom:5px">Antal</label>
          <select id="tshirt-qty">${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select>
          <button class="btn" onclick="placeOrder('tshirt')">Beställ t-shirt →</button>
        </div>
      </div>
    </div>
    <div class="muted" style="text-align:center;margin:14px 0 6px">Ingen betalning i appen – Joaquim hör av sig om leverans & betalning.</div>
    <div class="panel" style="margin-top:16px"><div class="label">Mina beställningar</div><div id="my-orders"><div class="muted">Laddar…</div></div></div>`;
  refreshMine();
}

async function doLogin(){
  const name=document.getElementById('login-name').value, pin=document.getElementById('login-pin').value, err=document.getElementById('login-err');
  const p=players.find(x=>x.name===name);
  if(!p){ err.textContent='Välj ditt namn.'; return; }
  try{ if(await BTS.verifyPin(p.id,pin)){ me=p; me._pin=pin; render(); }
    else err.textContent='Fel PIN (4 sista i telefonnumret).'; }
  catch(e){ err.textContent='Fel: '+(e.message||e); }
}
function logout(){ me=null; render(); }

async function placeOrder(item){
  const size = item==='tshirt' ? (document.getElementById('tshirt-size')||{}).value : null;
  const qty = parseInt((document.getElementById(item+'-qty')||{}).value)||1;
  if(item==='tshirt' && !size){ alert('Välj storlek (M/L/XL).'); return; }
  try{ await BTS.shopOrder(me.id, me._pin, item, size, qty); toast('Beställning lagd! 🎾'); await refreshMine(); }
  catch(e){ alert('Fel: '+(e.message||e)); }
}

async function refreshMine(){
  const box=document.getElementById('my-orders'); if(!box) return;
  try{
    const list=await BTS.shopMyOrders(me.id, me._pin);
    box.innerHTML = list.length ? list.map(o=>`<div class="row">
      <div class="nm2">${NAMN[o.item]||o.item}${o.size?` · ${o.size}`:''} <span class="muted">×${o.qty}</span></div>
      <span class="pill ${o.status==='levererad'?'done':''}">${o.status==='levererad'?'✓ levererad':'beställd'}</span>
      ${o.status==='ny'?`<button class="btn sm alt" onclick="cancelOrder('${o.id}')">Avboka</button>`:''}
    </div>`).join('') : '<div class="muted">Inga beställningar än.</div>';
  }catch(e){ box.innerHTML='<div class="err">Fel: '+(e.message||e)+'</div>'; }
}
async function cancelOrder(id){
  if(!confirm('Avboka beställningen?')) return;
  try{ await BTS.shopCancel(me.id, me._pin, id); await refreshMine(); }
  catch(e){ alert('Fel: '+(e.message||e)); }
}

// ── ADMIN ──
async function adminLogin(){
  const pw=document.getElementById('admin-pw').value.trim(), err=document.getElementById('admin-err');
  if(!pw){ err.textContent='Ange lösenord.'; return; }
  err.textContent='Kontrollerar…';
  try{
    await BTS.adminShopOrders(pw);   // kastar om fel lösenord
    adminPw=pw; err.textContent='';
    document.getElementById('admin-login').classList.add('hidden');
    document.getElementById('admin-body').classList.remove('hidden');
    loadAdminOrders();
  }catch(e){ err.textContent='Fel lösenord.'; }
}
async function loadAdminOrders(){
  const box=document.getElementById('admin-orders'); if(!box||!adminPw) return;
  try{
    const list=await BTS.adminShopOrders(adminPw);
    if(!list.length){ box.innerHTML='<div class="muted">Inga beställningar än.</div>'; return; }
    box.innerHTML=list.map(o=>`<div class="row" style="flex-wrap:wrap">
      <div class="nm2" style="min-width:150px">${o.name} — ${NAMN[o.item]||o.item}${o.size?` · ${o.size}`:''} ×${o.qty}
        <div class="muted" style="font-size:11px">${o.phone||'(ingen tel)'} · ${o.email||'(ingen mejl)'}</div></div>
      <span class="pill ${o.status==='levererad'?'done':''}">${o.status}</span>
      ${o.status==='ny'
        ? `<button class="btn sm green" style="background:#4CAF50;color:#053" onclick="setStatus('${o.id}','levererad')">Markera levererad</button>`
        : `<button class="btn sm alt" onclick="setStatus('${o.id}','ny')">Ångra</button>`}
      <button class="btn sm alt" onclick="setStatus('${o.id}','delete')">🗑</button>
    </div>`).join('');
  }catch(e){ box.innerHTML='<div class="err">Fel: '+(e.message||e)+'</div>'; }
}
async function setStatus(id,status){
  if(status==='delete' && !confirm('Ta bort beställningen?')) return;
  try{ await BTS.adminShopSetStatus(adminPw,id,status); loadAdminOrders(); }
  catch(e){ alert('Fel: '+(e.message||e)); }
}

let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

load();
</script>
</body>
</html>
