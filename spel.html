<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kan du spela? · Båstad Stegen</title>
<style>
  :root{ --green:#0D2E20; --green2:#123c2a; --line:#1C3A2B; --line2:#2A5A42;
         --cream:#F5EDE3; --muted:rgba(245,237,227,.6); --clay:#FF8C42; --lime:#D7F23C; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--green);color:var(--cream);
       font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;line-height:1.5;
       display:flex;align-items:flex-start;justify-content:center;padding:0 18px 44px}
  .wrap{width:100%;max-width:430px;text-align:center}

  .hero{position:relative;margin:0 -18px 0;height:230px;overflow:hidden}
  .hero img.bg{width:100%;height:100%;object-fit:cover;object-position:50% 62%;display:block}
  .hero::after{content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(13,46,32,.28) 0%,rgba(13,46,32,.55) 45%,var(--green) 100%)}
  .hero .logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-56%);z-index:2;
    width:168px;max-width:62%;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
  @media (max-width:360px){ .hero{height:196px} }
  .kick{margin-top:4px}

  .kick{font-family:'Space Mono',ui-monospace,monospace;font-size:11px;letter-spacing:3px;
        text-transform:uppercase;color:var(--clay);font-weight:700}
  h1{margin:14px 0 0;font-size:30px;line-height:1.15;letter-spacing:-.6px;font-weight:800}
  .when{margin:22px auto 0;display:inline-block;border:1px solid var(--line2);border-radius:14px;
        padding:14px 22px;background:rgba(255,255,255,.03)}
  .when .d{font-size:19px;font-weight:700;letter-spacing:-.2px}
  .when .t{font-size:13px;color:var(--muted);margin-top:2px}

  .btns{display:flex;gap:12px;margin:30px 0 0}
  .b{flex:1;border:none;border-radius:16px;padding:22px 10px;font-size:17px;font-weight:800;
     font-family:inherit;cursor:pointer;transition:transform .12s, filter .12s}
  .b:active{transform:scale(.97)}
  .b.ja{background:var(--lime);color:#17301a}
  .b.nej{background:transparent;color:var(--cream);border:1.5px solid var(--line2)}
  .b.nej:hover{border-color:var(--clay);color:var(--clay)}
  .b[disabled]{opacity:.5;cursor:default}

  .dl{margin-top:16px;font-size:14px;font-weight:700;color:var(--lime)}
  .dl span{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:3px}

  .wish{margin-top:22px;text-align:left}
  .wish label{display:block;font-family:'Space Mono',ui-monospace,monospace;font-size:9.5px;
        letter-spacing:1.6px;text-transform:uppercase;color:var(--clay);font-weight:700;margin-bottom:7px}
  .wish textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line2);
        border-radius:13px;color:var(--cream);font-family:inherit;font-size:14.5px;line-height:1.5;
        padding:12px 13px;resize:none;min-height:62px}
  .wish textarea::placeholder{color:rgba(245,237,227,.33)}
  .wish textarea:focus{outline:none;border-color:var(--clay)}
  .wish .hint{font-size:11.5px;color:rgba(245,237,227,.42);margin-top:6px}
  .echo{margin:20px 0 0;text-align:left;border-left:2px solid var(--clay);
        background:rgba(255,255,255,.03);border-radius:0 11px 11px 0;padding:11px 13px;
        font-size:13.5px;color:rgba(245,237,227,.8);font-style:italic}
  .echo b{display:block;font-family:'Space Mono',ui-monospace,monospace;font-size:9px;
        letter-spacing:1.5px;text-transform:uppercase;color:rgba(245,237,227,.42);
        font-style:normal;margin-bottom:4px;font-weight:700}
  .info{margin:30px 0 0;text-align:left;border:1px solid var(--line);border-radius:14px;
        padding:17px 18px;background:rgba(255,255,255,.025)}
  .info h3{margin:0 0 9px;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;
        color:var(--clay);font-weight:700;font-family:'Space Mono',ui-monospace,monospace}
  .info p{margin:0 0 11px;font-size:13.5px;color:rgba(245,237,227,.78);line-height:1.62}
  .info p:last-child{margin:0}

  .note{margin-top:22px;font-size:12.5px;color:var(--muted)}
  .state{padding:40px 0;color:var(--muted)}
  .err{color:#ffb3a0;font-size:14px;margin-top:16px;min-height:20px}

  /* Svarat-läge */
  .done .mark{width:74px;height:74px;border-radius:50%;margin:0 auto;display:flex;
       align-items:center;justify-content:center;font-size:34px}
  .done.ja .mark{background:var(--lime);color:#17301a}
  .done.nej .mark{background:rgba(255,255,255,.06);border:1.5px solid var(--line2);color:var(--cream)}
  .done h2{margin:20px 0 0;font-size:24px;font-weight:800;letter-spacing:-.4px}
  .done p{margin:10px 0 0;font-size:14.5px;color:var(--muted)}
  .change{margin-top:26px;background:none;border:none;color:var(--clay);font-size:13.5px;
          font-family:inherit;text-decoration:underline;cursor:pointer}
  .foot{margin-top:38px;font-size:11.5px;color:rgba(245,237,227,.38);line-height:1.7}
  .foot a{color:inherit}
</style>
</head>
<body>
  <div class="wrap" id="app"><div class="state">Hämtar…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/bts-data.js"></script>
<script>
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const app = document.getElementById('app');
let CARD = null;

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function first(n){ return String(n||'').split(' ')[0]; }

function datumText(d){
  if(!d) return '';
  const dt = new Date(d+'T00:00:00');
  const s = dt.toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}

function renderFraga(){
  app.innerHTML = hero()
    + '<div class="kick">Höststegen 2026</div>'
    + '<h1>Hej ' + esc(first(CARD.namn)) + '!<br>Kan du spela?</h1>'
    + '<div class="when"><div class="d">' + esc(datumText(CARD.speldag)) + '</div>'
    + '<div class="t">Start kl ' + esc(CARD.starttid) + '</div></div>'
    + '<div class="dl">Svara senast ' + esc(CARD.svarstopp || 'fredag kl 16.00')
    + '<span>På torsdag sätter vi matcherna – då ser du vem du möter</span></div>'
    + '<div class="wish"><label>Önskemål om tid eller annat</label>'
    + '<textarea id="wish" maxlength="400" placeholder="T.ex. &quot;kan bara 15.00&quot; eller &quot;helst grus&quot;. Frivilligt.">'
    + esc(CARD.onskemal || '') + '</textarea>'
    + '<div class="hint">Vi försöker ta hänsyn, men kan inte lova.</div></div>'
    + '<div class="btns">'
    + '<button class="b ja" id="bJa">Ja, jag kan</button>'
    + '<button class="b nej" id="bNej">Nej</button>'
    + '</div>'
    + '<div class="err" id="err"></div>'
    + info() + foot();
  document.getElementById('bJa').onclick  = () => svara('ja');
  document.getElementById('bNej').onclick = () => svara('nej');
}

function renderSvarat(){
  const ja = CARD.svar === 'ja';
  app.innerHTML = hero()
    + '<div class="done ' + (ja?'ja':'nej') + '">'
    + '<div class="mark">' + (ja?'✓':'–') + '</div>'
    + '<h2>' + (ja ? 'Tack – du är med!' : 'Tack för beskedet') + '</h2>'
    + '<p>' + (ja
        ? 'Du är anmäld till ' + esc(datumText(CARD.speldag)).toLowerCase() + ', start kl ' + esc(CARD.starttid)
          + '. På torsdag sätter vi matcherna, då ser du din motståndare i stegen.'
        : 'Du står över den här omgången. Hör av dig om något ändras.')
    + '</p>'
    + (CARD.onskemal ? '<div class="echo"><b>Ditt önskemål</b>' + esc(CARD.onskemal) + '</div>' : '')
    + '<button class="change" id="bChange">Ändra mitt svar</button>'
    + '</div>' + info() + foot();
  document.getElementById('bChange').onclick = () => renderFraga();
}

function hero(){
  return '<div class="hero">'
       + '<img class="bg" src="spel-host.jpg" alt="" width="1000" height="417">'
       + '<img class="logo" src="spel-logga.png" alt="Båstad Stegen">'
       + '</div>';
}

function info(){
  return '<div class="info"><h3>Så funkar det</h3>'
       + '<p>Svara nu \u2014 ja eller nej. P\u00e5 torsdag parar vi ihop matcherna, s\u00e5 du vet '
       + 'vem du m\u00f6ter. Tider och banor l\u00e4gger vi upp p\u00e5 fredag.</p>'
       + '<p>Hinner du spela ikapp matcher i veckan? Allt som blir klart f\u00f6re l\u00f6rdag '
       + 'hj\u00e4lper oss att komma ig\u00e5ng i tid.</p></div>';
}

function foot(){
  return '<div class="foot">Båstad Stegen · Frågor? Joaquim Nicander<br>'
       + '<a href="tel:0720787845">0720-787845</a> · '
       + '<a href="mailto:joaquim@cxdesign.se">joaquim@cxdesign.se</a></div>';
}

async function svara(v){
  const err = document.getElementById('err');
  document.getElementById('bJa').disabled = true;
  document.getElementById('bNej').disabled = true;
  if(err) err.textContent = '';
  try {
    const w = document.getElementById('wish');
    CARD = await BTS.pollSvara(TOKEN, v, w ? w.value : '');
    renderSvarat();
  } catch(e) {
    if(err) err.textContent = (e && e.message) ? e.message : 'Kunde inte spara – försök igen.';
    document.getElementById('bJa').disabled = false;
    document.getElementById('bNej').disabled = false;
  }
}

(async function(){
  if(!TOKEN){ app.innerHTML = '<div class="state">Länken saknar kod. Använd länken du fick i SMS eller mejl.</div>'; return; }
  try {
    CARD = await BTS.pollCard(TOKEN);
    if(!CARD){ app.innerHTML = '<div class="state">Länken gäller inte längre.</div>'; return; }
    CARD.svar ? renderSvarat() : renderFraga();
  } catch(e) {
    app.innerHTML = '<div class="state">Kunde inte hämta frågan just nu. Ladda om sidan.</div>';
  }
})();
</script>
</body>
</html>
