<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BTS Stegen — Min sida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D2E20;--surface:#0D2A1D;--card:#0D2A1D;--card2:#133124;
  --border:#1C3A2B;--border2:#2A5A42;
  --green:#FF8C42;--yellow:#F5EDE3;--clay:#FF8C42;
  --white:#F5EDE3;--muted:rgba(240,245,240,0.5);--muted2:rgba(240,245,240,0.3);
  --red:#EF5350;--blue:#FF8C42;
}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:16px}

/* ── LOGIN ── */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at top,#0D2A1D 0%,var(--bg) 70%)}
.login-box{background:var(--surface);border:1px solid var(--border2);padding:36px 28px;width:100%;max-width:380px;text-align:center}
.login-logo-wrap{margin-bottom:24px}
.login-logo-wrap svg{width:200px;height:auto;display:block;margin:0 auto}
.login-title{font-family:'Anton',sans-serif;font-size:30px;letter-spacing:3px;margin-bottom:4px}
.login-sub{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--muted2);text-transform:uppercase;margin-bottom:28px}
.login-label{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;text-align:left;margin-bottom:6px;display:block}
.login-select,.login-input{
  width:100%;padding:14px 16px;background:var(--card);border:1px solid var(--border2);
  color:var(--white);font-family:'Outfit',sans-serif;font-size:16px;outline:none;
  margin-bottom:14px;transition:border-color 0.2s;appearance:none;border-radius:0;
}
.login-select:focus,.login-input:focus{border-color:var(--green)}
.login-btn{
  width:100%;padding:16px;background:var(--green);color:#000;
  font-family:'Outfit',sans-serif;font-size:16px;font-weight:700;
  border:none;cursor:pointer;letter-spacing:1px;transition:background 0.2s;
  border-radius:0;min-height:52px;
}
.login-btn:active{background:#F5EDE3}
.login-error{color:var(--red);font-size:13px;margin-top:10px;font-family:'Outfit',sans-serif}
.login-hint{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted2);letter-spacing:1px;margin-top:20px;line-height:1.7;border-top:1px solid var(--border);padding-top:16px}
.link-back{display:block;margin-top:16px;color:var(--muted2);font-family:'Outfit',sans-serif;font-size:14px;text-decoration:none;padding:8px}
.link-back:hover{color:var(--white)}

/* ── HEADER ── */
header{background:linear-gradient(180deg,#0D2E20,var(--surface));border-bottom:1px solid var(--border);padding:0 16px;position:sticky;top:0;z-index:50}
.header-inner{max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px}
.header-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.header-logo-img{width:34px;height:34px;object-fit:contain}
.header-logo-img svg,.header-logo-img img{width:100%;height:100%}
.header-info{}
.header-title{font-family:'Anton',sans-serif;font-size:18px;letter-spacing:2px;color:var(--white);line-height:1}
.header-player-name{font-family:'Space Mono',monospace;font-size:10px;color:var(--green);letter-spacing:1px;margin-top:1px}
.header-actions{display:flex;align-items:center;gap:6px}
.btn-sm{background:none;border:1px solid var(--border2);color:var(--muted);font-family:'Outfit',sans-serif;font-size:13px;padding:8px 14px;cursor:pointer;text-decoration:none;transition:all 0.2s;min-height:38px;display:flex;align-items:center}
.btn-sm:active{border-color:var(--muted);color:var(--white)}

/* ── SEASON BAR ── */
.season-bar{background:rgba(0,0,0,0.2);border-bottom:1px solid var(--border);padding:0 16px;overflow-x:auto}
.season-bar-inner{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:6px;height:40px}
.season-chip{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:6px 14px;border:1px solid var(--border);color:var(--muted2);cursor:pointer;transition:all 0.2s;white-space:nowrap;background:none;min-height:32px}
.season-chip.active{border-color:var(--green);color:var(--green);background:rgba(245,237,227,0.08)}
.season-readonly-badge{font-family:'Space Mono',monospace;font-size:10px;color:var(--clay);letter-spacing:1px;background:rgba(193,125,75,0.1);border:1px solid rgba(193,125,75,0.25);padding:3px 10px;white-space:nowrap}

/* ── MAIN ── */
.main{max-width:600px;margin:0 auto;padding:20px 16px 100px}

/* ── SECTION ── */
.section{margin-bottom:28px;opacity:0;animation:fadeUp 0.35s ease forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.section:nth-child(1){animation-delay:0s}
.section:nth-child(2){animation-delay:0.08s}
.section:nth-child(3){animation-delay:0.14s}
.section-label{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--green);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}

/* ── NOTIFICATION ── */
.notif-banner{background:rgba(255,140,66,0.08);border:1px solid rgba(255,140,66,0.25);padding:14px 16px;display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.notif-icon{font-size:22px;flex-shrink:0;margin-top:2px}
.notif-text{font-size:15px;line-height:1.5}
.notif-text strong{color:var(--white)}
.notif-text small{display:block;font-family:'Space Mono',monospace;font-size:10px;color:var(--muted2);margin-top:3px;letter-spacing:1px}

/* ── MATCH CARD ── */
.match-card{background:var(--card);border:1px solid var(--border2);padding:20px 16px}
.match-card-round{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--muted2);text-transform:uppercase;margin-bottom:14px}
.match-versus{display:flex;align-items:center;gap:8px;margin-bottom:24px;background:var(--card2);border:1px solid var(--border);padding:14px}
.match-versus-player{flex:1}
.match-versus-name{font-weight:700;font-size:17px;color:var(--white);line-height:1.2}
.match-versus-rank{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted2);margin-top:4px}
.match-versus-sep{font-family:'Anton',sans-serif;font-size:22px;color:var(--muted2);letter-spacing:2px;flex-shrink:0;padding:0 4px}
.match-vs-right{text-align:right}

/* ── WO OPTION (prominent) ── */
.wo-option-row{display:flex;gap:10px;margin-bottom:20px}
.wo-big-btn{
  flex:1;padding:14px;background:none;border:2px solid var(--border2);
  color:var(--muted);font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;
  cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;
  gap:8px;min-height:52px;
}
.wo-big-btn:active,.wo-big-btn.active{border-color:var(--clay);color:var(--white);background:rgba(193,125,75,0.12)}
.score-big-btn{
  flex:2;padding:14px;background:none;border:2px solid var(--border2);
  color:var(--muted);font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;
  cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;
  gap:8px;min-height:52px;
}
.score-big-btn.active{border-color:var(--green);color:var(--white);background:rgba(245,237,227,0.08)}

/* ── SET INPUTS ── */
.set-input-section{margin-bottom:16px}
.set-divider{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.set-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.set-input-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.set-lbl{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted2);letter-spacing:1px;text-transform:uppercase;width:36px;flex-shrink:0;font-weight:700}
.set-box{display:flex;align-items:center;flex:1;border:1px solid var(--border2);background:var(--card2);overflow:hidden}
.set-num{
  flex:1;height:52px;background:transparent;border:none;
  color:var(--white);font-family:'Anton',sans-serif;font-size:28px;
  text-align:center;outline:none;-moz-appearance:textfield;
  transition:background 0.15s;
}
.set-num::-webkit-inner-spin-button,.set-num::-webkit-outer-spin-button{-webkit-appearance:none}
.set-num:focus{background:rgba(245,237,227,0.08)}
.set-dash{font-family:'Anton',sans-serif;font-size:22px;color:var(--muted2);padding:0 4px;flex-shrink:0;background:var(--border);width:32px;height:52px;display:flex;align-items:center;justify-content:center}
.stb-row{opacity:0;max-height:0;overflow:hidden;transition:all 0.35s ease;margin-bottom:0}
.stb-row.visible{opacity:1;max-height:80px;margin-bottom:10px}
.stb-row .set-lbl{color:var(--clay)}
.stb-row .set-box{border-color:rgba(193,125,75,0.4)}
.stb-announce{
  background:rgba(193,125,75,0.1);border:1px solid rgba(193,125,75,0.3);
  color:var(--clay);font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;
  padding:10px 14px;margin-bottom:12px;text-align:center;
  opacity:0;max-height:0;overflow:hidden;transition:all 0.3s ease;
}
.stb-announce.visible{opacity:1;max-height:50px}
.btn-add-stb{background:none;border:1px dashed var(--border2);color:var(--muted2);font-family:'Outfit',sans-serif;font-size:13px;padding:10px 16px;cursor:pointer;transition:all 0.2s;margin-bottom:12px;display:block;width:100%;text-align:center;min-height:42px}
.btn-add-stb:active{border-color:var(--green);color:var(--green)}

/* ── WO WINNER SELECT ── */
.wo-section{padding:16px;background:rgba(193,125,75,0.06);border:1px solid rgba(193,125,75,0.25);margin-bottom:16px}
.wo-section-title{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--clay);text-transform:uppercase;margin-bottom:12px}
.wo-winner-btns{display:flex;flex-direction:column;gap:8px}
.wo-winner-btn{
  width:100%;padding:14px 16px;background:var(--card2);border:2px solid var(--border);
  color:var(--muted);font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;
  cursor:pointer;transition:all 0.2s;text-align:left;min-height:52px;
}
.wo-winner-btn.selected{border-color:var(--clay);color:var(--white);background:rgba(193,125,75,0.1)}
.alt-chip{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);background:transparent;border:1px solid rgba(193,125,75,0.22);border-radius:9px;padding:9px 14px;cursor:pointer}
.alt-chip.active{color:var(--white);border-color:var(--clay);background:rgba(193,125,75,0.12)}

/* ── AUTO WINNER DISPLAY ── */
.auto-win-display{
  padding:14px 16px;font-size:16px;font-weight:600;margin-bottom:14px;
  transition:all 0.25s ease;border:2px solid transparent;
}
.auto-win-display.empty{background:var(--card2);border-color:var(--border);color:var(--muted2);font-weight:400;font-size:14px}
.auto-win-display.detected{background:rgba(245,237,227,0.1);border-color:rgba(245,237,227,0.4);color:var(--green)}

/* ── SUBMIT BUTTON ── */
.submit-btn{
  width:100%;padding:18px;background:var(--green);color:#000;
  font-family:'Anton',sans-serif;font-size:22px;letter-spacing:2px;
  border:none;cursor:pointer;transition:all 0.2s;min-height:58px;
  position:relative;overflow:hidden;
}
.submit-btn:active{background:#F5EDE3;transform:scale(0.99)}
.submit-btn:disabled{background:var(--card2);color:var(--muted2);cursor:not-allowed;transform:none}

/* ── RIPPLE ── */
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,0.3);transform:scale(0);animation:ripple 0.5s linear;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}

/* ── CONFIRM ── */
.confirm-card{background:var(--card);border:1px solid var(--border2);padding:20px 16px;animation:fadeUp 0.3s ease}
.confirm-title{font-family:'Anton',sans-serif;font-size:22px;letter-spacing:2px;margin-bottom:4px}
.confirm-sub{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.confirm-score{font-family:'Space Mono',monospace;font-size:15px;color:var(--green);font-weight:700;letter-spacing:1px;margin-bottom:4px}
.confirm-btns{display:flex;gap:8px;margin-top:16px}
.btn-confirm{flex:1;padding:16px;background:var(--green);color:#000;font-family:'Outfit',sans-serif;font-weight:700;font-size:16px;border:none;cursor:pointer;min-height:52px}
.btn-dispute{flex:1;padding:16px;background:none;color:var(--red);font-family:'Outfit',sans-serif;font-weight:600;font-size:15px;border:2px solid var(--red);cursor:pointer;min-height:52px}

/* ── SUCCESS ── */
.success-box{background:rgba(245,237,227,0.07);border:1px solid rgba(245,237,227,0.25);padding:28px 20px;text-align:center;animation:successPop 0.4s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes successPop{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
.success-icon{font-size:48px;margin-bottom:12px;display:block}
.success-title{font-family:'Anton',sans-serif;font-size:28px;letter-spacing:2px;color:var(--green);margin-bottom:6px}
.success-sub{font-size:15px;color:var(--muted);line-height:1.6}
.success-score{font-family:'Space Mono',monospace;font-size:14px;color:var(--white);font-weight:700;margin-top:12px;letter-spacing:1px;padding:8px;background:var(--card2);display:inline-block}
.status-tag{display:inline-block;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:100px;margin-top:12px}
.status-tag.pending{background:rgba(245,237,227,0.1);border:1px solid rgba(245,237,227,0.3);color:var(--yellow)}
.status-tag.confirmed{background:rgba(245,237,227,0.1);border:1px solid rgba(245,237,227,0.3);color:var(--green)}

/* ── PROFILE FORM ── */
.profile-form{background:var(--card);border:1px solid var(--border);padding:20px 16px}
.form-row{margin-bottom:14px}
.form-label{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;display:block}
.form-input,.form-select{
  width:100%;padding:13px 14px;background:var(--card2);border:1px solid var(--border2);
  color:var(--white);font-family:'Outfit',sans-serif;font-size:16px;outline:none;
  transition:border-color 0.2s;border-radius:0;-webkit-appearance:none;
}
.form-input:focus,.form-select:focus{border-color:var(--green)}
.form-textarea{
  width:100%;padding:13px 14px;background:var(--card2);border:1px solid var(--border2);
  color:var(--white);font-family:'Outfit',sans-serif;font-size:16px;outline:none;
  resize:none;min-height:80px;line-height:1.5;transition:border-color 0.2s;border-radius:0;
}
.form-textarea:focus{border-color:var(--green)}
.save-btn{
  background:var(--green);color:#000;border:none;font-family:'Outfit',sans-serif;
  font-size:15px;font-weight:700;padding:14px 24px;cursor:pointer;
  letter-spacing:0.5px;transition:all 0.2s;margin-top:6px;min-height:48px;
}
.save-btn:active{background:#F5EDE3}
.pin-row{display:flex;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);align-items:flex-end}

.hidden{display:none!important}

/* ── CONFETTI ── */
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
.confetti-piece{position:absolute;width:10px;height:10px;border-radius:2px;opacity:0;animation:confettiFall 1.2s ease-in forwards}
@keyframes confettiFall{0%{opacity:1;transform:translateY(-10px) rotate(0deg)}100%{opacity:0;transform:translateY(100vh) rotate(720deg)}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <div class="login-logo-wrap">
      <div class="bts-lockup" style="width:100%;max-width:240px;margin:0 auto">
        <svg viewBox="0 -150 470 400" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;overflow:visible;display:block">
          <g class="bl-trail"></g>
          <g class="bl-ball"><circle r="13" fill="#D7F23C"/>
            <path d="M-10 -9 C -3 -3,-3 3,-10 9" fill="none" stroke="#0D2E20" stroke-width="2" stroke-linecap="round"/>
            <path d="M10 -9 C 3 -3,3 3,10 9" fill="none" stroke="#0D2E20" stroke-width="2" stroke-linecap="round"/></g>
          <g class="bl-words">
            <text x="4" y="100" font-family="'Anton',sans-serif" font-size="96" fill="#FF8C42">BÅSTAD</text>
            <text x="4" y="176" font-family="'Anton',sans-serif" font-size="96" fill="#ffffff">STEGEN</text>
          </g>
        </svg>
      </div>
    </div>
    <div class="login-sub">Min sida</div>
    <label class="login-label" for="login-name">Ditt namn</label>
    <select class="login-select" id="login-name">
      <option value="">Välj ditt namn...</option>
    </select>
    <label class="login-label" for="login-pin">PIN-kod</label>
    <input type="password" class="login-input" id="login-pin" placeholder="4 siffror" maxlength="4" inputmode="numeric" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Logga in</button>
    <div class="login-error hidden" id="login-error">Fel PIN. Prova de 4 sista siffrorna i ditt telefonnummer.</div>
    <div class="login-hint">Standard-PIN = 4 sista siffrorna i ditt telefonnr<br>Du kan byta PIN efter inloggning</div>
    <a href="stegen.html" class="link-back">← Tillbaka till stegen</a>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
<header>
  <div class="header-inner">
    <a class="header-logo" href="stegen.html">
      <div class="header-logo-img">
        <img src="bts-crest.png" alt="Båstad TS" style="height:38px;width:auto;object-fit:contain" onerror="this.outerHTML='<span style=font-size:24px>🎾</span>'">
      </div>
      <div class="header-info">
        <div class="header-title">BTS Stegen</div>
        <div class="header-player-name" id="header-name"></div>
      </div>
    </a>
    <div class="header-actions">
      <a href="stegen.html" class="btn-sm">Stegen</a>
      <button class="btn-sm" onclick="logout()">Logga ut</button>
    </div>
  </div>
</header>

<div class="season-bar">
  <div class="season-bar-inner" id="season-bar"></div>
</div>

<div class="main" id="app-main"></div>
</div>

<!-- CONFETTI CONTAINER -->
<div class="confetti-wrap hidden" id="confetti-wrap"></div>

// Läser allt som behövs från Supabase och bygger om DBC. Anropas vid
// start, efter varje rapport/bekräftelse, och med jämna mellanrum (live).
async function refreshDBC(){
  if(!window.BTS||!BTS.ready())return false;
  const comp=currentSeason||'VT2026';
  const [allPlayers,ladderRows,matchRows]=await Promise.all([
    BTS.getPlayers(),BTS.getLadder(comp),BTS.getMatches(comp)
  ]);
  if(!allPlayers.length||!ladderRows.length)return false;
  const nameById={}; allPlayers.forEach(p=>nameById[p.id]=p.name);
  const posByPid={}; ladderRows.forEach(l=>posByPid[l.player_id]=l.position);
  // players i samma form som fallback ({id,name,rank,phone})
  const players=allPlayers.map(p=>({id:p.id,name:p.name,phone:p.phone||'',rank:posByPid[p.id]||999}))
    .sort((a,b)=>a.rank-b.rank);
  const ladderIds=ladderRows.slice().sort((a,b)=>a.position-b.position).map(l=>l.player_id);
  const currentRound=matchRows.length?Math.max(...matchRows.map(m=>m.round)):1;
  // pending-struktur {round:{key:{...}}} ur matcherna (rapporterade/bekräftade/bestridda)
  const pending={};
  matchRows.forEach(m=>{
    if(!['reported','confirmed','disputed'].includes(m.status))return;
    const key=`${m.pos_a}v${m.pos_b}`;
    (pending[m.round]=pending[m.round]||{})[key]={
      _id:m.id, posA:m.pos_a, posB:m.pos_b,
      winner:m.winner_id===m.player_a_id?m.pos_a:m.pos_b,
      winnerName:nameById[m.winner_id]||'',
      sets:m.sets||[], wo:!!m.wo, score:m.score||'',
      reporter:nameById[m.reporter_id]||'',
      status:m.status,
    };
  });
  DBC={players,ladderIds,currentRound,matches:matchRows,pending,nameById,allPlayers};
  return true;
}
// Hitta databas-matchens id för en viss omgång+key
function matchIdForKey(round,key){ return DBC?.pending?.[round]?.[key]?._id || null; }
// Hitta omgångens DB-match där jag är spelare (robust paring)
function dbMatchForMe(round){
  if(!DBC)return null;
  return DBC.matches.find(m=>m.round===round&&(m.player_a_id===me.id||m.player_b_id===me.id))||null;
}
function getProfile(name){try{return JSON.parse(localStorage.getItem('bts_profile_'+name)||'{}')}catch(e){return {}}}
function saveProfileData(name,d){localStorage.setItem('bts_profile_'+name,JSON.stringify(d))}
// Min delade profil från databasen (om inloggad), annars localStorage-fallback.
function dbProfileForMe(){
  const local=me?getProfile(me.name):{};
  const row=(DBC&&me&&DBC.allPlayers)?DBC.allPlayers.find(p=>p.id===me.id):null;
  if(!row)return local;
  return {
    born:row.born||local.born||'',
    hand:row.hand||local.hand||'',
    hometown:row.hometown||local.hometown||'',
    favShot:row.fav_shot||local.favShot||'',
    favSurface:row.fav_surface||local.favSurface||'',
    since:row.since_year||local.since||'',
    bio:row.bio||local.bio||'',
    email:local.email||'',
  };
}

async function doLogin(){
  const name=document.getElementById('login-name').value;

// ── MY MATCH ──────────────────────────────────────────────────
function getMyMatch(){
  // Föredra databasens omgångsmatch (rätt paring), annars härled ur stegen
  const round=getCurrentRound();
  const dbm=dbMatchForMe(round);
  if(dbm){
    const oppId=dbm.player_a_id===me.id?dbm.player_b_id:dbm.player_a_id;
    const opp=getPlayers().find(p=>p.id===oppId);
    const myPos=dbm.player_a_id===me.id?dbm.pos_a:dbm.pos_b;
    return{posA:dbm.pos_a,posB:dbm.pos_b,key:`${dbm.pos_a}v${dbm.pos_b}`,opp,myPos};
  }
  const ladder=getLadder();
  const myRank=ladder.indexOf(me.id)+1;
  if(myRank<=0)return null;
  const posA=myRank%2===1?myRank:myRank-1;
  const posB=posA+1;
  if(posB>ladder.length)return null;
  const oppId=ladder[posA===myRank?posB-1:posA-1];
  const opp=getPlayers().find(p=>p.id===oppId);
  return{posA,posB,key:`${posA}v${posB}`,opp,myPos:myRank};
}
function getPendingForMe(){
  const pending=getPending();const round=getCurrentRound();const match=getMyMatch();if(!match)return null;
  const p=(pending[round]||{})[match.key];
  if(!p||p.reporter===me.name||p.status==='confirmed'||p.status==='disputed')return null;
  return{...p,key:match.key};
}
function myReportStatus(){
  const match=getMyMatch();if(!match)return null;
  return((getPending()[getCurrentRound()])||{})[match.key]||null;
}
function setsToStr(sets){return(sets||[]).map(s=>`${s.a}-${s.b}`).join(' ')}

function onSetInput(){
  const v=id=>parseInt(document.getElementById(id)?.value)||0;
  const s1a=v('r-s1a'),s1b=v('r-s1b'),s2a=v('r-s2a'),s2b=v('r-s2b');
  const s1A=s1a>s1b&&(s1a||s1b),s1B=s1b>s1a&&(s1a||s1b);
  const s2A=s2a>s2b&&(s2a||s2b),s2B=s2b>s2a&&(s2a||s2b);
  if((s1A&&s2B)||(s1B&&s2A)){
    if(!stbVisible){
      stbVisible=true;
      document.getElementById('stb-announce')?.classList.add('visible');
      document.getElementById('stb-row')?.classList.add('visible');
      document.getElementById('btn-stb')?.classList.add('hidden');
      setTimeout(()=>document.getElementById('r-stba')?.focus(),350);
    }
  }
  updateAutoWinner();
}
function updateAutoWinner(){
  if(reportMode==='wo')return;
  const match=getMyMatch();if(!match)return;
  const v=id=>parseInt(document.getElementById(id)?.value)||0;
  const filled=id=>document.getElementById(id)?.value!=='';
  const s1a=v('r-s1a'),s1b=v('r-s1b'),s2a=v('r-s2a'),s2b=v('r-s2b'),stba=v('r-stba'),stbb=v('r-stbb');
  // Räkna bara set där BÅDA fälten är ifyllda. a=vänster=jag, b=höger=motståndare
  let sMe=0,sOpp=0;
  if(filled('r-s1a')&&filled('r-s1b')){if(s1a>s1b)sMe++;else if(s1b>s1a)sOpp++;}
  if(filled('r-s2a')&&filled('r-s2b')){if(s2a>s2b)sMe++;else if(s2b>s2a)sOpp++;}
  if(filled('r-stba')&&filled('r-stbb')){if(stba>stbb)sMe++;else if(stbb>stba)sOpp++;}
  const disp=document.getElementById('auto-win-display');if(!disp)return;
  if(sMe>=2){disp.className='auto-win-display detected';disp.textContent='✓ Vinnare: '+me.name}
  else if(sOpp>=2){disp.className='auto-win-display detected';disp.textContent='✓ Vinnare: '+match.opp.name}
  else if(sMe||sOpp){disp.className='auto-win-display empty';disp.textContent=`${sMe}–${sOpp} i set…`}
  else{disp.className='auto-win-display empty';disp.textContent='Fyll i set-resultaten ovan'}
}

              ${match.opp.name} (motståndaren bröt — jag vinner)
            </button>
          </div>
          <input id="r-reason" class="form-input" placeholder="Anledning, t.ex. skada i vristen (frivilligt)" style="margin-top:12px;width:100%">
          <div style="font-family:'Space Mono',monospace;font-size:10px;color:var(--muted2);margin-top:10px;line-height:1.5">Fyll i de set som hann spelas ovan — de räknas i statistiken. Vinsten går till den som inte bröt.</div>
        </div>
      </div>

      <button class="submit-btn" id="submit-btn" onclick="submitResult(event)">Rapportera resultat →</button>
    </div>`;
  }

  // Profile section — läs den DELADE profilen från databasen (fallback: localStorage)
  const prof=dbProfileForMe();
  html+=`
  <div class="section">
    <div class="section-label">Min profil</div>
    <div class="profile-form">
      <div class="form-row"><label class="form-label">E-post (för notiser, hålls privat)</label><input class="form-input" id="p-email" type="email" value="${prof.email||''}" placeholder="namn@exempel.se"></div>
      <div class="form-row"><label class="form-label">Profilbild (syns för alla på stegen)</label><input class="form-input" id="p-photo" type="file" accept="image/*" onchange="uploadPhoto(this)"><div id="p-photo-status" class="form-label" style="margin-top:4px"></div></div>
      <div class="form-row"><label class="form-label">Född (åå-mm-dd)</label><input class="form-input" id="p-born" type="date" value="${prof.born||''}"></div>
      <div class="form-row"><label class="form-label">Spelhand</label>
        <select class="form-select" id="p-hand">
          <option value="">Välj...</option>
          <option value="Höger" ${prof.hand==='Höger'?'selected':''}>Höger</option>
          <option value="Vänster" ${prof.hand==='Vänster'?'selected':''}>Vänster</option>
        </select>
      </div>
      <div class="form-row"><label class="form-label">Hemort</label><input class="form-input" id="p-hometown" type="text" value="${prof.hometown||''}" placeholder="Båstad"></div>
      <div class="form-row"><label class="form-label">Favoritslag</label><input class="form-input" id="p-favshot" type="text" value="${prof.favShot||''}" placeholder="Serve, BH, FH..."></div>
      <div class="form-row"><label class="form-label">Favoritunderlag</label>
        <select class="form-select" id="p-surface">
          <option value="">Välj...</option>
          <option value="Grus" ${prof.favSurface==='Grus'?'selected':''}>Grus</option>
          <option value="Hard" ${prof.favSurface==='Hard'?'selected':''}>Hard</option>
          <option value="Gräs" ${prof.favSurface==='Gräs'?'selected':''}>Gräs</option>
          <option value="Inomhus" ${prof.favSurface==='Inomhus'?'selected':''}>Inomhus</option>
        </select>
      </div>
      <div class="form-row"><label class="form-label">På stegen sedan</label><input class="form-input" id="p-since" type="text" value="${prof.since||''}" placeholder="2020"></div>
      <div class="form-row"><label class="form-label">Om mig</label><textarea class="form-textarea" id="p-bio" placeholder="Berätta något kul om dig själv...">${prof.bio||''}</textarea></div>
      <button class="save-btn" onclick="saveMyProfile(this)">Spara profil →</button>
      <div class="pin-row">
        <div style="flex:1"><label class="form-label" style="margin-bottom:6px">Byt PIN-kod</label><input class="form-input" id="p-newpin" type="password" maxlength="4" inputmode="numeric" placeholder="Ny 4-siffrig PIN"></div>
        <button class="save-btn" onclick="savePin()">Byt</button>
      </div>
    </div>
  </div>`;

  main.innerHTML=html;

  // Förifyll mejl från databasen (PIN-skyddat, hålls privat) — så sparad mejl syns
  if(DBC && me && me._pin && window.BTS){
    BTS.getEmail(me.id, me._pin)
      .then(v=>{ const el=document.getElementById('p-email'); if(el && v && !el.value) el.value=v; })
      .catch(e=>console.warn('Kunde inte läsa mejl:',e));
  }
}

// ── SUBMIT ────────────────────────────────────────────────────
function submitResult(e){
  // Ripple effect
  const btn=document.getElementById('submit-btn');
  if(btn&&e){
    const r=document.createElement('span');r.className='ripple';
    const rect=btn.getBoundingClientRect();
    r.style.width=r.style.height=Math.max(rect.width,rect.height)+'px';
    r.style.left=(e.clientX-rect.left-r.offsetWidth/2)+'px';
    r.style.top=(e.clientY-rect.top-r.offsetHeight/2)+'px';
    btn.appendChild(r);setTimeout(()=>r.remove(),600);
  }

  const match=getMyMatch();if(!match)return;
  const round=getCurrentRound();
  const meIsA=match.posA===match.myPos;
  let winnerName,sets=[],isWO=reportMode==='wo',isRet=reportMode==='retired',retiredById=null,note=null;

  if(isWO){
    if(!woWinner){alert('Välj vem som vann via WO!');return;}
    winnerName=woWinner;
  } else {
    const v=id=>parseInt(document.getElementById(id)?.value)||0;
    const s1a=v('r-s1a'),s1b=v('r-s1b'),s2a=v('r-s2a'),s2b=v('r-s2b'),stba=v('r-stba'),stbb=v('r-stbb');
    // Formuläret: a = vänster = jag, b = höger = motståndare
    if(s1a||s1b)sets.push({a:s1a,b:s1b});
    if(s2a||s2b)sets.push({a:s2a,b:s2b});
    if((stba||stbb)&&stbVisible)sets.push({a:stba,b:stbb,super:true});
    if(isRet){
      if(!retiredByName){alert('Välj vem som bröt matchen!');return;}
      // Vinst går till den som INTE bröt — oavsett ställning
      winnerName=retiredByName===me.name?match.opp.name:me.name;
      retiredById=retiredByName===me.name?me.id:match.opp.id;
      note=(document.getElementById('r-reason')?.value||'').trim()||null;
    } else {
      if(!sets.length){alert('Ange minst ett set!');return;}
      let sMe=0,sOpp=0;
      sets.forEach(s=>{if(s.a>s.b)sMe++;else if(s.b>s.a)sOpp++;});
      if(sMe>=2)winnerName=me.name;
      else if(sOpp>=2)winnerName=match.opp.name;
      else{alert('Vinnare ej fastställd. Kontrollera set-resultaten.');return;}
    }
    // Normalisera sets för lagring: posA:s poäng = a, posB:s poäng = b
    if(!meIsA)sets=sets.map(s=>({a:s.b,b:s.a,super:s.super}));
  }

  const winnerId=winnerName===me.name?me.id:match.opp.id;
  const winnerPos=winnerName===me.name?match.myPos:(meIsA?match.posB:match.posA);
  const score=isWO?'WO':isRet?((setsToStr(sets)?setsToStr(sets)+' ':'')+'RET'):setsToStr(sets);
  // Visa bekräftelse-rutan innan något skickas
  pendingSubmit={match,round,meIsA,winnerName,winnerId,winnerPos,sets,isWO,isRet,retiredById,note,score};
  showConfirmModal();
}

// ── BEKRÄFTELSE-RUTA (stämmer det här?) ───────────────────────
function showConfirmModal(){
  const ps=pendingSubmit; if(!ps)return;
  closeConfirmModal();
  const typeLabel=ps.isWO?'WALKOVER':ps.isRet?'AVBRUTEN – SKADA':'FÄRDIGSPELAD';
  const typeColor=ps.isWO?'var(--clay)':ps.isRet?'var(--yellow)':'#FF8C42';
  const scoreDisp=ps.isWO?'WO':(setsToStr(ps.sets)||'—');
  const breaker=ps.retiredById===me.id?me.name:ps.match.opp.name;
  const extra=ps.isRet?`<div style="font-size:13px;color:var(--muted);margin-top:8px">${breaker} bröt${ps.note?(' · '+ps.note):''}</div>`:'';
  const ov=document.createElement('div');
  ov.id='confirm-overlay';
  ov.style.cssText='position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.62);display:flex;align-items:center;justify-content:center;padding:20px';
  ov.onclick=e=>{ if(e.target===ov) closeConfirmModal(); };
  ov.innerHTML=`<div style="width:340px;max-width:100%;background:#0D2A1D;border:1px solid rgba(193,125,75,0.35);border-radius:18px;overflow:hidden;color:var(--white)">
    <div style="background:var(--card);padding:16px;text-align:center;border-bottom:1px solid rgba(193,125,75,0.15)">
      <div style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--clay)">Innan du skickar</div>
      <div style="font-size:19px;font-weight:700;margin-top:4px">Stämmer det här?</div>
    </div>
    <div style="padding:20px">
      <div style="text-align:center;margin-bottom:14px"><span style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;color:${typeColor};border:1px solid ${typeColor};padding:4px 10px;border-radius:6px">${typeLabel}</span></div>
      <div style="background:#0D2E20;border:1px solid rgba(245,237,227,0.35);border-radius:13px;padding:18px;text-align:center;margin-bottom:16px">
        <div style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--muted2);text-transform:uppercase;margin-bottom:6px">Vinnare</div>
        <div style="font-size:21px;font-weight:700;color:#FF8C42">${ps.winnerName}</div>
        <div style="font-family:'Space Mono',monospace;font-size:16px;letter-spacing:1px;margin-top:8px">${scoreDisp}</div>
        ${extra}
      </div>
      <div style="font-family:'Space Mono',monospace;font-size:10px;color:var(--muted2);text-align:center;margin-bottom:16px">${ps.match.opp.name} får bekräfta efteråt</div>
      <button class="submit-btn" style="width:100%;justify-content:center;margin-bottom:9px" onclick="confirmSubmit()">Ja, skicka in →</button>
      <button class="btn-sm" style="width:100%;padding:13px;justify-content:center;font-size:14px" onclick="closeConfirmModal()">Nej, ändra</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
}
function closeConfirmModal(){ const o=document.getElementById('confirm-overlay'); if(o)o.remove(); }

function confirmSubmit(){
  const ps=pendingSubmit; if(!ps)return;
  closeConfirmModal();
  // ── Skriv till databasen (om kopplad) ──
  if(DBC){
    const dbm=dbMatchForMe(ps.round);
    const btn=document.getElementById('submit-btn'); if(btn)btn.disabled=true;
    (async()=>{
      try{
        if(!dbm) throw new Error('Ingen match hittad för omgången');
        await BTS.reportResult(dbm.id,{playerId:me.id,pin:me._pin,winnerId:ps.winnerId,sets:ps.sets,wo:ps.isWO,score:ps.score,retiredBy:ps.retiredById,note:ps.note});
        await refreshDBC();
      }catch(err){ alert('Kunde inte spara mot databasen: '+(err?.message||err)); }
      if(btn)btn.disabled=false;
      pendingSubmit=null;
      renderApp();
    })();
    return;
  }
  // ── Fallback: localStorage ──
  const pending=getPending();
  if(!pending[ps.round])pending[ps.round]={};
  pending[ps.round][ps.match.key]={
    posA:ps.match.posA,posB:ps.match.posB,winner:ps.winnerPos,winnerName:ps.winnerName,
    sets:ps.sets,wo:ps.isWO,score:ps.score,retiredBy:ps.retiredById,note:ps.note,
    reporter:me.name,status:'pending',timestamp:Date.now()
  };
  savePending(pending);
  pendingSubmit=null;
  renderApp();
}

function confirmMatch(key,confirmed){
  const round=getCurrentRound();
  // ── Databas ──
  if(DBC){
    const id=matchIdForKey(round,key);
    if(!id){renderApp();return;}
    (async()=>{
      try{ await BTS.confirmMatch(id,{playerId:me.id,pin:me._pin,agree:confirmed}); await refreshDBC(); }
      catch(err){ alert('Kunde inte spara: '+(err?.message||err)); }
      if(confirmed)launchConfetti();
      renderApp();
    })();
    return;
  }
  // ── Fallback: localStorage ──
  const pending=getPending();
  if(pending[round]?.[key]){
    pending[round][key].status=confirmed?'confirmed':'disputed';
    pending[round][key].confirmedBy=me.name;
    pending[round][key].confirmedAt=Date.now();
  }
  savePending(pending);
  if(confirmed){
    const r=pending[round][key];
    const results=JSON.parse(localStorage.getItem(sk('bts_results'))||'{}');
    if(!results[round])results[round]={};results[round][key]=r;
    localStorage.setItem(sk('bts_results'),JSON.stringify(results));
    launchConfetti();
  }
  renderApp();
}

function undoReport(){
  const match=getMyMatch();if(!match)return;
  const round=getCurrentRound();
  if(DBC){
    const id=matchIdForKey(round,match.key);
    if(!id){renderApp();return;}
    (async()=>{
      try{ await BTS.unreportMatch(id,{playerId:me.id,pin:me._pin}); await refreshDBC(); }
      catch(err){ alert('Kunde inte ångra: '+(err?.message||err)); }
      renderApp();
    })();
    return;
  }
  const pending=getPending();
  if(pending[round])delete pending[round][match.key];
  savePending(pending);renderApp();
}

// ── CONFETTI ──────────────────────────────────────────────────
function launchConfetti(){
  const wrap=document.getElementById('confetti-wrap');
  wrap.classList.remove('hidden');wrap.innerHTML='';
  const colors=['#FF8C42','#F5EDE3','#FF8C42','#FF8C42','#F5EDE3'];
  for(let i=0;i<40;i++){
    const p=document.createElement('div');p.className='confetti-piece';
    p.style.cssText=`left:${Math.random()*100}%;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>0.5?'50%':'2px'};animation-delay:${Math.random()*0.5}s;animation-duration:${0.9+Math.random()*0.6}s`;
    wrap.appendChild(p);
  }
  setTimeout(()=>{wrap.classList.add('hidden');wrap.innerHTML=''},2000);
}

// ── PROFILE ───────────────────────────────────────────────────
async function saveMyProfile(btn){
  const email=document.getElementById('p-email')?.value||'';
  const data={
    born:document.getElementById('p-born')?.value||'',
    hand:document.getElementById('p-hand')?.value||'',
    hometown:document.getElementById('p-hometown')?.value||'',
    favShot:document.getElementById('p-favshot')?.value||'',
    favSurface:document.getElementById('p-surface')?.value||'',
    since:document.getElementById('p-since')?.value||'',
    bio:document.getElementById('p-bio')?.value||'',
  };
  // Behåll localStorage som offline-fallback
  saveProfileData(me.name,{email,...data});
  const orig=btn?btn.textContent:'';
  if(btn){btn.textContent='Sparar…';btn.disabled=true;}
  try{
    if(DBC && window.BTS){
      // Hela profilen sparas DELAT i databasen (PIN-skyddat) → syns för alla
      await BTS.setProfile(me.id, me._pin, data);
      // Mejlen sparas separat (privat) om angiven
      if(email.trim()) await BTS.setEmail(me.id, me._pin, email.trim());
      await refreshDBC().catch(()=>{});
    }
    if(btn){btn.textContent='Sparad! ✓';setTimeout(()=>{btn.textContent=orig;btn.disabled=false;},2000);}
  }catch(e){
    if(btn){btn.textContent=orig;btn.disabled=false;}
    alert('Kunde inte spara profilen: '+(e?.message||e));
  }
}
async function uploadPhoto(input){
  const f=input.files&&input.files[0]; if(!f||!me)return;
  if(!DBC){ alert('Profilbild kräver databasanslutning.'); return; }
  const st=document.getElementById('p-photo-status'); if(st)st.textContent='Laddar upp…';
  try{
    const url=await BTS.uploadAvatar(me.id,f);
    await BTS.setPhoto(me.id,me._pin,url);
    if(st)st.textContent='✓ Bild sparad — syns för alla på stegen.';
  }catch(e){ if(st)st.textContent='Fel: '+(e.message||e); }
}
function savePin(){
  const p=document.getElementById('p-newpin')?.value||'';
  if(p.length!==4||!/^\d{4}$/.test(p)){alert('PIN måste vara exakt 4 siffror');return;}
  if(DBC){
    (async()=>{
      try{
        const ok=await BTS.setPin(me.id,me._pin,p);
        if(ok){ me._pin=p; document.getElementById('p-newpin').value=''; alert('PIN ändrad! Kom ihåg den.'); }
        else alert('Kunde inte byta PIN.');
      }catch(err){ alert('Fel vid PIN-byte: '+(err?.message||err)); }
    })();
    return;
  }
  setPin(me.name,p);document.getElementById('p-newpin').value='';alert('PIN ändrad! Kom ihåg den.');
}

// ── INIT ─────────────────────────────────────────────────────
(async function initRapportera(){
  await refreshDBC().catch(e=>console.warn('DB ej tillgänglig, fallback:',e));
  setupLoginDropdown();
  // Live: hämta nya resultat en gång per minut och rita om om MIN match ändrats
  setInterval(async()=>{
    if(!DBC||!me)return;
    const before=JSON.stringify([getPendingForMe(),myReportStatus()]);
    await refreshDBC().catch(()=>{});
    if(JSON.stringify([getPendingForMe(),myReportStatus()])!==before) renderApp();
  },60000);
})();
</script>
<script>
/* Stegens logotyp-animation (identisk överallt): serve-båge ritas, bollen blir kvar, BÅSTAD STEGEN tonas in. */
(function(){
  document.querySelectorAll('.bts-lockup').forEach(function(box){
    var svg=box.querySelector('svg'), ball=box.querySelector('.bl-ball'),
        trail=box.querySelector('.bl-trail'), words=box.querySelector('.bl-words');
    if(!svg||!ball||!words) return;
    var ns='http://www.w3.org/2000/svg';
    var p=document.createElementNS(ns,'path'); p.setAttribute('d','M-26 26 Q 158 -245 312 26'); p.setAttribute('fill','none'); svg.appendChild(p);
    var L=p.getTotalLength(), N=14, dots=[];
    for(var i=1;i<=N;i++){ var pt=p.getPointAtLength((i/(N+1))*L); var c=document.createElementNS(ns,'circle');
      c.setAttribute('cx',pt.x); c.setAttribute('cy',pt.y); c.setAttribute('r',2.6); c.setAttribute('fill','rgba(255,255,255,.9)'); c.setAttribute('opacity','0'); trail.appendChild(c); dots.push({el:c,at:i/(N+1)}); }
    words.style.opacity=0; words.style.transition='opacity .55s ease';
    function setBall(x,y){ ball.setAttribute('transform','translate('+x+' '+y+')'); }
    var ease=function(t){return 1-Math.pow(1-t,3);};
    if(matchMedia('(prefers-reduced-motion:reduce)').matches){ var e=p.getPointAtLength(L); setBall(e.x,e.y); dots.forEach(function(d){d.el.setAttribute('opacity','.9');}); words.style.opacity=1; return; }
    var t0=null;
    function fr(ts){ if(!t0)t0=ts; var t=(ts-t0)/1000;
      if(t<1.2){ var a=ease(Math.min(t/1.2,1)); var pt=p.getPointAtLength(a*L); setBall(pt.x,pt.y); dots.forEach(function(d){ d.el.setAttribute('opacity', a>=d.at?'.9':'0'); }); if(t>0.55) words.style.opacity=1; requestAnimationFrame(fr); }
      else { var e=p.getPointAtLength(L); setBall(e.x,e.y); dots.forEach(function(d){d.el.setAttribute('opacity','.9');}); words.style.opacity=1; }
    }
    setBall(-22,22); requestAnimationFrame(fr);
  });
})();
</script>
