<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTS Sommarstege 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand.css">
<style>
  :root{
    --bg:#0D2E20; --surface:#0D2E20; --card:#0D2A1D; --card2:#0D2A1D;
    --border:#133124; --border2:#1C3A2B; --cream:#F5EDE3; --white:#fff;
    --muted:#9A8F86; --muted2:#9A8F86; --green:#FF8C42; --clay:#FF8C42;
    --yellow:#F5EDE3; --down:#EF5350; --sun:#F4B740;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Outfit',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--cream);min-height:100vh}
  .topbar{display:flex;justify-content:flex-end;padding:12px 18px}
  .topbar a{color:#fff;text-decoration:none;font-size:13px;border:1px solid rgba(255,255,255,.28);padding:7px 13px;border-radius:8px;background:rgba(0,0,0,.18)}
  .hero{position:relative;overflow:hidden;text-align:center;padding:30px 20px 32px;background:linear-gradient(165deg,#FF8C42 0%,#FF8C42 42%,#7A2400 70%,var(--bg) 100%)}
  .hero .sun{position:absolute;top:-34px;right:-20px;width:150px;height:150px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 36% 30%,#F5EDE3 0%,#F5EDE3 45%,#F5EDE3 74%,#F5EDE3 100%);box-shadow:0 0 42px 14px rgba(245,237,227,.42),inset -13px -15px 32px rgba(58,68,16,.5),inset 9px 9px 22px rgba(255,255,255,.42)}
  .hero .sun::before,.hero .sun::after{content:'';position:absolute;left:50%;width:150px;height:150px;border-radius:50%;border:11px solid #F5EDE3;box-sizing:border-box;transform:translateX(-50%)}
  .hero .sun::before{top:-80px}
  .hero .sun::after{bottom:-80px}
  .hero h1{font-family:'Anton',sans-serif;font-size:46px;letter-spacing:3px;margin:0;color:#fff;position:relative}
  .hero .tag{position:relative;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#5A1800;margin-top:8px}
  .wrap{max-width:680px;margin:0 auto;padding:20px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px}
  .tab{background:none;border:none;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:14px 16px;cursor:pointer;border-bottom:2px solid transparent}
  .tab.active{color:var(--cream);border-color:var(--clay)}
  @media(max-width:560px){ .tabs{gap:0} .tab{font-size:11px;padding:12px 8px;letter-spacing:.2px} }
  @media(max-width:360px){ .tab{font-size:10px;padding:11px 6px} }
  .ev{background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:16px;margin-bottom:12px}
  .ev-name{font-family:'Anton',sans-serif;font-size:22px;letter-spacing:1px;color:var(--sun)}
  .ev-meta{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);margin:2px 0 10px}
  .row{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--card2)}
  .rank{font-family:'Space Mono',monospace;color:var(--clay);width:26px;font-weight:700;text-align:center}
  .nm{flex:1;font-weight:500}
  .meta{color:var(--muted2);font-size:12px;font-family:'Space Mono',monospace}
  .vs{display:flex;align-items:center;gap:10px}
  .vs .side{flex:1}.vs .side.b{text-align:right}
  .vs .x{color:var(--muted2);font-family:'Space Mono',monospace;font-size:11px}
  .winner{color:var(--green);font-weight:700}
  .court{text-align:center;color:var(--sun);font-size:12px;font-family:'Space Mono',monospace;margin-bottom:8px}
  .btn{background:var(--clay);color:#061712;border:none;font-weight:700;padding:12px 16px;border-radius:8px;cursor:pointer;font-size:14px;width:100%;margin-top:6px}
  .btn.alt{background:var(--card2);color:var(--cream);border:1px solid var(--border2)}
  .btn.green{background:var(--green);color:#063}
  .btn.sm{width:auto;margin:0;padding:8px 12px;font-size:13px}
  .panel{background:var(--card);border:1px solid var(--border2);border-radius:10px;padding:18px;margin-bottom:16px}
  .label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  input,select{width:100%;padding:11px;border-radius:8px;border:1px solid var(--border2);background:var(--card2);color:var(--white);font-size:15px;margin-bottom:8px}
  .muted{color:var(--muted2);font-size:13px;line-height:1.6}
  .pill{font-size:10px;font-family:'Space Mono',monospace;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:100px;border:1px solid var(--border2);color:var(--muted)}
  .pill.drawn{color:var(--green);border-color:rgba(245,237,227,.4)}
  .hidden{display:none}
  .admin-toggle{font-size:11px;color:var(--muted2);text-align:center;margin-top:30px;cursor:pointer}
  .err{color:var(--down);font-size:13px;margin-top:4px}
  /* ── Summer Edition-poster (anmälan) ── */
  .sp-poster{position:relative;width:min(92vw,420px);margin:0 auto 22px;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:#F4861E;font-family:'Anton',sans-serif}
  .sp-poster .rays{position:absolute;inset:-20%;background:repeating-conic-gradient(from -8deg at 86% 11%, #FFC559 0deg 9deg, #F0791A 9deg 18deg);opacity:.96}
  .sp-poster .vig{position:absolute;inset:0;background:radial-gradient(120% 110% at 86% 11%, transparent 40%, rgba(120,40,0,.42) 100%)}
  .sp-poster .suns{position:absolute;left:92%;top:4%;width:132px;height:132px;transform:translate(-50%,-50%);border-radius:50%;box-shadow:0 0 60px 22px rgba(255,221,120,.7)}
  .sp-poster .suns svg{width:100%;height:100%;display:block;overflow:visible}
  .sp-poster .frame{position:absolute;inset:14px;border:1.5px solid rgba(255,247,226,.5);pointer-events:none}
  .sp-poster .court{position:absolute;inset:0;transform:perspective(780px) rotateX(42deg) rotateZ(-5deg);transform-origin:56% 82%}
  .sp-poster .court .pl{position:absolute;background:#F6EFE2}
  .sp-poster .court .base{left:-16%;right:-22%;top:68%;height:24px}
  .sp-poster .court .side{left:55%;top:48%;bottom:26%;width:24px}
  .sp-burst{position:absolute;left:50%;top:33%;transform:translate(-50%,-50%) rotate(-6deg);width:184px;height:184px;background:#0D2E20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;clip-path:polygon(50% 0%,61% 13%,79% 8%,79% 27%,96% 30%,86% 46%,100% 59%,83% 65%,87% 83%,69% 79%,60% 96%,50% 82%,40% 96%,31% 79%,13% 83%,17% 65%,0% 59%,14% 46%,4% 30%,21% 27%,21% 8%,39% 13%)}
  .sp-burst .s1{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#FFE07A}
  .sp-burst .s2{font-size:29px;line-height:.86;text-transform:uppercase;text-align:center;color:#fff}
  .sp-burst .s3{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;margin-top:3px;color:rgba(255,247,226,.7)}
  .sp-when{position:absolute;left:0;right:0;bottom:58px;text-align:center;z-index:5;padding:0 12px}
  .sp-when .d{display:inline-block;background:#0D2E20;color:#fff;font-size:21px;letter-spacing:1px;padding:7px 18px;border-radius:7px;text-transform:uppercase}
  .sp-when .t{display:block;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:2px;color:#2a1c0e;margin-top:7px;text-transform:uppercase;font-weight:700}
  .sp-logo{position:absolute;right:16px;bottom:14px;text-align:right;z-index:6}
  .sp-logo .line{display:block;line-height:.82;transform:skewX(-8deg);font-size:23px;text-transform:uppercase}
  /* ── Min profil ── */
  .pf-card{display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--card2);border:1px solid var(--border2);border-radius:14px;padding:22px 18px;margin-bottom:16px}
  .pf-avatar{width:104px;height:104px;border-radius:50%;background-size:cover;background-position:center;border:3px solid var(--clay);box-shadow:0 0 0 4px rgba(255,140,66,.12)}
  .pf-avatar.empty{display:flex;align-items:center;justify-content:center;border:2px dashed var(--border2);box-shadow:none;background:rgba(255,255,255,.03)}
  .pf-avatar.empty span{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
  .pf-name{font-family:'Anton',sans-serif;font-size:24px;letter-spacing:1px;color:var(--cream);margin-top:12px}
  .pf-hint{font-size:12px;color:var(--muted2);margin-top:8px}
  .form-row{margin-bottom:12px}
  .form-label{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  textarea{width:100%;padding:11px;border-radius:8px;border:1px solid var(--border2);background:var(--card2);color:var(--white);font-size:15px;margin-bottom:8px;font-family:inherit;min-height:84px;resize:vertical}
  .pin-row{display:flex;gap:10px;align-items:flex-end;margin-top:12px;border-top:1px solid var(--border);padding-top:14px}
  .sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
  .sp-pcard{background:var(--card2);border:1px solid var(--border2);border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer;transition:border-color .15s,transform .15s}
  .sp-pcard:hover{border-color:var(--clay);transform:translateY(-2px)}
  .sp-pavatar{width:62px;height:62px;border-radius:50%;background-size:cover;background-position:center;border:2px solid var(--clay);margin:0 auto}
  .sp-pavatar.empty{display:flex;align-items:center;justify-content:center;border:2px dashed var(--border2);background:rgba(255,255,255,.03)}
  .sp-pavatar.empty span{color:var(--muted);font-size:13px}
  .sp-pname{font-weight:600;font-size:13px;margin-top:8px;line-height:1.25}
  .sp-pmeta{font-size:11px;color:var(--muted2);font-family:'Space Mono',monospace;margin-top:3px;line-height:1.3}
  /* ── Spelarkort (modal) ── */
  #player-modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}
  #player-modal.hidden{display:none}
  .pm-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6)}
  .pm-card{position:relative;z-index:1;background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:26px 22px;max-width:380px;width:100%;max-height:88vh;overflow:auto}
  .pm-x{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;width:auto;margin:0;padding:4px 8px}
  .pm-stats{display:flex;justify-content:center;gap:26px;margin:14px 0 16px}
  .pm-stats .n{display:block;font-family:'Anton',sans-serif;font-size:26px;color:var(--sun);text-align:center;line-height:1}
  .pm-stats .l{display:block;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:3px}
  .pm-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}
  .pm-row .k{color:var(--muted);font-size:13px}
  .pm-row .v{color:var(--cream);font-size:13px;text-align:right}
  .pm-bio{margin-top:14px;color:var(--cream);font-size:14px;line-height:1.6;font-style:italic;border-left:2px solid var(--clay);padding-left:12px}
  .pm-contact{background:var(--card2);border:1px solid var(--border2);border-radius:10px;padding:10px 12px;margin-bottom:14px}
  .pm-contact .pm-row{border-bottom:none;padding:4px 0}
</style>
</head>
<body>
<div class="topbar"><a href="stegen.html">Ordinarie stege →</a></div>
<div class="hero">
  <div class="sun"></div>
  <h1>SOMMARSTEGE 2026</h1>
  <div class="tag">🎾 Spel på söndagar · Båstad TS</div>
</div>

<div class="wrap">
  <div class="tabs">
    <button class="tab active" data-tab="anmalan" onclick="showTab('anmalan',this)">Anmälan</button>
    <button class="tab" data-tab="matcher" onclick="showTab('matcher',this)">Matcher</button>
    <button class="tab" data-tab="stallning" onclick="showTab('stallning',this)">Ställning</button>
    <button class="tab" data-tab="spelare" onclick="showTab('spelare',this)">Spelare</button>
  </div>

  <div id="view-anmalan"></div>
  <div id="view-matcher" class="hidden"></div>
  <div id="view-stallning" class="hidden"></div>
  <div id="view-spelare" class="hidden"></div>
  <div id="player-modal" class="hidden"></div>

  <div class="admin-toggle" onclick="document.getElementById('admin-panel').classList.toggle('hidden')">⚙︎ Admin</div>
  <div id="admin-panel" class="panel hidden" style="margin-top:12px">
    <!-- Steg 1: logga in -->
    <div id="admin-login">
      <div class="label">Admin – logga in</div>
      <input type="password" id="admin-pw" placeholder="Adminlösenord" onkeydown="if(event.key==='Enter')adminLogin()">
      <button class="btn alt" style="margin-top:8px" onclick="adminLogin()">Logga in</button>
      <div id="admin-login-err" class="muted" style="margin-top:8px"></div>
    </div>

    <!-- Steg 2: adminverktyg (visas först efter inloggning) -->
    <div id="admin-body" class="hidden">
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:4px">
        <div class="label" style="margin:0">✓ Inloggad som admin</div>
        <button class="btn sm alt" onclick="adminLogout()">Logga ut</button>
      </div>

      <div class="label" style="margin-top:14px">Skapa speldag</div>
      <input type="text" id="ev-name" placeholder="Namn, t.ex. Sommaröppning">
      <input type="date" id="ev-date">
      <input type="text" id="ev-courts" placeholder="Banor (valfritt – sätts annars vid lottningen)">
      <input type="text" id="ev-time" placeholder="Starttid, t.ex. 17:00" value="17:00">
      <button class="btn alt" onclick="skapaSpeldag()">Skapa / uppdatera speldag</button>
      <div id="ev-msg" class="muted" style="margin-top:8px"></div>

      <div class="label" style="margin-top:20px">Speldagar</div>
      <div id="admin-events"></div>

      <div class="label" style="margin-top:20px">Lägg till spelare</div>
      <input type="text" id="np-name" placeholder="Namn">
      <input type="text" id="np-phone" placeholder="Telefon (PIN = 4 sista)">
      <input type="text" id="np-email" placeholder="E-post (valfritt)">
      <button class="btn alt" onclick="addPlayer()">Lägg till i sommarstegen</button>
      <div id="np-msg" class="muted" style="margin-top:8px"></div>

      <div class="label" style="margin-top:20px">Deltagare (ranking)</div>
      <div id="admin-players"></div>

      <div class="label" style="margin-top:20px">Väntande intresseanmälningar</div>
      <button class="btn alt" onclick="loadJoins()">Visa ansökningar</button>
      <div id="joins-list" style="margin-top:10px"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/bts-data.js"></script>
<script>
const COMP='ST2026';
const SMS_FN = "https://fueggdqtgmvldjbhcdfn.supabase.co/functions/v1/send-message";
const SMS_PUBKEY = "sb_publishable_vZCnLnp41c29DFN7MLpYsQ_AUBnxJPy";
let me=null, players=[], ladder=[], events=[], signupsAll=[], matches=[], tab='anmalan';

function nameById(id){ const p=players.find(x=>x.id===id); return p?p.name:'#'+id; }
function posById(id){ const l=ladder.find(x=>x.player_id===id); return l?l.position:'—'; }
function fmtDate(s){ return new Date(s+'T00:00:00').toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long'}); }
function signupsFor(d){ return signupsAll.filter(s=>s.play_date===d); }
function matchesFor(d){ return matches.filter(m=>m.play_date===d); }
function iAmSignedUp(d){ return me && signupsAll.some(s=>s.play_date===d && s.player_id===me.id); }

async function load(){
  if(!window.BTS||!BTS.ready()){ document.getElementById('view-anmalan').innerHTML='<div class="muted">Databasen ej konfigurerad.</div>'; return; }
  try{
    [players, ladder, events, signupsAll, matches] = await Promise.all([
      BTS.getPlayers(), BTS.getLadder(COMP), BTS.getEvents(COMP), BTS.getAllSignups(COMP), BTS.getMatches(COMP)
    ]);
  }catch(e){ console.warn(e); }
  render();
  // Första gången: landa direkt på Matcher om det finns en publicerad lottning
  if(firstLoad){
    firstLoad=false;
    if(location.hash==='#anmalan'){ const b=document.querySelector('.tab[data-tab="anmalan"]'); if(b) showTab('anmalan',b); }
    else {
      const wantMatcher = location.hash==='#matcher';
      const hasPublished = events.some(e=>e.status==='published') && matches.some(m=>m.play_date);
      if(wantMatcher || hasPublished){ const b=document.querySelector('.tab[data-tab="matcher"]'); if(b) showTab('matcher',b); }
    }
  }
}
let firstLoad=true;
function render(){ renderAnmalan(); renderMatcher(); renderStallning(); renderSpelare(); renderAdminEvents(); renderAdminPlayers(); }
let spEditId=null;
function renderAdminPlayers(){
  const box=document.getElementById('admin-players'); if(!box) return;
  if(!ladder.length){ box.innerHTML='<div class="muted">Inga deltagare i sommarstegen än.</div>'; return; }
  box.innerHTML=ladder.map((l,i)=>{
    const id=l.player_id, nm=l.player?l.player.name:nameById(id), ph=(l.player&&l.player.phone)||'';
    const ed=spEditId===id;
    return `<div class="row" style="flex-wrap:wrap;gap:6px;align-items:center">
      <div class="rank">${i+1}</div>
      ${ed?`<input id="sp-name-${id}" value="${nm}" style="flex:1;min-width:90px"><input id="sp-phone-${id}" value="${ph}" placeholder="telefon" style="width:108px">`:`<div class="nm">${nm}</div>`}
      <button class="btn sm alt" onclick="spMove(${id},-1)" title="Upp">▲</button>
      <button class="btn sm alt" onclick="spMove(${id},1)" title="Ner">▼</button>
      ${ed?`<button class="btn sm" onclick="spSave(${id})">Spara</button><button class="btn sm alt" onclick="spCancel()">✕</button>`:`<button class="btn sm alt" onclick="spEdit(${id})">Redigera</button><button class="btn sm alt" onclick="spRemove(${id})">Ta bort</button>`}
    </div>`;
  }).join('');
}
function spEdit(id){ spEditId=id; renderAdminPlayers(); }
function spCancel(){ spEditId=null; renderAdminPlayers(); }
async function spSave(id){
  const pw=document.getElementById('admin-pw').value;
  const name=document.getElementById('sp-name-'+id).value.trim(), phone=document.getElementById('sp-phone-'+id).value.trim();
  try{ await BTS.adminUpdatePlayer(pw,id,name,phone); spEditId=null; await load(); }
  catch(e){ alert('Fel: '+(e.message||e)); }
}
async function spMove(id,dir){
  const pw=document.getElementById('admin-pw').value;
  const ids=ladder.map(l=>l.player_id); const idx=ids.indexOf(id); if(idx<0)return;
  const ni=idx+dir; if(ni<0||ni>=ids.length)return;
  [ids[idx],ids[ni]]=[ids[ni],ids[idx]];
  try{ await BTS.adminSetPositions(pw,COMP,ids); await load(); }
  catch(e){ alert('Fel: '+(e.message||e)); }
}
async function spRemove(id){
  const pw=document.getElementById('admin-pw').value;
  if(!confirm('Ta bort deltagaren ur sommarstegen? Matchhistoriken behålls.')) return;
  try{ await BTS.adminRemoveFromLadder(pw,COMP,id); await load(); }
  catch(e){ alert('Fel: '+(e.message||e)); }
}

// ── ANMÄLAN ──
function posterHtml(ev, cta){
  if(!ev) return '';
  const d=fmtDate(ev.play_date);
  const t=ev.start_time?('kl '+ev.start_time):'';
  cta=cta||'Anmäl dig nu';
  return `<div class="sp-poster">
    <div class="rays"></div><div class="vig"></div>
    <div class="suns"><svg viewBox="0 0 100 100"><defs><radialGradient id="tbsun" cx="40%" cy="36%" r="72%"><stop offset="0" stop-color="#FFFBE6"/><stop offset="50%" stop-color="#FFE27A"/><stop offset="100%" stop-color="#FAC83C"/></radialGradient></defs><circle cx="50" cy="50" r="48" fill="url(#tbsun)"/><path d="M16 20 C 42 40, 42 60, 16 80" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="3" stroke-linecap="round"/><path d="M84 20 C 58 40, 58 60, 84 80" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="3" stroke-linecap="round"/></svg></div>
    <div class="court"><div class="pl base"></div><div class="pl side"></div></div>
    <div class="sp-burst"><span class="s1">★ Nyhet ★</span><span class="s2">SUMMER<br>EDITION</span><span class="s3">Säsong 2026</span></div>
    <div class="sp-when"><span class="d">${d}</span><span class="t">${t}${t?' · ':''}${cta}</span></div>
    <div class="sp-logo"><span class="line" style="color:#0D2E20">BÅSTAD</span><span class="line" style="color:#fff">STEGEN</span></div>
    <div class="frame"></div>
  </div>`;
}
function renderAnmalan(){
  const el=document.getElementById('view-anmalan');
  let html='';
  const openEvents=events.filter(e=>e.status==='open').sort((a,b)=>a.play_date.localeCompare(b.play_date));
  if(openEvents.length) html+=posterHtml(openEvents[0]);
  if(!me){
    html+=`<div class="panel"><div class="label">Logga in för att anmäla dig</div>

  el.innerHTML=html;
}

// ── STÄLLNING ──
function renderStallning(){
  const el=document.getElementById('view-stallning');
  // Drop-in: ställningen byggs upp av dem som faktiskt spelat i sommar.
  // Ingen är med automatiskt — man måste anmäla sig och spela.
  // Poängserie: vinst = 3 p, förlust = 1 p (spelad match). Missad vecka = 0 p, inget straff.
  const WIN_P=3, LOSS_P=1;
  const wl={};
  const ens=id=>{ wl[id]=wl[id]||{w:0,l:0,p:0,gw:0,gl:0}; return wl[id]; };
  matches.forEach(m=>{ if(!m.winner_id)return; const lo=m.winner_id===m.player_a_id?m.player_b_id:m.player_a_id;
    ens(m.winner_id).w++; ens(m.winner_id).p+=WIN_P;
    ens(lo).l++; ens(lo).p+=LOSS_P;
    // gemskillnad: räkna vanliga set (ej supertiebreak)
    (m.sets||[]).forEach(s=>{ if(s && !s.super && typeof s.a==='number' && typeof s.b==='number'){
      ens(m.player_a_id).gw+=s.a; ens(m.player_a_id).gl+=s.b;
      ens(m.player_b_id).gw+=s.b; ens(m.player_b_id).gl+=s.a;
    }});
  });
  const ids=Object.keys(wl).map(Number);
  if(!ids.length){
    el.innerHTML=`<div class="label">Sommarserien · ställning</div>
      <div class="muted" style="padding:20px 4px;line-height:1.6">Ställningen byggs upp efterhand som matcher spelas.<br>Vinst ger 3 poäng, spelad match 1 poäng — dyk upp och spela för att klättra!</div>`;
    return;
  }
  const pct=s=>{ const pl=s.w+s.l; return pl?Math.round(s.w/pl*100):0; };
  const gd=s=>s.gw-s.gl;
  const gdStr=s=>{ const d=gd(s); return (d>=0?'+':'')+d; };
  ids.sort((a,b)=> (wl[b].p-wl[a].p) || (gd(wl[b])-gd(wl[a])) || (pct(wl[b])-pct(wl[a])) || (wl[b].w-wl[a].w) || nameById(a).localeCompare(nameById(b)));
  el.innerHTML=`<div class="label">Sommarserien · ställning</div>`
    +`<div class="row" style="opacity:.6"><div class="rank">#</div><div class="nm" style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase">Spelare</div><div class="meta" style="font-family:'Space Mono',monospace;font-size:11px;text-align:right">Vinst-%<br>Poäng</div></div>`
    +ids.map((id,i)=>{ const s=wl[id]; const played=s.w+s.l;
        return `<div class="row${i===0?' top':''}"><div class="rank">${i+1}</div><div class="nm">${nameById(id)}<div class="meta" style="font-size:11px;opacity:.7">${played} spelade · ${s.w}V–${s.l}F · gem ${gdStr(s)}</div></div><div style="text-align:right"><div class="meta" style="font-family:'Space Mono',monospace;font-size:12px;color:var(--muted)">${pct(s)}%</div><div class="meta" style="font-family:'Anton',sans-serif;font-size:22px;color:var(--clay)">${s.p}</div></div></div>`;}).join('');
}

    }

        <button class="btn sm green" onclick="publishDraw('${e.play_date}')">Publicera</button>`;
    }
    if(isPub){

        const aw=isNaN(na), bw=isNaN(nb);
        if(aw!==bw) return aw?1:-1;
        return aw?0:(na-nb);
      });
      const partPlayers=[...spelareIds()].map(id=>players.find(p=>p.id===id)).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name,'sv'));

      const _len=_pv.length, _parts=_len<=160?1:Math.ceil(_len/153);

        <div class="muted" style="font-size:11px;margin:5px 0 9px" id="beskcnt-${e.play_date}">${_len} tecken · ~${_parts} SMS/spelare</div>
        <button class="btn sm" style="background:#FF8C42" onclick="sendBesked('${e.play_date}')">Skicka SMS + mail →</button>

    }
    if(isDraft || isPub){
      const sIds=signupsFor(e.play_date).map(s=>s.player_id);
      const av=players.filter(p=>p.active!==false && !sIds.includes(p.id));
      out+=`<div class="label" style="margin:14px 0 6px">Lägg till spelare efter lottning</div>
        <div class="row" style="gap:6px"><select id="late-${e.play_date}" style="flex:1"><option value="">Välj spelare…</option>${av.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>
        <button class="btn sm green" onclick="addLate('${e.play_date}')">Lägg till (väntande)</button></div>
        <div class="muted" style="font-size:11px;margin-top:5px">Sent tillagda paras ihop två och två till väntande matcher. Fler banor? Klicka "Ändra namn/tid/banor" ovan och lägg till dem — sätt sedan in väntande matcher på dem.</div>`;
    }
    out+=`<button class="btn sm alt" style="margin-top:10px" onclick="deleteEvent('${e.id}')">Ta bort</button></div>`;
    return out;
  }).join('');
}

// ── ACTIONS ──
async function login(){
  const name=document.getElementById('login-name').value, pin=document.getElementById('login-pin').value, err=document.getElementById('login-err');
  const p=players.find(x=>x.name===name);
  if(!p){ err.textContent='Välj ditt namn.'; err.classList.remove('hidden'); return; }
  try{ if(await BTS.verifyPin(p.id,pin)){ me=p; me._pin=pin; renderAnmalan(); renderMatcher(); }
    else { err.textContent='Fel PIN (4 sista i telefonnumret).'; err.classList.remove('hidden'); } }
  catch(e){ err.textContent='Fel: '+(e.message||e); err.classList.remove('hidden'); }
}
function logout(){ me=null; render(); }
async function adminLogin(){
  const pw=document.getElementById('admin-pw').value.trim();
  const err=document.getElementById('admin-login-err');
  if(!pw){ err.textContent='Ange adminlösenord.'; return; }
  err.textContent='Kontrollerar…';
  try{
    const ok=await BTS.adminCheck(pw);
    if(ok){ document.getElementById('admin-login').classList.add('hidden'); document.getElementById('admin-body').classList.remove('hidden'); err.textContent=''; }
    else { err.textContent='Fel adminlösenord.'; }
  }catch(e){ err.textContent='Fel: '+(e.message||e); }
}
function adminLogout(){
  document.getElementById('admin-body').classList.add('hidden');
  document.getElementById('admin-login').classList.remove('hidden');
  const pw=document.getElementById('admin-pw'); if(pw) pw.value='';
}
async function toggleSignup(date,on){
  try{ if(on) await BTS.addSignup(COMP,date,me.id,me._pin); else await BTS.removeSignup(COMP,date,me.id,me._pin); await load(); }
  catch(e){ alert('Fel: '+(e.message||e)); }
}
function isAdmin(){ const el=document.getElementById('admin-pw'); return !!(el && el.value.trim()); }
async function deferMatch(id,on){
  let planned=null;
  if(on){ const d=prompt('Spelas senare. Planerat datum (ÅÅÅÅ-MM-DD), t.ex. 2026-06-28 — lämna tomt om du inte vet:',''); if(d===null) return; const t=d.trim(); if(t && !/^\d{4}-\d{2}-\d{2}$/.test(t)){ alert('Ogiltigt datum. Skriv som ÅÅÅÅ-MM-DD (t.ex. 2026-06-28) eller lämna tomt.'); return; } planned=t||null; }
  const m=matches.find(x=>x.id===id);
  const iAmIn = m && me && (m.player_a_id===me.id || m.player_b_id===me.id);
  try{
    if(iAmIn){ await BTS.setDeferred(id, me.id, me._pin, on, planned); }

function dropinSets(id){
  const g=k=>{const e=document.getElementById(k+'-'+id);return e&&e.value!==''?parseInt(e.value):null;};
  const out=[];
  if(g('s1a')!=null&&g('s1b')!=null) out.push({a:g('s1a'),b:g('s1b')});
  if(g('s2a')!=null&&g('s2b')!=null) out.push({a:g('s2a'),b:g('s2b')});
  if(g('stba')!=null&&g('stbb')!=null) out.push({a:g('stba'),b:g('stbb'),super:true});
  return out;
}
function winnerFromSets(sets,aId,bId){ let a=0,b=0; sets.forEach(s=>{ if(s.a>s.b)a++; else if(s.b>s.a)b++; }); return a>b?aId:(b>a?bId:null); }
function autoWin(id,aId,bId){
  const sets=dropinSets(id), w=winnerFromSets(sets,aId,bId), el=document.getElementById('aw-'+id); if(!el)return;

}

  if(!p){ if(err){ err.textContent='Välj ditt namn.'; err.classList.remove('hidden'); } return; }
  try{
    if(await BTS.verifyPin(p.id,pin)){ me=p; me._pin=pin; renderSpelare(); const pe=document.getElementById('pf-edit'); if(pe) pe.classList.remove('hidden'); renderAnmalan(); renderMatcher(); }
    else if(err){ err.textContent='Fel PIN (4 sista i telefonnumret).'; err.classList.remove('hidden'); }
  }catch(e){ if(err){ err.textContent='Fel: '+(e.message||e); err.classList.remove('hidden'); } }
}
async function saveMyProfile(btn){
  if(!me){ alert('Logga in först.'); return; }
  const email=(document.getElementById('p-email')||{}).value||'';
  const phone=(document.getElementById('p-phone')||{}).value||'';
  const data={
    born:(document.getElementById('p-born')||{}).value||'',
    hand:(document.getElementById('p-hand')||{}).value||'',
    hometown:(document.getElementById('p-hometown')||{}).value||'',
    favShot:(document.getElementById('p-favshot')||{}).value||'',
    favSurface:(document.getElementById('p-surface')||{}).value||'',
    since:(document.getElementById('p-since')||{}).value||'',
    bio:(document.getElementById('p-bio')||{}).value||'',
  };
  const orig=btn?btn.textContent:'';
  if(btn){ btn.textContent='Sparar…'; btn.disabled=true; }
  try{
    await BTS.setProfile(me.id, me._pin, data);
    if(email.trim()) await BTS.setEmail(me.id, me._pin, email.trim());
    await BTS.setPhone(me.id, me._pin, phone.trim());
    const row=players.find(p=>p.id===me.id);
    if(row){ row.born=data.born; row.hand=data.hand; row.hometown=data.hometown; row.fav_shot=data.favShot; row.fav_surface=data.favSurface; row.since_year=data.since; row.bio=data.bio; row.phone=phone.trim(); }
    if(btn){ btn.textContent='Sparad! ✓'; setTimeout(()=>{ if(btn){ btn.textContent=orig; btn.disabled=false; } },2000); }
  }catch(e){ if(btn){ btn.textContent=orig; btn.disabled=false; } alert('Kunde inte spara profilen: '+(e?.message||e)); }
}
async function uploadPhoto(input){
  const f=input.files&&input.files[0]; if(!f||!me) return;
  const st=document.getElementById('p-photo-status'); if(st) st.textContent='Laddar upp…';
  try{
    const url=await BTS.uploadAvatar(me.id,f);
    await BTS.setPhoto(me.id,me._pin,url);
    const row=players.find(p=>p.id===me.id); if(row) row.photo_url=url;
    renderSpelare();
    const pe=document.getElementById('pf-edit'); if(pe) pe.classList.remove('hidden');
    const st2=document.getElementById('p-photo-status'); if(st2) st2.textContent='✓ Bild sparad — syns för alla på stegen.';
  }catch(e){ if(st) st.textContent='Fel: '+(e.message||e); }
}
async function savePin(){
  const p=(document.getElementById('p-newpin')||{}).value||'';
  if(p.length!==4||!/^\d{4}$/.test(p)){ alert('PIN måste vara exakt 4 siffror'); return; }
  try{
    const ok=await BTS.setPin(me.id,me._pin,p);
    if(ok){ me._pin=p; const el=document.getElementById('p-newpin'); if(el) el.value=''; alert('PIN ändrad! Kom ihåg den.'); }
    else alert('Kunde inte byta PIN.');
  }catch(err){ alert('Fel vid PIN-byte: '+(err?.message||err)); }
}
function showTab(name,el){
  tab=name;
  ['anmalan','matcher','stallning','spelare'].forEach(t=>document.getElementById('view-'+t).classList.toggle('hidden',t!==name));
  if(name==='spelare') renderSpelare();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
}

load();
setInterval(()=>{ if(window.BTS&&BTS.ready()) load(); }, 60000);

// Direktlänk till sommarstege-admin: #admin öppnar panelen och fokuserar lösenordsfältet
function openAdminFromHash(){
  if(location.hash!=='#admin') return;
  const p=document.getElementById('admin-panel');
  if(!p) return;
  p.classList.remove('hidden');
  const pw=document.getElementById('admin-pw');
  if(pw){ setTimeout(()=>{ try{ pw.scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){} pw.focus(); }, 250); }
}
openAdminFromHash();
window.addEventListener('hashchange', openAdminFromHash);
