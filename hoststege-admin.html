<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Höststegen – admin · Båstad Stegen</title>
<style>
  :root{ --green:#0D2E20; --cream:#FAF6EF; --ink:#12241b; --muted:#5d6b62; --gold:#F4B740;
    --line:#e7dfd2; --up:#1c7a3f; --down:#b9440a; }
  *{box-sizing:border-box}
  body{margin:0;background:#eef0ea;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:var(--ink);padding:22px 14px}
  .wrap{max-width:720px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 16px}
  input[type=password]{width:100%;font:inherit;font-size:15px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;outline:none}
  .btn{background:var(--green);color:#fff;border:0;border-radius:9px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}
  .btn.go{background:var(--gold);color:var(--green);width:100%;font-size:16px;padding:15px}
  .btn:disabled{opacity:.55;cursor:default}
  .prog{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 8px}
  .pill{background:var(--cream);border:1px solid var(--line);border-radius:100px;padding:7px 13px;font-size:13px;font-weight:700}
  .pill.ok{background:#e7f6ec;color:var(--up);border-color:#bfe6cc}
  h3{font-size:14px;margin:16px 0 8px;color:var(--green)}
  .mv{font-size:13.5px;line-height:1.7}
  .mv .u{color:var(--up);font-weight:700} .mv .d{color:var(--down);font-weight:700}
  .state{color:var(--muted);font-size:13px;margin-top:8px}
  .warn{background:#fff7e6;border:1px solid #f0d9a0;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
  a{color:var(--down)}
  details.sgrp{border:1px solid var(--line);border-radius:11px;margin-top:12px;overflow:hidden}
  details.sgrp>summary{cursor:pointer;padding:13px 15px;font-weight:800;color:var(--green);list-style:none;display:flex;align-items:center;gap:9px;background:var(--cream)}
  details.sgrp>summary::-webkit-details-marker{display:none}
  details.sgrp>summary::before{content:'▸';color:var(--gold);font-size:12px;transition:transform .15s}
  details.sgrp[open]>summary::before{transform:rotate(90deg)}
  .grpdate{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 15px;border-top:1px solid var(--line);background:#fff}
  details.somg{border-top:1px solid var(--line);background:#fff}
  details.somg>summary{cursor:pointer;padding:11px 15px;font-weight:700;font-size:13.5px;color:var(--ink);list-style:none;display:flex;align-items:center;gap:8px}
  details.somg>summary::-webkit-details-marker{display:none}
  details.somg>summary::before{content:'▸';color:var(--muted);font-size:11px;transition:transform .15s}
  details.somg[open]>summary::before{transform:rotate(90deg)}
  .cnt{color:var(--muted);font-weight:400;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Höststegen — admin</h1>
  <p class="sub">Aktuell omgång, spelstatus och start av nästa omgång (upp/ner sköts automatiskt).</p>

  <div class="card" id="login">
    <label style="font-weight:700;font-size:14px">Adminlösenord</label>
    <input id="pw" type="password" placeholder="lösenord" onkeydown="if(event.key==='Enter')start()">
    <div style="height:10px"></div>
    <button class="btn" onclick="start()">Öppna →</button>
    <div class="state" id="ls"></div>
  </div>

  <div id="app" style="display:none"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/bts-data.js"></script>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let PW='', INFO=null, ROUND=1, ST=[], MATCHES=[], PLAYERS=[], ACT={week:1,note:''}, ATT=[], WAIT=[];

async function start(){
  const pw=(document.getElementById('pw').value||'').trim();
  const ls=document.getElementById('ls');
  if(!pw){ ls.textContent='Ange lösenord.'; return; }
  ls.textContent='Kontrollerar…';
  try{
    const ok=await BTS.adminCheck(pw); if(!ok) throw new Error('Fel lösenord');
    PW=pw; document.getElementById('login').style.display='none'; document.getElementById('app').style.display='';
    await load();
  }catch(e){ ls.textContent=(e.message||e); }
}

async function load(){
  INFO=await BTS.hostPoolInfo(); ROUND=INFO.current_round;
  [ST,MATCHES,PLAYERS]=await Promise.all([BTS.hostPoolStandings(ROUND), BTS.hostPoolMatches(ROUND), BTS.getPlayers()]);
  try{ ACT=await BTS.hostActive(); ATT=await BTS.hostAttendance(ROUND, ACT.week); }catch(e){ ACT={week:1,note:''}; ATT=[]; }
  try{ WAIT=await BTS.hostWaitlist(); }catch(e){ WAIT=[]; }
  render();
}

function movesFor(div){
  const rows=ST.filter(r=>r.division===div); if(!rows.length) return [];
  const levels=[...new Set(rows.map(r=>r.level))]; const top=Math.min(...levels),bot=Math.max(...levels);
  const labels=[...new Set(rows.map(r=>r.label))]; const out=[];
  labels.forEach(lab=>{
    const g=rows.filter(r=>r.label===lab).sort((a,b)=>a.rank-b.rank); const n=g.length; const lvl=g[0].level;
    g.forEach(r=>{
      let v=''; if(lvl===top){ v=r.rank>3?'down':''; } else if(lvl===bot){ v=r.rank<=2?'up':''; }
      else { v=r.rank<=2?'up':(r.rank>n-2?'down':''); }
      if(v) out.push({lab,name:r.name,dir:v});
    });
  });
  return out;
}

function render(){
  const app=document.getElementById('app');
  const inSet=new Set(ST.map(r=>r.player_id));
  const inRound=PLAYERS.filter(p=>inSet.has(p.id));
  const done=MATCHES.filter(m=>m.status==='done').length, tot=MATCHES.length;
  const perDiv=d=>{ const ms=MATCHES.filter(m=>m.division===d); const dd=ms.filter(m=>m.status==='done').length; return `${dd}/${ms.length}`; };
  const mv=d=>{ const m=movesFor(d); if(!m.length) return '<div class="state">Inga matcher spelade ännu.</div>';
    const ups=m.filter(x=>x.dir==='up').map(x=>`<span class="u">▲ ${esc(x.name)}</span> (Grupp ${esc(x.lab)})`);
    const dns=m.filter(x=>x.dir==='down').map(x=>`<span class="d">▼ ${esc(x.name)}</span> (Grupp ${esc(x.lab)})`);
    return `<div class="mv"><div>Upp: ${ups.join(', ')||'—'}</div><div>Ner: ${dns.join(', ')||'—'}</div></div>`;
  };
  const allDone = tot>0 && done===tot;
  app.innerHTML=`
    <div class="card">
      <div class="prog">
        <span class="pill">Omgång ${ROUND}</span>
        <span class="pill ${allDone?'ok':''}">${done}/${tot} matcher spelade</span>
        <span class="pill">Herr ${perDiv('H')}</span>
        <span class="pill">Dam ${perDiv('D')}</span>
      </div>
      <div class="state">Detaljer & rapportering finns på <a href="hoststege-spel.html" target="_blank">spel-sidan</a>.</div>
    </div>

    <div class="card">
      <h3>Kommande spelomgång (veckobekräftelse)</h3>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
        <label class="state">Spelomgång:</label>
        <input id="wk" type="number" min="1" value="${ACT.week}" style="width:70px;font:inherit;padding:9px;border:1px solid var(--line);border-radius:9px">
        <button class="btn" onclick="setWeek()">Sätt kommande</button>
      </div>
      <label class="state">Banor / info för veckan (inne/ute, antal banor, tider):</label>
      <textarea id="wknote" rows="2" style="width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:9px;margin-top:6px" placeholder="T.ex. Utomhus · 3 banor · söndag 09–12">${esc(ACT.note||'')}</textarea>
      <div style="margin-top:8px"><button class="btn" onclick="saveNote()">Spara info</button> <span class="state" id="wkmsg"></span></div>
      <div style="height:14px"></div>
      ${confirmSummary()}
    </div>

    ${schedCard()}

    <div class="card">
      <h3>Skicka påminnelse (SMS + mejl)</h3>
      <div class="state">SMS där mobil finns, annars mejl. Testa till dig själv först.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">
        <select id="remTmpl" style="flex:1 1 170px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:9px">
          <option value="confirm">Bekräfta spel</option>
          <option value="report">Rapportera resultat</option>
        </select>
        <select id="remTarget" style="flex:1 1 190px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:9px">
          <option value="unconfirmed">Ej svarat (bekräftelse)</option>
          <option value="unreported">Har ospelade matcher</option>
          <option value="all">Alla i höststegen</option>
        </select>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="remTest()">Testa till mig</button>
        <button class="btn go" style="flex:1" onclick="remSend()">Skicka påminnelse →</button>
      </div>
      <div class="state" id="remMsg"></div>
    </div>

    ${waitCard()}

    <div class="card">
      <h3>Förhandsvisning: flyttar till omgång ${ROUND+1}</h3>
      <div><b>Båstad Stegen Herr</b>${mv('H')}</div>
      <div style="margin-top:10px"><b>Båstad Stegen Dam</b>${mv('D')}</div>
      ${allDone?'':'<div class="warn">Alla matcher är inte inrapporterade än. Du kan ändå starta nästa omgång — ospelade matcher räknas som ospelade i tabellen.</div>'}
      <div style="height:12px"></div>
      <button class="btn go" onclick="advance()">Starta omgång ${ROUND+1} →</button>
      <div class="state" id="advs"></div>
    </div>

    <div class="card">
      <h3>Lägg till spelare (börjar längst ner)</h3>
      <div class="state">Lägger spelaren i bottengruppen i vald stege för aktuell omgång och skapar deras matcher.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <select id="lateDiv" style="flex:0 0 110px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:9px">
          <option value="H">Herr</option><option value="D">Dam</option>
        </select>
        <select id="latePlayer" style="flex:1 1 200px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:9px">
          ${inRound.length===PLAYERS.length ? '<option value="">(alla spelare är redan med)</option>' :
            '<option value="">Välj spelare…</option>'+PLAYERS.filter(p=>!inSet.has(p.id)).sort((a,b)=>a.name.localeCompare(b.name,'sv')).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}
        </select>
        <button class="btn" onclick="addLate()">Lägg till</button>
      </div>
      <div class="state" id="lates"></div>
    </div>`;
}

async function addLate(){
  const pid=parseInt(document.getElementById('latePlayer').value), div=document.getElementById('lateDiv').value;
  const s=document.getElementById('lates');
  if(!pid){ s.textContent='Välj en spelare.'; return; }
  s.textContent='Lägger till…';
  try{ await BTS.hostPoolAddLate(PW,pid,div); s.textContent='Tillagd i bottengruppen ✓'; await load(); }
  catch(e){ s.textContent='Fel: '+(e.message||e); }
}

function schedCard(){
  if(!MATCHES.length) return '';
  const divName={H:'Herr',D:'Dam'};
  const divs=[...new Set(MATCHES.map(m=>m.division))];
  let inner='';
  divs.forEach(dv=>{
    const labels=[...new Set(MATCHES.filter(m=>m.division===dv).map(m=>m.label))].sort();
    labels.forEach(lab=>{
      const ms=MATCHES.filter(m=>m.division===dv&&m.label===lab)
        .sort((a,b)=>((a.matchday||999)-(b.matchday||999))||a.a_name.localeCompare(b.a_name,'sv'));
      const doneG=ms.filter(m=>m.status==='done').length;
      let g=`<details class="sgrp"><summary>${divName[dv]||dv} · Grupp ${esc(lab)} <span class="cnt">(${ms.length} matcher · ${doneG} spelade)</span></summary>
        <div class="grpdate">
          <span class="state">Sätt samma datum på hela gruppen:</span>
          <input id="gd_${dv}_${lab}" type="date" style="font:inherit;padding:6px;border:1px solid var(--line);border-radius:8px">
          <button class="btn" style="padding:7px 11px;font-size:13px" onclick="fillGroupDate('${dv}','${lab}')">Sätt på alla</button>
        </div>`;
      const mds=[...new Set(ms.map(m=>m.matchday||0))];
      mds.forEach(md=>{
        const dayM=ms.filter(m=>(m.matchday||0)===md);
        const set=dayM.filter(m=>m.play_date).length;
        g+=`<details class="somg"><summary>Spelomgång ${md||'—'} <span class="cnt">(${dayM.length} matcher${set?` · ${set} med tid`:''})</span></summary>
          ${dayM.map(schedRow).join('')}</details>`;
      });
      g+='</details>';
      inner+=g;
    });
  });
  return `<div class="card"><h3>Tider &amp; banor (omgång ${ROUND})</h3>
    <div class="state">Öppna en grupp och en spelomgång, sätt datum, tid och bana per match — visas direkt på spel-sidan för spelarna.</div>
    ${inner}</div>`;
}
function schedRow(m){
  return `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 15px;border-top:1px solid var(--line)">
    <div style="flex:1 1 150px;font-size:13.5px;font-weight:600">${esc(m.a_name)} <span style="color:var(--muted)">–</span> ${esc(m.b_name)}</div>
    <input id="sd_${m.id}" type="date" value="${m.play_date||''}" style="font:inherit;padding:6px;border:1px solid var(--line);border-radius:8px">
    <input id="st_${m.id}" type="text" value="${esc(m.start_time||'')}" placeholder="09:00" style="width:64px;font:inherit;padding:6px;border:1px solid var(--line);border-radius:8px">
    <input id="sc_${m.id}" type="text" value="${esc(m.court||'')}" placeholder="Bana 1" style="width:88px;font:inherit;padding:6px;border:1px solid var(--line);border-radius:8px">
    <button class="btn" style="padding:7px 12px" onclick="saveSched(${m.id})">Spara</button>
    <span class="state" id="sm_${m.id}" style="min-width:14px"></span>
  </div>`;
}
async function saveSched(id){
  const d=document.getElementById('sd_'+id).value, t=document.getElementById('st_'+id).value.trim(), c=document.getElementById('sc_'+id).value.trim();
  const s=document.getElementById('sm_'+id); s.textContent='…';
  try{ await BTS.hostPoolSetSchedule(PW,id,d,t,c);
    const m=MATCHES.find(x=>x.id===id); if(m){ m.play_date=d||null; m.start_time=t||null; m.court=c||null; }
    s.textContent='✓'; setTimeout(()=>{ if(s.textContent==='✓') s.textContent=''; },1500);
  }catch(e){ s.textContent='✕'; alert('Fel: '+(e.message||e)); }
}
async function fillGroupDate(dv,lab){
  const d=document.getElementById('gd_'+dv+'_'+lab).value;
  if(!d){ alert('Välj ett datum först.'); return; }
  const ms=MATCHES.filter(m=>m.division===dv&&m.label===lab);
  if(!confirm('Sätt '+d+' som datum på alla '+ms.length+' matcher i gruppen? (tid/bana per match behålls)')) return;
  for(const m of ms){
    const t=(document.getElementById('st_'+m.id).value||'').trim(), c=(document.getElementById('sc_'+m.id).value||'').trim();
    try{ await BTS.hostPoolSetSchedule(PW,m.id,d,t,c); m.play_date=d; document.getElementById('sd_'+m.id).value=d; }catch(e){}
  }
  alert('Datum satt på gruppen ✓');
}
function waitCard(){
  if(!WAIT || !WAIT.length) return '';
  const dn={H:'Herr',D:'Dam'};
  const rows=WAIT.map(w=>`<div class="approw" style="display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px">
      <div><b>${esc(w.name)}</b> <span class="state">· ${dn[w.division]||w.division}</span></div>
      <div class="state">${w.phone?esc(w.phone):(w.email?esc(w.email):'')}</div></div>`).join('');
  return `<div class="card">
    <h3>Väntelista (${WAIT.length}) — kommer in vid nästa omgångsstart</h3>
    <div class="state">Nyanmälda placeras automatiskt längst ner i sin stege när du trycker "Starta omgång ${ROUND+1}".</div>
    ${rows}</div>`;
}
function confirmSummary(){
  const play=ATT.filter(a=>a.playing===true), cant=ATT.filter(a=>a.playing===false), no=ATT.filter(a=>a.playing===null||a.playing===undefined);
  const list=arr=>arr.map(a=>esc(a.name)).join(', ')||'—';
  return `<div class="prog">
      <span class="pill ok">${play.length} spelar</span>
      <span class="pill out">${cant.length} kan inte</span>
      <span class="pill">${no.length} ej svarat</span>
    </div>
    <div class="mv" style="margin-top:10px"><div><b>Kan inte:</b> ${list(cant)}</div>
      <div style="margin-top:6px"><b>Ej svarat:</b> ${list(no)}</div></div>`;
}
async function setWeek(){
  const w=parseInt(document.getElementById('wk').value); if(!w) return;
  try{ await BTS.hostSetWeek(PW,w); await load(); }catch(e){ alert('Fel: '+(e.message||e)); }
}
async function saveNote(){
  const n=document.getElementById('wknote').value; const m=document.getElementById('wkmsg'); m.textContent='Sparar…';
  try{ await BTS.hostSetWeekNote(PW,n); ACT.note=n; m.textContent='Sparat ✓'; setTimeout(()=>{if(m.textContent==='Sparat ✓')m.textContent='';},1500); }
  catch(e){ m.textContent='Fel: '+(e.message||e); }
}
function remTmpl(){ return document.getElementById('remTmpl').value; }
function remTgt(){ return document.getElementById('remTarget').value; }
async function remTest(){
  const m=document.getElementById('remMsg'); m.textContent='Skickar test till dig…';
  try{ const r=await BTS.hostReminder(PW, remTmpl(), remTgt(), {test:true, testPhone:'0720787845', testEmail:'joaquim@cxdesign.se'});
    m.textContent=`Test skickat ✓ (SMS ${r.sms.sent}, mejl ${r.email.sent})`; }
  catch(e){ m.textContent='Fel: '+(e.message||e); }
}
async function remSend(){
  if(!confirm('Skicka påminnelse till vald målgrupp nu?')) return;
  const m=document.getElementById('remMsg'); m.textContent='Skickar…';
  try{ const r=await BTS.hostReminder(PW, remTmpl(), remTgt(), {});
    m.textContent=`Skickat till ${r.recipients} (SMS ${r.sms.sent}, mejl ${r.email.sent})`+(r.errors&&r.errors.length?` · fel: ${r.errors.length}`:''); }
  catch(e){ m.textContent='Fel: '+(e.message||e); }
}
async function advance(){
  if(!confirm('Starta omgång '+(ROUND+1)+'? Grupperna för nästa omgång skapas utifrån nuvarande ställning (2 upp / 2 ner / 1 kvar).')) return;
  const s=document.getElementById('advs'); s.textContent='Skapar nästa omgång…';
  try{ const to=await BTS.hostPoolAdvance(PW,ROUND); s.textContent='Klart! Omgång '+to+' är skapad.'; await load(); }
  catch(e){ s.textContent='Fel: '+(e.message||e); }
}
</script>
</body>
</html>
