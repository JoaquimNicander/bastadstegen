<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTS — Omröstning</title>
<link rel="icon" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0C1409; --card:#13200F; --card2:#182810; --border:#1e2a1a; --border2:#2a3a22;
    --cream:#EDEAE0; --white:#fff; --muted:#9aa78c; --muted2:#6f7766; --green:#4CAF50; --clay:#C17849;
    --o1:#FF8C42; --o2:#E8520A; --o3:#C43E00; --navy:#0D2E20; --court-line:#F6EFE2;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--cream);min-height:100vh}
  .topbar{display:flex;justify-content:space-between;padding:12px 18px;font-size:13px}
  .topbar a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.28);padding:7px 13px;border-radius:8px;background:rgba(0,0,0,.18)}
  .hero{position:relative;overflow:hidden;text-align:center;padding:46px 20px 34px;background:linear-gradient(150deg,var(--o1) 0%,var(--o2) 46%,var(--o3) 100%)}
  .hero .lines{position:absolute;inset:0;transform-origin:60% 72%}
  .hero .persp{position:absolute;inset:0;transform:perspective(1000px) rotateX(40deg) rotateZ(-6deg);transform-origin:58% 80%}
  .hero .pline{position:absolute;background:var(--court-line);box-shadow:0 0 0 1px rgba(120,40,0,.18),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(120,40,0,.12)}
  .hero #h-base{left:-12%;right:-26%;top:76%;height:34px}
  .hero #h-side{left:58%;top:24%;bottom:14%;width:34px}
  .hero .tex-hair{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(170deg,transparent 0 18px,rgba(0,0,0,0.05) 18px 19px)}
  .hero-lock{position:relative;z-index:3;width:min(78vw,440px);margin:0 auto}
  .hero-lock .bts-lockup{width:100%;max-width:none}
  .hero .tag{position:relative;z-index:3;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:1px;color:#2a1c0e;margin-top:12px;line-height:1.5;padding:0 10px}
  .wrap{max-width:560px;margin:0 auto;padding:22px 18px 60px}
  .msg{color:var(--muted);font-size:14px;text-align:center;margin-bottom:18px;line-height:1.6}
  .opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--border2);border-radius:12px;padding:16px 18px;margin-bottom:12px;cursor:pointer;color:var(--cream);transition:border-color .15s,background .15s}
  .opt:hover{border-color:var(--clay)}
  .opt.sel{border-color:var(--green);background:rgba(76,175,80,.10)}
  .opt-label{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px;color:var(--white)}
  .opt.sel .opt-label{color:var(--green)}
  .opt-desc{font-size:13px;color:var(--muted);margin-top:2px}
  .label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:26px 0 12px}
  .res{margin-bottom:14px}
  .res-top{display:flex;justify-content:space-between;font-size:13px;color:var(--cream);margin-bottom:5px}
  .res-top .pct{font-family:'Space Mono',monospace;color:var(--clay)}
  .bar{height:12px;background:var(--card2);border:1px solid var(--border);border-radius:100px;overflow:hidden}
  .bar-fill{height:100%;background:linear-gradient(90deg,#E9A864,var(--clay));border-radius:100px;transition:width .5s ease}
  .ibox{margin-top:34px;background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:18px}
  input{width:100%;padding:11px;border-radius:8px;border:1px solid var(--border2);background:var(--card2);color:var(--white);font-size:15px;margin-bottom:9px;font-family:inherit}
  .vbtn{width:100%;background:var(--clay);color:#0C0A06;border:none;font-weight:700;padding:12px;border-radius:8px;cursor:pointer;font-size:15px}
  .vbtn.alt{background:var(--card2);color:var(--cream);border:1px solid var(--border2)}
  .admin-toggle{font-size:11px;color:var(--muted2);text-align:center;margin-top:26px;cursor:pointer}
  .hidden{display:none}
</style>
</head>
<body>
<div class="topbar"><a href="index.html">← Start</a><a href="stegen.html">Stegen →</a></div>
<div class="hero">
  <div class="tex-hair"></div>
  <div class="lines"><div class="persp">
    <div class="pline" id="h-base"></div>
    <div class="pline" id="h-side"></div>
  </div></div>
  <div class="hero-lock">
    <div class="bts-lockup">
      <svg viewBox="0 -150 470 400" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;overflow:visible;display:block">
        <g class="bl-trail"></g>
        <g class="bl-ball"><circle r="13" fill="#D7F23C"/>
          <path d="M-10 -9 C -3 -3,-3 3,-10 9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
          <path d="M10 -9 C 3 -3,3 3,10 9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/></g>
        <g class="bl-words">
          <text x="4" y="100" font-family="'Anton',sans-serif" font-size="96" fill="#0D2E20">BÅSTAD</text>
          <text x="4" y="176" font-family="'Anton',sans-serif" font-size="96" fill="#ffffff">STEGEN</text>
        </g>
      </svg>
    </div>
  </div>
  <div class="tag">🎾 Vilket format vill du ha till nästa stege?<br>Rösta nedan — alla får vara med!</div>
</div>
<div class="wrap">
  <input id="voter-name" placeholder="Ditt namn" autocomplete="name">
  <div id="msg" class="msg" style="margin:6px 0 16px">Skriv ditt namn och klicka på det format du föredrar.</div>
  <div id="options"></div>
  <div class="label">Resultat · <span id="total">0</span> röster</div>
  <div id="results"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/bts-data.js"></script>
<script>
const POLL='format-2026';
const OPTS=[
  {key:'sommar',       label:'Sommarstege',         desc:'Drop-in / pop-up — anmäl dig per speldag'},
  {key:'traditionell', label:'Traditionell stege',  desc:'Fasta omgångar, klättra i stegen'},
  {key:'bada',         label:'Spelar ingen roll',   desc:'Jag vill vara med oavsett format'},
];
let results=[];
const LBL={sommar:'Sommarstege',traditionell:'Traditionell stege',bada:'Spelar ingen roll'};
function stored(){ try{return JSON.parse(localStorage.getItem('bts_poll_'+POLL)||'null')}catch(e){return null} }
function setStored(o){ localStorage.setItem('bts_poll_'+POLL, JSON.stringify(o)); }
function countFor(k){ const r=results.find(x=>x.choice===k); return r?Number(r.antal):0; }

function render(){
  const mine=stored();
  const nameEl=document.getElementById('voter-name');
  if(mine&&mine.name&&nameEl&&!nameEl.value) nameEl.value=mine.name;
  document.getElementById('options').innerHTML=OPTS.map(o=>{
    const sel=mine&&mine.choice===o.key;
    return `<button class="opt${sel?' sel':''}" onclick="vote('${o.key}')">
      <div class="opt-label">${o.label}${sel?' ✓':''}</div>
      <div class="opt-desc">${o.desc}</div>
    </button>`;
  }).join('');
  const cS=countFor('sommar'), cT=countFor('traditionell'), cB=countFor('bada');
  const voters=cS+cT+cB;
  document.getElementById('total').textContent=voters;
  const supS=cS+cB, supT=cT+cB;
  const bar=(label,sup)=>{ const pct=voters?Math.round(sup/voters*100):0;
    return `<div class="res"><div class="res-top"><span>${label}</span><span class="pct">${pct}% · ${sup}</span></div>`
      +`<div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div></div>`; };
  document.getElementById('results').innerHTML =
    bar('Sommarstege', supS) + bar('Traditionell stege', supT)
    + (cB?`<div style="font-size:12px;color:var(--muted2);margin-top:8px">Varav ${cB} röstade "spelar ingen roll" — räknas till båda.</div>`:'');
  document.getElementById('msg').textContent = mine
    ? 'Tack '+(mine.name||'')+'! Du röstade på "'+(LBL[mine.choice]||mine.choice)+'". Klicka ett annat alternativ för att ändra.'
    : 'Skriv ditt namn och klicka på det format du föredrar.';
}

async function vote(choice){
  const name=document.getElementById('voter-name').value.trim();
  const mine=stored();
  const msg=document.getElementById('msg');
  if(!name && !(mine&&mine.id)){ msg.textContent='Skriv ditt namn först.'; return; }
  try{
    if(mine&&mine.id){ await BTS.updateVoteAnon(mine.id,POLL,choice); setStored({id:mine.id,choice,name:mine.name||name}); }
    else { const id=await BTS.voteAnon(POLL,choice,name); setStored({id,choice,name}); }
    await load();
  }catch(e){ msg.textContent='Kunde inte spara rösten: '+(e.message||e); }
}

async function load(){
  try{ if(window.BTS&&BTS.ready()) results=await BTS.pollResults(POLL); }catch(e){ console.warn(e); }
  render();
}
load();
setInterval(()=>{ if(window.BTS&&BTS.ready()) load(); }, 30000);

/* ---- Animerad logga (boll kommer in, ord tonar fram) ---- */
document.querySelectorAll('.bts-lockup').forEach(function(box){
  var svg=box.querySelector('svg'), ball=box.querySelector('.bl-ball'),
      trail=box.querySelector('.bl-trail'), words=box.querySelector('.bl-words');
  if(!svg||!ball||!words) return;
  var ns='http://www.w3.org/2000/svg';
  var p=document.createElementNS(ns,'path'); p.setAttribute('d','M-26 26 Q 158 -245 312 26'); p.setAttribute('fill','none'); svg.appendChild(p);
  var L=p.getTotalLength(), N=14, dots=[];
  for(var i=1;i<=N;i++){ var pt=p.getPointAtLength((i/(N+1))*L); var c=document.createElementNS(ns,'circle');
    c.setAttribute('cx',pt.x);c.setAttribute('cy',pt.y);c.setAttribute('r',2.6);c.setAttribute('fill','rgba(255,255,255,0.9)');c.setAttribute('opacity','0');trail.appendChild(c);dots.push({el:c,at:i/(N+1)}); }
  words.style.opacity=0; words.style.transition='opacity .55s ease';
  function setBall(x,y){ ball.setAttribute('transform','translate('+x+' '+y+')'); }
  var ease=function(t){return 1-Math.pow(1-t,3);};
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){ var e=p.getPointAtLength(L); setBall(e.x,e.y); dots.forEach(function(d){d.el.setAttribute('opacity','0.9');}); words.style.opacity=1; return; }
  var t0=null;
  function fr(ts){ if(!t0)t0=ts; var t=(ts-t0)/1000;
    if(t<1.2){ var a=ease(Math.min(t/1.2,1)); var pt=p.getPointAtLength(a*L); setBall(pt.x,pt.y); dots.forEach(function(d){ d.el.setAttribute('opacity', a>=d.at?'0.9':'0'); }); if(t>0.55) words.style.opacity=1; requestAnimationFrame(fr); }
    else { var e=p.getPointAtLength(L); setBall(e.x,e.y); dots.forEach(function(d){d.el.setAttribute('opacity','0.9');}); words.style.transition='none'; words.style.opacity=1;
      var fresh=words.cloneNode(true); fresh.style.opacity=1; fresh.style.transition='none'; words.parentNode.replaceChild(fresh,words); }
  }
  setBall(-22,22); requestAnimationFrame(fr);
});
</script>
</body>
</html>
